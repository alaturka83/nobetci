<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Nöbet Dağıtım Programı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>

/* ==============================================================
 * Nöbet Dağıtım Programı — Stil Tanımları (Yeniden Tasarım)
 * Not: İşlevsellik ve veri davranışı hiçbir şekilde değişmedi.
 * Bu dosyada yalnızca görsel katman (renk, tipografi, boşluk,
 * bileşen görünümleri) yeniden kuruldu. Tüm class/id adları ve
 * JS'in doğrudan kullandığı --navy, --gold, --line, --muted,
 * --danger, --ok, --text, --bg, --card gibi CSS değişken adları
 * KORUNDU (yalnızca değerleri yenilendi) çünkü ekranlar bu
 * değişkenleri satır-içi stillerde referans alıyor.
 * ============================================================== */

:root{
  --navy:#122240;          /* birincil mürekkep lacivert — kimlik rengi */
  --navy-2:#20406B;        /* ikincil lacivert — hover / gradyan ortağı */
  --navy-soft:#E9EFF7;     /* açık lacivert ton — rozet/zemin */
  --gold:#B0781F;          /* vurgu — "ALTIN" istatistik etiketiyle de eşleşir */
  --gold-light:#D9A441;
  --gold-soft:#FAF0DC;
  --bg:#EEF0F4;            /* uygulama zemini — serin, nötr kağıt tonu */
  --card:#FFFFFF;
  --line:#DEE2EA;
  --text:#182033;
  --muted:#666F86;
  --danger:#C0392B;
  --danger-bg:#FBEAE8;
  --ok-bg:#E8F5EE;
  --ok:#1E7A4C;
  --sidebar-w:272px;
  --radius:14px;
  --radius-sm:9px;
  --shadow-card:0 1px 2px rgba(18,34,64,.05), 0 10px 24px -14px rgba(18,34,64,.22);
  --shadow-pop:0 18px 44px -14px rgba(10,18,34,.35);
  --fs-xs:11px;
  --fs-sm:12.5px;
  --fs-base:13.5px;
  --fs-lg:15.5px;
  --fs-xl:18px;

  /* Yeni: ikincil "canlı" vurgu — anlam taşımayan yapısal öğelerde
     (aktif menü göstergesi, odak halkası, bölüm ayraçları) kullanılır;
     "--gold" istatistik ekranındaki "ALTIN" anlamını korusun diye
     dokunulmadı, bu yüzden ayrı bir değişken eklendi. */
  --accent:#0E7C6B;
  --accent-2:#0A5F53;
  --accent-soft:#E3F3F0;
  --font:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);display:flex;min-height:100vh;text-transform:uppercase;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;}
input, textarea, select, button { text-transform: uppercase; font-family: inherit; }
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px;}

.ico{display:inline-flex;flex-shrink:0;}
.ico svg{width:1em;height:1em;display:block;}

/* ---------------------------------------------------------------
   Kenar çubuğu (sidebar)
--------------------------------------------------------------- */
aside.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,var(--navy) 0%,#0C1B33 100%);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:200;overflow-y:auto;box-shadow:2px 0 0 rgba(0,0,0,.04);}
.sidebar-header{padding:28px 20px 20px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-logo{max-width:72px;max-height:72px;margin:0 auto 14px;display:block;object-fit:contain;}
.sidebar-header h1{font-size:13.5px;margin:0;font-weight:800;letter-spacing:.4px;color:#fff;line-height:1.4;}
.sidebar-header .sub{font-size:10px;color:#8FA3C4;margin-top:6px;letter-spacing:.7px;font-weight:700;}

nav.nav-menu{display:flex;flex-direction:column;padding:18px 12px;flex:1;gap:3px;}
nav.nav-menu button{background:transparent;border:none;border-left:3px solid transparent;color:#AAB8D1;padding:12px 12px 12px 11px;font-size:12px;cursor:pointer;text-align:left;font-weight:700;display:flex;align-items:center;gap:12px;border-radius:0 10px 10px 0;letter-spacing:.3px;transition:background .15s ease,color .15s ease,border-color .15s ease;}
nav.nav-menu button .ico{font-size:16px;color:#7488A9;width:30px;height:30px;align-items:center;justify-content:center;background:rgba(255,255,255,.04);border-radius:8px;transition:background .15s ease,color .15s ease;}
nav.nav-menu button:hover{background:rgba(255,255,255,.05);color:#fff;}
nav.nav-menu button:active{background:rgba(255,255,255,.1);}
nav.nav-menu button.active{color:#fff;background:rgba(255,255,255,.06);border-left-color:var(--accent);}
nav.nav-menu button.active .ico{color:#fff;background:var(--accent);}

.sidebar-footer{padding:16px 20px;font-size:10px;color:#8FA3C4;text-align:center;border-top:1px solid rgba(255,255,255,.08);letter-spacing:.4px;}
.sidebar-footer #saveStatus{display:inline-flex;align-items:center;gap:6px;}
.sidebar-footer #saveStatus:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;box-shadow:0 0 0 3px rgba(14,124,107,.25);}

main.content{margin-left:var(--sidebar-w);flex:1;padding:32px 34px 64px;max-width:calc(100vw - var(--sidebar-w));}

/* ---- Mobil üst çubuk + alt gezinme çubuğu (yalnızca dar ekranlarda görünür) ---- */
.mobile-topbar{display:none;}
.mobile-bottom-nav{display:none;}

@media screen and (max-width: 900px){
  body{display:block;}
  .mobile-topbar{
    display:flex;align-items:center;gap:10px;
    position:fixed;top:0;left:0;right:0;height:56px;z-index:150;
    background:linear-gradient(180deg,var(--navy) 0%,#0C1B33 100%);padding:0 16px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .mobile-topbar .mt-logo{width:30px;height:30px;object-fit:contain;flex-shrink:0;display:none;border-radius:7px;}
  .mobile-topbar .mt-title{color:#fff;font-size:12.5px;font-weight:800;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mobile-topbar .mt-sub{color:#8FA3C4;font-size:9.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.4px;}
  .mobile-topbar .mt-cikis-btn{flex:0 0 auto;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font-weight:800;font-size:10.5px;padding:7px 10px;border-radius:8px;cursor:pointer;}

  aside.sidebar{display:none;}

  .mobile-bottom-nav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:150;
    background:linear-gradient(0deg,var(--navy) 0%,#0C1B33 100%);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 14px rgba(0,0,0,.2);
  }
  .mobile-bottom-nav button{
    flex:1 1 0;background:none;border:none;color:#7488A9;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;padding:6px 2px;font-size:9.5px;font-weight:700;
    letter-spacing:.1px;border-radius:10px;cursor:pointer;min-height:50px;
  }
  .mobile-bottom-nav button .ico{font-size:18px;}
  .mobile-bottom-nav button.active{color:#fff;background:rgba(255,255,255,.08);}
  .mobile-bottom-nav button.active .ico{color:var(--accent);}
  .mobile-bottom-nav button:active{background:rgba(255,255,255,.1);}

  main.content{margin-left:0;max-width:100vw;padding:72px 16px 82px;}
}

@media screen and (max-width: 520px){
  main.content{padding:66px 12px 82px;}
  .card{padding:16px;}
  .subcard{padding:14px 15px;}
}

/* ---------------------------------------------------------------
   Kart / form bileşenleri
--------------------------------------------------------------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px;margin-bottom:22px;box-shadow:var(--shadow-card);}
.card h2{font-size:var(--fs-xl);margin:0 0 8px;color:var(--navy);font-weight:800;display:flex;align-items:center;gap:12px;letter-spacing:.1px;}
.card h2 .ico{font-size:18px;color:var(--gold);background:var(--gold-soft);border-radius:10px;width:38px;height:38px;align-items:center;justify-content:center;flex-shrink:0;}
.card .desc{font-size:var(--fs-sm);color:var(--muted);margin:0 0 18px;text-transform:none;line-height:1.55;max-width:720px;}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:6px;min-width:auto;flex:0 1 auto;}
.field.grow{flex:1 1 200px;}
.field label{font-size:var(--fs-xs);color:var(--muted);font-weight:800;letter-spacing:.4px;}

input[type=text],input[type=number],input[type=date],textarea{
  border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;font-size:var(--fs-base);background:#FBFCFD;color:var(--text);width:100%;transition:border-color .12s ease,box-shadow .12s ease,background .12s ease;
}
input[type=text]:focus,input[type=number]:focus,input[type=date]:focus,textarea:focus,select:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none;background:#fff;
}
select{
  border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;font-size:var(--fs-base);background:#FBFCFD;color:var(--text);width:fit-content;max-width:100%;min-width:130px;cursor:pointer;
}
textarea{resize:vertical;min-height:80px;}

button.btn{background:var(--navy);color:#fff;border:none;border-radius:var(--radius-sm);padding:10px 18px;font-size:var(--fs-sm);cursor:pointer;font-weight:700;width:fit-content;max-width:100%;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.2px;transition:transform .08s ease,background .15s ease,box-shadow .15s ease;box-shadow:0 1px 2px rgba(18,34,64,.18);}
button.btn .ico{font-size:14px;}
button.btn:hover{background:var(--navy-2);box-shadow:0 4px 10px -3px rgba(18,34,64,.35);}
button.btn:active{transform:scale(.96);}
button.btn.gold{background:var(--gold);color:#fff;box-shadow:0 1px 2px rgba(176,120,31,.3);}
button.btn.gold:hover{background:#96650F;box-shadow:0 4px 10px -3px rgba(176,120,31,.4);}
button.btn.success{background:var(--ok);color:#fff;}
button.btn.success:hover{background:#155F3B;}
button.btn.outline{background:#fff;color:var(--navy);border:1.5px solid var(--line);box-shadow:none;}
button.btn.outline:hover{background:var(--navy-soft);border-color:var(--navy-2);}
button.btn.danger{background:#fff;color:var(--danger);border:1.5px solid #F0C6C2;box-shadow:none;}
button.btn.danger:hover{background:var(--danger-bg);border-color:var(--danger);}
button.btn.small{padding:7px 12px;font-size:var(--fs-xs);}
button.btn[disabled]{opacity:.45;cursor:not-allowed;}
button.btn[disabled]:active{transform:none;box-shadow:none;}

/* ---------------------------------------------------------------
   Tablo
--------------------------------------------------------------- */
.table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius-sm);border:1px solid var(--line);}
table.data{width:100%;border-collapse:collapse;margin-top:0;min-width:520px;}
table.data th,table.data td{border:1px solid var(--line);padding:10px 12px;font-size:var(--fs-sm);text-align:center;vertical-align:middle;}
table.data th{background:var(--navy-soft);color:var(--navy);font-size:var(--fs-xs);font-weight:800;letter-spacing:.4px;}
table.data td.yer{background:#F8F9FB;font-weight:800;color:var(--navy);text-align:center;}
table.data tbody tr:hover td{background:var(--accent-soft);}

/* Manuel düzenlenebilir nöbet hücreleri (kayıtlı/yayınlanmış dağıtım) */
table.data td.hucre-duz{position:relative;cursor:pointer;}
table.data td.hucre-duz:hover{background:var(--gold-soft,#FBF1D8);}
table.data td.hucre-duz .hucre-kalem-ico{position:absolute;top:2px;right:3px;font-size:10px;opacity:0;color:var(--navy);transition:opacity .12s;}
table.data td.hucre-duz:hover .hucre-kalem-ico{opacity:.7;}
.hucre-satir{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;}
.hucre-satir select{flex:1.3;min-width:140px;}
.hucre-satir input[type=text]{flex:1;min-width:120px;}
.hucre-satir .hucre-sil-satir{flex:0 0 auto;padding:6px 10px;}

/* ---------------------------------------------------------------
   Rozetler / etiketler / filtre çipleri
--------------------------------------------------------------- */
.pill{display:inline-block;background:var(--navy-soft);color:var(--navy);border-radius:20px;padding:5px 12px;font-size:var(--fs-xs);margin:2px 4px 2px 0;font-weight:700;}
.tip-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:var(--fs-xs);font-weight:800;letter-spacing:.3px;white-space:nowrap;}
.tip-badge.t-sabit{background:var(--accent-soft);color:var(--accent-2);}
.tip-badge.t-izinli{background:var(--ok-bg);color:var(--ok);}
.tip-badge.t-yasakli{background:var(--danger-bg);color:var(--danger);}
.tip-badge.t-muaf{background:#EEEFF3;color:var(--muted);}
.tip-badge.t-birlikte{background:var(--gold-soft);color:#8A5D14;}
.tip-badge.t-izinde{background:#F1EAFB;color:#6A439C;}
.chipbar{display:flex;flex-wrap:wrap;gap:7px;}
.chipbar button{background:#fff;border:1.5px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 14px;font-size:var(--fs-xs);font-weight:700;cursor:pointer;transition:background .12s ease,color .12s ease,border-color .12s ease;}
.chipbar button:hover{border-color:var(--navy-2);color:var(--navy);}
.chipbar button.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.ist-uyari{background:var(--gold-soft);color:#8A5A1E;border:1px solid #EFD9AE;border-radius:var(--radius-sm);padding:9px 13px;font-size:var(--fs-xs);font-weight:700;margin-top:8px;display:none;}
#istisnaFormCard.editing{border:1.5px solid var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

.stat-total{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:52px;}
.stat-total-num{font-size:14px;font-weight:800;color:var(--navy);}
.stat-bar-track{width:100%;height:5px;border-radius:3px;background:var(--navy-soft);overflow:hidden;}
.stat-bar-fill{height:100%;border-radius:3px;background:var(--navy-2);}
.stat-total.stat-high .stat-total-num{color:var(--danger);}
.stat-total.stat-high .stat-bar-fill{background:var(--danger);}
.stat-total.stat-low .stat-total-num{color:var(--gold);}
.stat-total.stat-low .stat-bar-fill{background:var(--gold);}

.stat-mini-row{display:flex;gap:14px;flex-wrap:wrap;}
.stat-mini{flex:1 1 150px;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 15px;}
.stat-mini .ico{width:38px;height:38px;border-radius:10px;background:var(--navy-soft);color:var(--navy);align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.stat-mini-num{font-size:19px;font-weight:800;color:var(--navy);line-height:1.15;}
.stat-mini-label{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.3px;margin-top:2px;}

.checkbox-box{display:flex;flex-wrap:wrap;gap:8px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;background:#FAFBFD;}
.check-chip{font-size:var(--fs-xs);display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--line);padding:7px 12px;border-radius:20px;font-weight:700;color:var(--text);cursor:pointer;transition:background .12s ease,border-color .12s ease,color .12s ease;}
.check-chip:hover{border-color:var(--navy-2);}
.check-chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2);}
.check-chip input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;flex-shrink:0;}
.pill.rm{cursor:pointer;transition:transform .08s ease;}
.pill.rm:active{transform:scale(.92);}
.pill.rm:after{content:" ×";color:var(--danger);font-weight:700;}
.empty{color:var(--muted);font-size:var(--fs-sm);font-style:italic;padding:10px 0;text-transform:none;}

.card-divider{border-top:1px solid var(--line);margin:6px 0 20px;}
.subtabs{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;border-bottom:none;padding-bottom:0;}
.subtabs button{display:inline-flex;align-items:center;gap:9px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 16px;margin-right:0;font-size:var(--fs-sm);cursor:pointer;color:var(--muted);font-weight:700;transition:color .12s ease,border-color .12s ease,background .12s ease;}
.subtabs button .ico{font-size:15px;color:var(--muted);transition:color .12s ease;}
.subtabs button:hover{color:var(--navy);border-color:var(--navy-2);}
.subtabs button.active{background:var(--gold-soft);color:#8A5D14;border-color:var(--gold-light);}
.subtabs button.active .ico{color:var(--gold);}

.notice{border-radius:var(--radius-sm);padding:13px 16px;font-size:var(--fs-sm);margin:14px 0;display:flex;align-items:flex-start;gap:10px;}
.notice .ico{margin-top:1px;flex-shrink:0;}
.notice.ok{background:var(--ok-bg);color:var(--ok);}
.notice.warn{background:var(--danger-bg);color:var(--danger);}

/* ---- Standart "Ayarlar" bölüm yapı taşları ---- */
.subhead{margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line);}
.subhead h3{font-size:var(--fs-lg);color:var(--navy);margin:0 0 5px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:8px;}
.subhead p{font-size:var(--fs-sm);color:var(--muted);margin:0;text-transform:none;line-height:1.55;max-width:640px;}

.subcard{background:#FAFBFD;border:1px solid var(--line);border-left:3px solid var(--navy-soft);border-radius:var(--radius);padding:17px 19px;margin-bottom:18px;}
.subcard-title{font-size:var(--fs-xs);color:var(--gold);font-weight:800;letter-spacing:.6px;margin:0 0 15px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.subcard-title .count{color:var(--muted);font-weight:700;letter-spacing:0;}

.field-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));gap:15px 17px;}
.field-grid .f-span2{grid-column:span 2;}
.field-grid .f-full{grid-column:1/-1;}
.field-grid .f-narrow{max-width:150px;}
.ekyer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px;}
.ekyer-box{border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;padding:9px 11px;}
.ekyer-box-title{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.3px;margin-bottom:6px;}
.ekyer-chips{display:flex;flex-wrap:wrap;gap:5px;}
.ekyer-num{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--navy);color:#fff;font-size:9.5px;font-weight:800;margin-right:5px;flex-shrink:0;}
.ekyer-heading{font-size:11px;font-weight:800;color:var(--navy-2);letter-spacing:.5px;text-transform:uppercase;}
.settings-row{display:flex;gap:18px;align-items:center;}
.settings-row .field.f-narrow{flex:0 0 80px;}
.settings-row-divider{width:1px;align-self:stretch;background:var(--line);flex:0 0 1px;}
.settings-taşma{flex:1;min-width:0;}
@media screen and (max-width:680px){ .field-grid .f-span2{grid-column:span 1;} .settings-row{flex-direction:column;} .settings-row-divider{display:none;} }
@media screen and (min-width:901px){
  .action-bar-dagitim-save{position:fixed;top:22px;right:34px;z-index:60;margin:0;}
}

.help-box{background:var(--navy-soft);border:1px solid #D3E0F0;border-left:4px solid var(--navy-2);border-radius:var(--radius-sm);padding:13px 16px;font-size:var(--fs-sm);color:var(--navy-2);line-height:1.6;text-transform:none;margin-top:6px;display:flex;gap:10px;}
.help-box strong{color:var(--navy);}
.help-box.warn{background:var(--danger-bg);border-left-color:var(--danger);color:#7A231D;}

.logo-upload-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.logo-upload-row input[type=file]{flex:0 0 auto;max-width:100%;}
.logo-preview-box{
  flex-shrink:0;width:72px;height:72px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.logo-preview-box img{max-width:100%;max-height:100%;object-fit:contain;}
.logo-preview-empty{font-size:9px;color:var(--muted);text-align:center;letter-spacing:.3px;text-transform:none;}

.action-bar{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap;}

.period-list{display:grid;grid-template-columns:repeat(3, 1fr);gap:14px;}
.period-row{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;align-items:end;background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;}
.period-row .period-label{grid-column:1/-1;font-weight:800;font-size:12.5px;color:var(--gold);align-self:start;margin-bottom:2px;}

@media screen and (max-width:640px){ .period-list{grid-template-columns:1fr;} .period-row{grid-template-columns:1fr 1fr;} }
@media screen and (max-width:420px){ .period-row{grid-template-columns:1fr;} }

/* ---------------------------------------------------------------
   Modal (onay/uyarı penceresi)
--------------------------------------------------------------- */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(10, 18, 34, 0.6);
  backdrop-filter: blur(2px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  padding: 20px;
}
.modal-box {
  background: #ffffff;
  border-radius: 16px;
  padding: 26px 30px;
  max-width: 460px;
  width: 100%;
  box-shadow: var(--shadow-pop);
  text-align: center;
  border-top:4px solid var(--accent);
}
.modal-text {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 24px;
  line-height: 1.55;
  text-transform: uppercase;
  max-height: 70vh;
  overflow-y: auto;
}
.modal-actions {
  display: flex;
  justify-content: center;
  gap: 12px;
}

.schedule-header-wrap{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;position:relative;}
.schedule-header-logo-box{width:100px;height:100px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.schedule-header-logo{max-width:100%;max-height:100%;object-fit:contain;}
.schedule-header-placeholder{width:100px;flex-shrink:0;}
.schedule-title{text-align:center;flex:1;}
.schedule-title h2{display:block;margin:3px 0;color:var(--navy);font-size:17px;font-weight:800;letter-spacing:0.5px;}
.schedule-title .period{font-size:15px;color:var(--text);font-weight:800;margin-top:6px;letter-spacing:0.5px;}
.schedule-title .period.period-tarih{display:inline-block;background:var(--navy-soft);padding:4px 18px;border-radius:14px;}

table.schedule{width:100%;border-collapse:collapse;table-layout:fixed;min-width:640px;}
table.schedule th,table.schedule td{border:1px solid #1D2430;padding:8px 6px;font-size:12.5px;vertical-align:middle;text-align:center;}
table.schedule th{background:var(--navy-soft);font-size:13.5px;font-weight:800;color:var(--navy);}
table.schedule td.yer{background:#F8F9FB;font-weight:800;color:var(--navy);font-size:13px;}

.notes{font-size:11.5px;color:#1D2430;margin-top:22px;text-transform:none;}
.notes p{margin:4px 0;}

.sign-container{display:flex;justify-content:space-between;margin-top:35px;padding:0 8%;font-size:12px;}
.sign-box{text-align:center;width:240px;}
.sign-box .date-line{margin-bottom:15px;font-weight:600;}
.sign-box .name{font-weight:700;margin-top:25px;color:var(--navy);}
.sign-box .title{font-size:11px;color:var(--muted);margin-top:2px;}

.small-muted{font-size:11.5px;color:var(--muted);text-transform:none;}

/* ---- Nöbet Çekilişi (kura simülasyonu) — açılır tam ekran pencere ---- */
.cekilis-modal-overlay{position:fixed;inset:0;background:rgba(6,11,22,.8);z-index:99998;display:flex;align-items:center;justify-content:center;padding:18px;}
.cekilis-modal-box{background:var(--bg);border-radius:16px;width:98vw;max-width:none;height:auto;max-height:95vh;overflow-y:auto;padding:22px;box-shadow:var(--shadow-pop);}

.cekilis-modal-header{background:linear-gradient(135deg,var(--navy) 0%,#0C1B33 100%);color:#fff;border-radius:12px;padding:17px 20px;margin-bottom:16px;text-align:center;border:2px solid var(--gold);position:sticky;top:0;z-index:2;}
.cekilis-baslik{font-size:11px;letter-spacing:1.2px;color:#AEC0DC;font-weight:700;margin-bottom:8px;}
.cekilis-name-box{min-height:40px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.cekilis-name-box .ad{font-size:19px;font-weight:800;color:#fff;background:rgba(255,255,255,0.08);border:1px solid var(--gold);border-radius:9px;padding:9px 24px;animation:cekilisPop .4s ease;max-width:90%;}
@keyframes cekilisPop{ 0%{transform:scale(.85);opacity:0;} 60%{transform:scale(1.04);opacity:1;} 100%{transform:scale(1);} }
.cekilis-progress-text{font-size:11px;color:#AEC0DC;margin-bottom:6px;font-weight:700;}
.cekilis-progress-outer{width:100%;max-width:360px;margin:0 auto 10px;height:6px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden;}
.cekilis-progress-inner{height:100%;background:var(--gold);transition:width .35s ease;}
.cekilis-controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;}
.cekilis-controls button{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:7px 17px;font-size:11px;font-weight:700;cursor:pointer;transition:transform .08s ease,background .1s ease;}
.cekilis-controls button:hover{background:rgba(255,255,255,.2);}
.cekilis-controls button:active{transform:scale(.92);}
.cekilis-controls button.active{background:var(--gold);border-color:var(--gold);}
.cekilis-controls button.active:hover{background:var(--gold);}

/* Bütün ayların TEK ekranda, KAYDIRMA OLMADAN görünmesi için:
   sabit 3 sütunlu ızgara + tablo sütunlarının sabit (table-layout:fixed)
   genişlikte küçülerek sığması. Ay sayısı arttıkça (3'ten fazla satır
   gerektiğinde) JS tarafından eklenen .compact sınıfı satırları daha da
   sıkıştırır (bkz. render.js renderCekilisModalBody). */
.cekilis-fit-wrap{overflow:hidden;}
.cekilis-aylar-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:13px;align-items:start;transform-origin:top center;}
.cekilis-aylar-grid .card{margin-bottom:0;padding:11px 13px;}
.cekilis-aylar-grid .card h2{font-size:12px;margin:0 0 5px;}
.cekilis-aylar-grid .table-scroll{overflow-x:visible;}
.cekilis-aylar-grid table.data{table-layout:fixed;width:100%;min-width:0;margin-top:3px;}
.cekilis-aylar-grid table.data th,.cekilis-aylar-grid table.data td{padding:2px 3px;font-size:10px;height:36px;max-height:36px;overflow:hidden;vertical-align:middle;}
.cekilis-aylar-grid table.data th:first-child,.cekilis-aylar-grid table.data td.yer{width:15%;font-size:9.5px;}

@media screen and (max-width:1400px){
  .cekilis-aylar-grid{grid-template-columns:repeat(2, 1fr);}
}
@media screen and (max-width:900px){
  .cekilis-aylar-grid{grid-template-columns:1fr;}
}

.cekilis-placeholder{color:#B9C0CC;font-size:12px;font-weight:700;line-height:1.05;}
.cekilis-revealed-name{
  font-weight:700;color:var(--text);font-size:10px;line-height:1.05;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;word-break:break-word;
}
td.cekilis-cell-flash{background:#FFF6E5 !important;box-shadow:inset 0 0 0 2px var(--gold);animation:cekilisCellFlash 1.4s ease;}
@keyframes cekilisCellFlash{ 0%{background:#FCE9BE;} 100%{background:#FFF6E5;} }

@media screen and (max-width:900px){
  .cekilis-modal-overlay{padding:0;}
  .cekilis-modal-box{width:100vw;height:100vh;max-width:100vw;border-radius:0;padding:14px;}
  .cekilis-aylar-grid{grid-template-columns:1fr;}
  .cekilis-name-box .ad{font-size:19px;padding:10px 18px;}
}

/* ---- Genel mobil iyileştirmeler (dokunma hedefleri, boşluklar, taşan içerik) ---- */
@media screen and (max-width: 900px){
  .row{gap:11px;}
  .field{min-width:0;flex:1 1 160px;}
  select{min-width:0;width:100%;}

  button.btn{padding:12px 17px;font-size:13px;min-height:44px;}
  button.btn.small{padding:9px 13px;font-size:12px;min-height:38px;}

  .subtabs{gap:6px;}
  .subtabs button{padding:10px 14px;font-size:12px;min-height:40px;}

  .action-bar .btn{flex:1 1 auto;}

  table.data th, table.data td{padding:8px 9px;font-size:12px;}
  table.schedule th, table.schedule td{padding:6px 4px;font-size:11.5px;}

  .schedule-title h2{font-size:15px;}

  .sign-box{width:100%;max-width:280px;}

function strHash(str){
  let h = 0;
  for(let i=0; i<str.length; i++){
    h = (h * 31 + str.charCodeAt(i)) | 0;
  }
  return h;
}


function toUpperTr(str){
  if(!str) return '';
  return String(str).replace(/i/g,'İ').replace(/ı/g,'I').toUpperCase();
}


function formatDateTR(dateStr){
  if(!dateStr) return '';
  const p = dateStr.split('-');
  if(p.length !== 3) return dateStr;
  return p[2] + '.' + p[1] + '.' + p[0];
}


function getDefaultMonthDateRange(year, monthIndex) {
  const start = new Date(year, monthIndex, 1);
  const end = new Date(year, monthIndex + 1, 0);
  const formatDigit = (n) => String(n).padStart(2, '0');
  
  const sStr = year + '-' + formatDigit(monthIndex + 1) + '-01';
  const eStr = year + '-' + formatDigit(monthIndex + 1) + '-' + formatDigit(end.getDate());
  return { baslangic: sStr, bitis: eStr };
}

// Yüklenen logo dosyasını (ham haliyle birkaç MB olabilir, ki bu doğrudan
// localStorage'ın kotasını (~5-10MB) doldurup "KAYIT HATASI!" hatasına yol
// açabilir) küçük bir kareye sığdırıp sıkıştırır. Sonuç genelde birkaç KB -
// birkaç on KB olur, kotayı asla zorlamaz.
// Şeffaflık varsa (örn. arka planı şeffaf PNG logo) PNG olarak kaydedilir ve
// şeffaflık AYNEN KORUNUR — beyaz zemin eklenmez. Şeffaflık yoksa (fotoğraf
// gibi opak resimler) daha küçük dosya boyutu için JPEG kullanılır.
function compressImageToDataURL(file, maxDim, quality, callback){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }

      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      // Tuval BAŞTA ŞEFFAF bırakılır (beyaz zemin doldurulmaz), ki gerçek
      // şeffaflık durumu doğru tespit edilebilsin.
      ctx.drawImage(img, 0, 0, w, h);

      let hasTransparency = false;
      try{
        const data = ctx.getImageData(0, 0, w, h).data;
        for(let i = 3; i < data.length; i += 4){
          if(data[i] < 255){ hasTransparency = true; break; }
        }
      }catch(err){
        hasTransparency = false;
      }

      try{
        if(hasTransparency){
          // Şeffaflığı koru: PNG, beyaz zemin YOK.
          callback(canvas.toDataURL('image/png'));
        } else {
          // Şeffaflık yok: daha küçük dosya için JPEG (zaten tamamen opak).
          callback(canvas.toDataURL('image/jpeg', quality));
        }
      }catch(err){
        callback(null);
      }
    };
    img.onerror = function(){ callback(null); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ callback(null); };
  reader.readAsDataURL(file);
}

// localStorage'ın senkron string deposu tarayıcılarda sabit ~5-10MB ile
// sınırlıdır ve bu sınır aşılınca "KAYIT HATASI: DEPOLAMA ALANI DOLU!"
// hatası oluşur. IndexedDB ise aynı tarayıcıda diskteki boş alana göre
// çalışan, çok daha büyük (genelde yüzlerce MB - birkaç GB) bir kotaya
// sahiptir. Bu yüzden kalıcı veri artık IndexedDB'de tutulur; eski
// localStorage kaydı varsa (önceki sürümden) bir defaya mahsus otomatik
// olarak IndexedDB'ye taşınır ve localStorage'daki kopyası silinir.
function idbOpen(){
  return new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error('INDEXEDDB_YOK')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error || new Error('INDEXEDDB_ACILAMADI'));
  });
}
function idbGet(key){
  return idbOpen().then(db=> new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error || new Error('INDEXEDDB_OKUMA_HATASI'));
  }));
}
function idbSet(key, value){
  return idbOpen().then(db=> new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error || new Error('INDEXEDDB_YAZMA_HATASI'));
  }));
}

// Firebase'den ya da yerel önbellekten gelen (eksik/eski formatlı olabilen)
// bir veriyi, varsayılan durumla birleştirip TUTARLI bir state nesnesine
// dönüştürür. loadState() içindeki tek noktadan hem ilk açılışta hem her
// canlı Firebase güncellemesinde kullanılır.
function normalizeState(loaded){
  const s = loaded || {};
  const d = defaultState();
  s.kurum = Object.assign({}, d.kurum, s.kurum||{});
  s.yerler = (s.yerler && s.yerler.length) ? s.yerler : d.yerler;
  s.yerler.forEach(y=>{
    if(!y.izinliOgretmenler) y.izinliOgretmenler = { sabah: [], oglen: [] };
    else {
      y.izinliOgretmenler.sabah = y.izinliOgretmenler.sabah || [];
      y.izinliOgretmenler.oglen = y.izinliOgretmenler.oglen || [];
    }
  });
  s.ogretmenler = Object.assign({sabah:[],oglen:[]}, s.ogretmenler||{});
  s.ayarlar = Object.assign({kacAy:6,ekYer:{sabah:[],oglen:[]}, tarihAraliklari:[], yoneticiSifre:d.ayarlar.yoneticiSifre}, s.ayarlar||{});
  s.ayarlar.ekYer = Object.assign({sabah:[],oglen:[]}, s.ayarlar.ekYer||{});
  // GERİYE DÖNÜK UYUMLULUK: eskiden ekYer tek bir yer id'si (string) olarak
  // saklanıyordu; artık birden çok yer seçilebildiği için diziye taşıyoruz.
  ['sabah','oglen'].forEach(g=>{
    const v = s.ayarlar.ekYer[g];
    if(typeof v === 'string') s.ayarlar.ekYer[g] = v ? [v] : [];
    else if(!Array.isArray(v)) s.ayarlar.ekYer[g] = [];
  });
  if(!s.ayarlar.tarihAraliklari || !s.ayarlar.tarihAraliklari.length){
    s.ayarlar.tarihAraliklari = d.ayarlar.tarihAraliklari;
  }
  if(!s.ayarlar.yoneticiSifre) s.ayarlar.yoneticiSifre = d.ayarlar.yoneticiSifre;
  s.istisnalar = s.istisnalar || [];
  // GERİYE DÖNÜK UYUMLULUK: eskiden "birlikte" istisnası tek bir partnerId
  // (string) olarak saklanıyordu; artık 2+ kişilik grup desteklendiği için
  // partnerIds (dizi) kullanılıyor.
  s.istisnalar.forEach(i=>{
    if(i.tip==='birlikte' && !i.partnerIds){
      i.partnerIds = i.partnerId ? [i.partnerId] : [];
    }
  });
  s.dagitimlar = Object.assign({sabah:[],oglen:[]}, s.dagitimlar||{});
  return s;
}


async function loadState(){
  // ÖNEMLİ: Burada BİLEREK yerel (IndexedDB) kopyayı göstermiyoruz. Daha
  // önce "önce yerelden göster, sonra Firebase gelince güncelle" şeklinde
  // çalışıyordu; ama bu, tarayıcıda eski bir yerel kopya varsa, kullanıcının
  // "veriler sıfırlandı/eskiye döndü" sanmasına yol açabiliyordu. Artık
  // yönetici moduna girildiğinde EKRANDA BEKLEME GÖSTERİLİR ve İLK GERÇEK
  // İÇERİK ANCAK Firebase'den yanıt geldikten sonra çizilir — böylece
  // gösterilen veri her zaman gerçekten güncel olur.
  const mainEl = document.getElementById('main');
  if(mainEl) mainEl.innerHTML = '<div class="card"><p style="text-align:center;padding:30px 10px;color:var(--muted);">ÇEVRİMİÇİ VERİLER YÜKLENİYOR…</p></div>';

  let gercekVeriGoruldu = false;
  fbDb.ref(FB_YONETIM_REF).on('value', snap=>{
    const gelen = snap.val();
    console.log('[NÖBET-DEBUG] Firebase\'den veri geldi. Gelen şifre:', gelen && gelen.ayarlar && gelen.ayarlar.yoneticiSifre, '— o anki bellekteki şifre:', state && state.ayarlar && state.ayarlar.yoneticiSifre);
    if(gelen){
      state = normalizeState(gelen);
      idbSet(IDB_KEY, state).catch(()=>{});
      gercekVeriGoruldu = true;
    } else if(!gercekVeriGoruldu){
      // Firebase'de bu isim altında (görünürde) hiç yönetim verisi yok VE
      // bu oturumda daha önce hiç gerçek veri görmedik — muhtemelen gerçek
      // ilk kurulum. ÖNEMLİ GÜVENLİK KARARI: burada KESİNLİKLE yerel/
      // varsayılan veriyi otomatik olarak Firebase'e YAZMIYORUZ; sadece
      // ekranda boş/varsayılan bir durum GÖSTERİYORUZ. Kayıt YALNIZCA siz
      // bilerek bir işlem yaptığınızda gerçekleşir.
      state = normalizeState(null);
    } else {
      // Bu oturumda DAHA ÖNCE gerçek veri görmüştük; şimdi aniden "boş"
      // bir sinyal geldi. Bu neredeyse kesinlikle geçici/hatalı bir
      // sinyaldir (gerçek veri silinmiş olamaz — az önce oradaydı). Bu
      // yüzden BUNU YOK SAYIYORUZ: ekranda hâlâ SON BİLİNEN GERÇEK veriyi
      // gösteriyoruz, hiçbir şeyi sıfırlamıyoruz.
      console.warn('[NÖBET-DEBUG] Daha önce gerçek veri görülmüştü, şimdi gelen "boş" sinyal YOK SAYILDI.');
      return;
    }
    ilkYonetimYuklemesiTamam = true;
    render();
    const zEl = document.getElementById('yuklemeZamani');
    if(zEl) zEl.textContent = 'ÇEVRİMİÇİDEN ALINDI: ' + new Date().toLocaleTimeString('tr-TR');
  }, err=>{
    const el = document.getElementById('saveStatus');
    if(el) el.textContent = 'ÇEVRİMİÇİ BAĞLANTI YOK — SON GÖRÜLEN VERİYLE DEVAM EDİLİYOR.';
  });
}

async function saveState(){
  try{
    await idbSet(IDB_KEY, state);
  }catch(e){}
  const el = document.getElementById('saveStatus');
  // Firebase Realtime Database, JS nesnesinde "undefined" değer görürse
  // YAZMAYI TAMAMEN REDDEDER (sessizce değil, hata fırlatarak) — bir yerde
  // unutulmuş tek bir "undefined" bile TÜM state'in kaydedilmesini
  // engelleyebilir. JSON üzerinden bir gidiş-dönüş yaparak (undefined alanlar
  // JSON.stringify sırasında otomatik elenir) bunu güvenceye alıyoruz.
  let temizState;
  try{
    temizState = JSON.parse(JSON.stringify(state));
  }catch(e){
    if(el) el.textContent = 'KAYIT HATASI: VERİ FORMATI BOZUK GÖRÜNÜYOR (' + e.message + ').';
    console.error('saveState: state JSON\'a çevrilemedi', e, state);
    return false;
  }

  // GÜVENLİK KİLİDİ: Buraya kadar hangi kod yolundan gelinirse gelinsin,
  // eksik/bozuk görünen (ör. ayarlar veya nöbet yerleri hiç yoksa) bir
  // "state" Firebase'e YAZILAMAZ. Bu, olası bir arka planda açık kalmış
  // eski sekmenin veya beklenmeyen bir kod yolunun gerçek verinin üzerine
  // BOŞ/varsayılan veri yazmasını önlemek için son bir güvenlik önlemidir.
  const geçerliMi = temizState
    && typeof temizState === 'object'
    && temizState.ayarlar && typeof temizState.ayarlar === 'object'
    && temizState.ogretmenler && typeof temizState.ogretmenler === 'object'
    && Array.isArray(temizState.yerler) && temizState.yerler.length > 0
    && temizState.dagitimlar && typeof temizState.dagitimlar === 'object';
  if(!geçerliMi){
    console.error('[NÖBET-DEBUG] GÜVENLİK KİLİDİ DEVREDE: eksik/bozuk state Firebase\'e YAZILMADI.', temizState);
    if(el) el.textContent = 'KAYIT ENGELLENDİ: VERİ EKSİK GÖRÜNÜYORDU (GÜVENLİK KİLİDİ).';
    try{ showAlert('GÜVENLİK KİLİDİ DEVREYE GİRDİ!\n\nKaydedilecek veri eksik/bozuk göründüğü için buluta YAZILMADI (gerçek verileriniz korundu). Lütfen sayfayı bir kez daha yükleyip tekrar deneyin ve bana bildirin.'); }catch(e2){}
    return false;
  }

  console.log('[NÖBET-DEBUG] saveState: Firebase\'e YAZILACAK şifre:', temizState && temizState.ayarlar && temizState.ayarlar.yoneticiSifre);

  // EK GÜVENLİK KİLİDİ: yazmadan hemen önce buluttaki MEVCUT öğretmen
  // sayısına bakıyoruz. Eğer bulutta zaten birçok öğretmen kayıtlıyken bu
  // yazma işlemi listeyi SIFIRA indirecekse (ör. başka bir sekmeden/eski
  // bir oturumdan gelen boş bir state yanlışlıkla buraya karışmışsa), bunu
  // GERÇEK bir "tüm öğretmenleri sil" isteğinden ayırt edemesek de, en
  // azından yazmayı durdurup uyarıyoruz — sessizce silinmesindense.
  try{
    const mevcutSnap = await fbDb.ref(FB_YONETIM_REF + '/ogretmenler').once('value');
    const mevcut = mevcutSnap.val();
    const mevcutSayi = (mevcut && (((mevcut.sabah||[]).length) + ((mevcut.oglen||[]).length))) || 0;
    const yeniSayi = ((temizState.ogretmenler.sabah||[]).length) + ((temizState.ogretmenler.oglen||[]).length);
    if(mevcutSayi >= 5 && yeniSayi === 0){
      console.error('[NÖBET-DEBUG] GÜVENLİK KİLİDİ: öğretmen listesi', mevcutSayi, '-> 0 olacaktı, YAZMA ENGELLENDİ.');
      if(el) el.textContent = 'KAYIT ENGELLENDİ: TÜM ÖĞRETMENLER SİLİNMEK ÜZEREYDİ (GÜVENLİK KİLİDİ).';
      try{ showAlert('GÜVENLİK KİLİDİ DEVREYE GİRDİ!\n\nBu işlem buluttaki ' + mevcutSayi + ' öğretmeni SIFIRA indirecekti. Olası bir hata/çakışma ihtimaline karşı bu kayıt YAPILMADI — gerçek verileriniz korundu. Lütfen sayfayı yeniden yükleyip tekrar deneyin ve bana bildirin.'); }catch(e2){}
      return false;
    }
  }catch(e){
    console.warn('[NÖBET-DEBUG] Öğretmen sayısı ön-kontrolü yapılamadı, devam ediliyor.', e);
  }

  let basarili = false;
  const p = fbDb.ref(FB_YONETIM_REF).set(temizState).then(()=>{
    if(el) el.textContent = 'KAYDEDİLDİ ✓ (ÇEVRİMİÇİ)';
    basarili = true;
  }).catch((e)=>{
    console.error('saveState: Firebase\'e yazılamadı', e);
    const isQuota = e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014);
    const msg = isQuota
      ? 'KAYIT HATASI: DEPOLAMA ALANI DOLU! YEDEKLEYİP ESKİ DÖNEMLERİ SİLMEYİ DENEYİN.'
      : 'ÇEVRİMİÇİ KAYDEDİLEMEDİ! (' + (e && e.message ? e.message : 'BİLİNMEYEN HATA') + ') — DEĞİŞİKLİK ŞİMDİLİK SADECE BU CİHAZDA.';
    if(el) el.textContent = msg;
    // Bu hatanın gözden kaçmaması için (sadece küçük yazı değil) GÖZ ARDI
    // EDİLEMEYECEK bir uyarı penceresi de gösteriyoruz.
    try{ showAlert('DEĞİŞİKLİK ÇEVRİMİÇİ KAYDEDİLEMEDİ!\n\n' + msg + '\n\nLÜTFEN İNTERNET BAĞLANTINIZI KONTROL EDİP TEKRAR DENEYİN.'); }catch(e2){}
  }).finally(()=>{
    kayitBekleniyorMu = false;
  });
  kayitBekleniyorMu = true;
  sonKayitPromise = p;
  await p;
  return basarili;
}

/* ==============================================================
 * algorithm.js — Nöbet dağıtım motoru (Tam Eşitlik & Dinamik Kota)
 * ============================================================== */

function solveHungarianMinCost(costMatrix) {
  const n = costMatrix.length;
  if (n === 0) return [];
  const m = costMatrix[0].length;
  if (m === 0) return [];

  const maxDim = Math.max(n, m);
  const matrix = Array.from({ length: maxDim }, (_, r) => 
    Array.from({ length: maxDim }, (_, c) => (r < n && c < m) ? costMatrix[r][c] : 0)
  );

  const u = new Array(maxDim + 1).fill(0);
  const v = new Array(maxDim + 1).fill(0);
  const p = new Array(maxDim + 1).fill(0);
  const way = new Array(maxDim + 1).fill(0);

  for (let i = 1; i <= maxDim; i++) {
    p[0] = i;
    let j0 = 0;
    const minv = new Array(maxDim + 1).fill(Infinity);
    const used = new Array(maxDim + 1).fill(false);

    do {
      used[j0] = true;
      const i0 = p[j0];
      let delta = Infinity;
      let j1 = 0;

      for (let j = 1; j <= maxDim; j++) {
        if (!used[j]) {
          const cur = matrix[i0 - 1][j - 1] - u[i0] - v[j];
          if (cur < minv[j]) {
            minv[j] = cur;
            way[j] = j0;
          }
          if (minv[j] < delta) {
            delta = minv[j];
            j1 = j;
          }
        }
      }

      for (let j = 0; j <= maxDim; j++) {
        if (used[j]) {
          u[p[j]] += delta;
          v[j] -= delta;
        } else {
          minv[j] -= delta;
        }
      }

      j0 = j1;
    } while (p[j0] !== 0);

    do {
      const j1 = way[j0];
      p[j0] = p[j1];
      j0 = j1;
    } while (j0 !== 0);
  }

  const result = [];
  for (let j = 1; j <= maxDim; j++) {
    if (p[j] > 0) {
      const rIdx = p[j] - 1;
      const cIdx = j - 1;
      if (rIdx < n && cIdx < m) {
        result.push({ teacherIdx: rIdx, slotIdx: cIdx, cost: costMatrix[rIdx][cIdx] });
      }
    }
  }
  return result;
}

function buildSlotList(){
  let slots = [];
  const maxKap = state.yerler.reduce((m,y)=>Math.max(m, Math.max(1,y.kapasite)), 1);
  GUNLER.forEach(g=>{
    for(let round=0; round<maxKap; round++){
      state.yerler.forEach(y=>{
        if(Math.max(1,y.kapasite) > round) slots.push({yerId:y.id, gun:g, round});
      });
    }
  });
  return slots;
}

function tarihAraliklariCakisiyorMu(aBaslangic, aBitis, bBaslangic, bBitis){
  if(!aBaslangic || !aBitis || !bBaslangic || !bBitis) return false;
  return aBaslangic <= bBitis && aBitis >= bBaslangic;
}

function isSlotAllowed(tw, yerId, gun, grup, ayInfo){
  const istler = tw.istler || (tw.ist ? [tw.ist] : []);
  for(let i=0; i<istler.length; i++){
    const ist = istler[i];
    if(ist.tip==='muaf') return false;
    if(ist.tip==='izinde' && ayInfo && tarihAraliklariCakisiyorMu(ist.izinBaslangic, ist.izinBitis, ayInfo.baslangicTarihi, ayInfo.bitisTarihi)) return false;
    if(ist.tip==='sabit' && (!ist.yerIdler.length || !ist.yerIdler.includes(yerId))) return false;
    if(ist.tip==='izinli' && ist.yerIdler.length && !ist.yerIdler.includes(yerId)) return false;
    if(ist.tip==='yasakli' && ist.yerIdler.length && ist.yerIdler.includes(yerId)) return false;

    if(ist.gunTipi==='sadece' && ist.gunler && ist.gunler.length && !ist.gunler.includes(gun)) return false;
    if(ist.gunTipi==='haric' && ist.gunler && ist.gunler.length && ist.gunler.includes(gun)) return false;
  }

  if(grup){
    const yer = state.yerler.find(y=>y.id===yerId);
    if(yer && yer.izinliOgretmenler){
      const izinliList = yer.izinliOgretmenler[grup];
      if(izinliList && izinliList.length && !izinliList.includes(tw.teacher.id)) return false;
    }
  }

  return true;
}

function yerKapasite(yerId){
  const y = state.yerler.find(yy=>yy.id===yerId);
  return y ? Math.max(1, y.kapasite) : 1;
}

function whitelistOk(yerId, teacherId, grup){
  const yer = state.yerler.find(y=>y.id===yerId);
  if(yer && yer.izinliOgretmenler){
    const wl = yer.izinliOgretmenler[grup];
    if(wl && wl.length && !wl.includes(teacherId)) return false;
  }
  return true;
}

function findAssignment(tablo, teacherId){
  for(const yerId in tablo){
    for(const gun of GUNLER){
      if(tablo[yerId][gun] && tablo[yerId][gun].includes(teacherId)) return {yerId, gun};
    }
  }
  return null;
}

// "AYNI GÜN NÖBET" (eşleştirilmiş öğretmen) istisnasını uygular:
// bir ayki dağıtım tamamlandıktan sonra, eşleştirilen iki öğretmenin
// aynı gün nöbetçi olmasını sağlamaya çalışır (doğrudan taşıma, olmazsa takas).
// "AYNI GÜN NÖBET" (birlikte) istisnasıyla birbirine bağlı öğretmen
// gruplarını bulur (Union-Find: A-B ve B-C gibi zincirleme bağlar da tek
// grupta toplanır). Hem önceden-rezervasyon (FAZ 1.5) hem de son-çare
// yama (applyBirlikteGruplari) tarafından ortak olarak kullanılır.
function getBirlikteGruplari(grup){
  const parent = {};
  function find(x){
    if(parent[x]===undefined) parent[x]=x;
    while(parent[x]!==x){ parent[x] = parent[parent[x]]; x = parent[x]; }
    return x;
  }
  function union(a,b){
    const ra=find(a), rb=find(b);
    if(ra!==rb) parent[ra]=rb;
  }

  const katilanlar = new Set();
  state.istisnalar.filter(i=>i.grup===grup && i.tip==='birlikte' && i.partnerIds && i.partnerIds.length).forEach(i=>{
    katilanlar.add(i.ogretmenId);
    find(i.ogretmenId);
    i.partnerIds.forEach(pid=>{
      katilanlar.add(pid);
      union(i.ogretmenId, pid);
    });
  });
  if(!katilanlar.size) return [];

  const gruplarMap = {};
  katilanlar.forEach(id=>{
    const kok = find(id);
    if(!gruplarMap[kok]) gruplarMap[kok] = [];
    gruplarMap[kok].push(id);
  });
  return Object.values(gruplarMap).filter(g=>g.length>1);
}

function applyBirlikteGruplari(tablo, grup, teacherWrapper, cakismalar, historyDays, historyPlaces, historyPairs, lastAssignedDay, lastAssignedPlace, ayInfo){
  const gruplar = getBirlikteGruplari(grup);
  if(!gruplar.length) return;

  const twMap = {};
  teacherWrapper.forEach(tw=>{ twMap[tw.teacher.id] = tw; });

  function removeAssignment(teacherId, yerId, gun){
    tablo[yerId][gun] = tablo[yerId][gun].filter(id=>id!==teacherId);
    historyDays[teacherId][gun] = Math.max(0, (historyDays[teacherId][gun]||0) - 1);
    historyPlaces[teacherId][yerId] = Math.max(0, (historyPlaces[teacherId][yerId]||0) - 1);
    const pairKey = yerId + '_' + gun;
    historyPairs[teacherId][pairKey] = Math.max(0, (historyPairs[teacherId][pairKey]||0) - 1);
  }
  function addAssignment(teacherId, yerId, gun){
    tablo[yerId][gun].push(teacherId);
    historyDays[teacherId][gun] = (historyDays[teacherId][gun]||0) + 1;
    historyPlaces[teacherId][yerId] = (historyPlaces[teacherId][yerId]||0) + 1;
    const pairKey = yerId + '_' + gun;
    historyPairs[teacherId][pairKey] = (historyPairs[teacherId][pairKey]||0) + 1;
    lastAssignedDay[teacherId] = gun;
    lastAssignedPlace[teacherId] = yerId;
  }

  gruplar.forEach(uyeler=>{
    const gecerli = uyeler.filter(id=>twMap[id]); // grupta değilse/muafsa dışarıda kalır
    if(gecerli.length < 2) return;

    // ESKİ DAVRANIŞ: hedef gün rastgele ilk üyenin düştüğü güne SABİTLENİYORDU;
    // o gün diğer üyeler için uygun boş yer/takas yoksa istisna sessizce
    // yarım kalıyordu. YENİ DAVRANIŞ: mümkün olan HER gün için (önce en çok
    // üyenin zaten bulunduğu günden başlayarak) "bu günde TÜM üyeler
    // yerleştirilebilir mi?" diye deneme yapılır; tam çözüm veren ilk gün
    // uygulanır. Hiçbir gün tam çözüm vermezse, en fazla üyeyi bir araya
    // getirebilen gün uygulanır ve sadece o günde de sığmayanlar için
    // çakışma bildirilir — böylece istisna artık "ya hep ya hiç" değil.
    const asgMap = {};
    const gunSayim = {}; GUNLER.forEach(g=>gunSayim[g]=0);
    gecerli.forEach(id=>{
      const a = findAssignment(tablo, id);
      asgMap[id] = a;
      if(a) gunSayim[a.gun]++;
    });
    const gunSirasi = GUNLER.slice().sort((a,b)=>gunSayim[b]-gunSayim[a]);

    // Bir günü dener; o güne göre bir "plan" (kimin nereye taşınacağı/takas
    // edileceği) ve yerleştirilemeyenlerin listesini döndürür. Gerçek
    // tabloya HİÇBİR ŞEY YAZMAZ — sadece dener (geçici doluluk kopyası ile).
    function gunuDene(hedefGun){
      const geciciDolu = {};
      Object.keys(tablo).forEach(yid=>{ geciciDolu[yid] = new Set(tablo[yid][hedefGun] || []); });

      const plan = [];
      const basarisizlar = [];

      gecerli.forEach(id=>{
        const a = asgMap[id];
        if(a && a.gun === hedefGun){ plan.push({tip:'yerinde', teacherId:id}); return; }
        const tw = twMap[id];

        // 1) Doğrudan taşıma: hedef günde boş bir yer bul
        for(const yerId of Object.keys(tablo)){
          if(!state.yerler.some(y=>y.id===yerId)) continue; // ek yer hariç
          const doluSet = geciciDolu[yerId];
          if(doluSet.size >= yerKapasite(yerId)) continue;
          if(!isSlotAllowed(tw, yerId, hedefGun, grup, ayInfo)) continue;
          if(!whitelistOk(yerId, id, grup)) continue;
          doluSet.add(id);
          plan.push({tip:'tasi', teacherId:id, eskiYerId:a?a.yerId:null, eskiGun:a?a.gun:null, yeniYerId:yerId});
          return;
        }

        // 2) Takas: mevcut ataması varsa, hedef günde nöbetçi olan (grup
        // dışı) başka biriyle karşılıklı yer değiştirmeyi dene.
        if(a){
          for(const yerId of Object.keys(tablo)){
            if(!state.yerler.some(y=>y.id===yerId)) continue;
            for(const cId of Array.from(geciciDolu[yerId])){
              if(gecerli.includes(cId)) continue; // grup üyesiyle takas etme
              const cTw = twMap[cId];
              if(!cTw) continue;
              if(!isSlotAllowed(tw, yerId, hedefGun, grup, ayInfo) || !whitelistOk(yerId, id, grup)) continue;
              if(!isSlotAllowed(cTw, a.yerId, a.gun, grup, ayInfo) || !whitelistOk(a.yerId, cId, grup)) continue;

              geciciDolu[yerId].delete(cId);
              geciciDolu[yerId].add(id);
              plan.push({tip:'takas', teacherId:id, digerId:cId, yeniYerId:yerId, eskiYerId:a.yerId, eskiGun:a.gun});
              return;
            }
          }
        }

        basarisizlar.push(id);
      });

      return { hedefGun, plan, basarisizlar };
    }

    let enIyi = null;
    for(const gun of gunSirasi){
      const deneme = gunuDene(gun);
      if(!enIyi || deneme.basarisizlar.length < enIyi.basarisizlar.length){
        enIyi = deneme;
      }
      if(deneme.basarisizlar.length === 0){ enIyi = deneme; break; } // tam çözüm bulundu
    }

    if(!enIyi) return;

    // Seçilen günün planını gerçek tabloya uygula.
    enIyi.plan.forEach(p=>{
      if(p.tip==='yerinde') return;
      if(p.tip==='tasi'){
        if(p.eskiYerId) removeAssignment(p.teacherId, p.eskiYerId, p.eskiGun);
        addAssignment(p.teacherId, p.yeniYerId, enIyi.hedefGun);
      } else if(p.tip==='takas'){
        removeAssignment(p.digerId, p.yeniYerId, enIyi.hedefGun);
        removeAssignment(p.teacherId, p.eskiYerId, p.eskiGun);
        addAssignment(p.teacherId, p.yeniYerId, enIyi.hedefGun);
        addAssignment(p.digerId, p.eskiYerId, p.eskiGun);
      }
    });

    if(enIyi.basarisizlar.length){
      const isimler = enIyi.basarisizlar.map(id=>twMap[id].teacher.ad).join(', ');
      cakismalar.push('"' + gecerli.map(id=>twMap[id].teacher.ad).join(', ') + '" AYNI GÜN NÖBET GRUBUNDA ' + isimler + ' HİÇBİR GÜNDE UYGUN YER/TAKAS BULUNAMADIĞI İÇİN GRUPTAN AYRI KALDI.');
    }
  });
}

function generateDagitim(grup, kacAy){
  const yerler = state.yerler;
  const baseSlots = buildSlotList();
  let ekYerIdler = (state.ayarlar.ekYer[grup] || []).filter(id => yerler.some(y=>y.id===id));

  // HER ÜRETİMDE FARKLI ÇEKİLİŞ: Aşağıdaki jitter (eşit maliyetli seçenekler
  // arasında kimin seçileceğini belirleyen küçük "tie-breaker") artık bu
  // rastgele tohuma (seed) göre hesaplanıyor. Adalet mantığı (gün/yer
  // dengeleme cezaları, sert kotalar) HİÇ değişmiyor — sadece eşit derecede
  // adil seçenekler arasındaki tercih her "dağıtımı sıfırla / yeniden üret"
  // işleminde farklı çıkıyor. Aynı seed ile (bu fonksiyon çağrısı boyunca)
  // hesaplama iç tutarlılığını koruyor; sadece çağrılar arasında değişiyor.
  const cekilisSeed = Math.floor(Math.random() * 1e9);

  let teachers = state.ogretmenler[grup].filter(t=>{
    const ist = state.istisnalar.find(i=>i.grup===grup && i.ogretmenId===t.id && i.tip==='muaf');
    return !ist;
  }).slice().sort((a,b)=>a.ad.localeCompare(b.ad,'tr'));

  let slots = baseSlots.slice();
  let ekleme = 0;
  if(teachers.length > slots.length && ekYerIdler.length){
    // NOT (ÖNEMLİ ADALET DÜZELTMESİ): Burada eskiden slots'a KALICI bir
    // taşma slotu ekleniyordu (her zaman GUNLER[0] = PAZARTESİ günü ile).
    // Bu slot `slots` listesinde kalıcı olduğu için HER AY yeniden
    // kullanılıyor ve hep aynı güne (PAZARTESİ) denk geliyordu. Aşağıdaki
    // FAZ 2'deki aylık dinamik "acik" tamamlama mekanizması zaten bu
    // açığı her ay ayrı ayrı (ve artık aya göre kayan bir günle) kapatıyor;
    // burada AYRICA kalıcı bir slot eklemek, o kalıcı slotun bazı aylarda
    // aynı ay içindeki dinamik taşma slotuyla AYNI GÜNE denk gelmesine ve
    // BAHÇE'de (kapasitesi 1 olsa bile) bir günde 2-3 kişinin birden
    // görünmesine yol açıyordu. Bu yüzden burada sadece raporlama için
    // sayıyı (`ekleme`) tutuyoruz; gerçek slot ekleme işini tamamen aylık
    // dinamik "acik" hesabına bırakıyoruz.
    ekleme = teachers.length - slots.length;
  }

  const teacherWrapper = teachers.map(t=>{
    const istler = state.istisnalar.filter(i=>i.grup===grup && i.ogretmenId===t.id);
    return { teacher: t, istler, ist: istler[0] };
  });

  const yapisalUyarilar = [];

  teacherWrapper.forEach(tw=>{
    const hasAnySlot = slots.some(s=>isSlotAllowed(tw, s.yerId, s.gun, grup)) ||
      (ekYerIdler.length && ekYerIdler.some(eid => GUNLER.some(g=>isSlotAllowed(tw, eid, g, grup))));
    if(!hasAnySlot){
      yapisalUyarilar.push(tw.teacher.ad + ' İÇİN TANIMLANAN İSTİSNA(LAR) HİÇBİR NÖBET YERİ/GÜNÜ İLE UYUŞMUYOR.');
    }
  });

  if(teachers.length > slots.length && !ekYerIdler.length){
    yapisalUyarilar.push('ÖĞRETMEN SAYISI (' + teachers.length + ') KAPASİTEDEN (' + slots.length + ') FAZLA VE "EK YER" TANIMLANMASI GEREKİR.');
  }

  const prevAylar = allMonthsFor(grup);
  const previousMonthsCount = prevAylar.length;

  const eligibleCountPerPlace = {};
  yerler.forEach(y => {
    eligibleCountPerPlace[y.id] = teacherWrapper.filter(tw => 
      GUNLER.some(g => isSlotAllowed(tw, y.id, g, grup))
    ).length;
  });
  ekYerIdler.forEach(eid=>{
    eligibleCountPerPlace[eid] = teacherWrapper.filter(tw =>
      GUNLER.some(g => isSlotAllowed(tw, eid, g, grup))
    ).length;
  });

  const historyDays = {};
  const historyPlaces = {};
  const historyPairs = {};
  const lastAssignedDay = {};
  const lastAssignedPlace = {};

  teachers.forEach(t=>{
    historyDays[t.id] = { PAZARTESİ:0, SALI:0, ÇARŞAMBA:0, PERŞEMBE:0, CUMA:0 };
    historyPlaces[t.id] = {};
    historyPairs[t.id] = {};
    yerler.forEach(y=>{ historyPlaces[t.id][y.id] = 0; });
    ekYerIdler.forEach(eid=>{ historyPlaces[t.id][eid] = 0; });
  });

  prevAylar.forEach(ay=>{
    Object.keys(ay.tablo || {}).forEach(yId=>{
      GUNLER.forEach(g=>{
        (ay.tablo[yId][g] || []).forEach(tId=>{
          if(historyDays[tId]){
            historyDays[tId][g] = (historyDays[tId][g] || 0) + 1;
            if(!(yId in historyPlaces[tId])) historyPlaces[tId][yId] = 0;
            historyPlaces[tId][yId] = (historyPlaces[tId][yId] || 0) + 1;
            const pairKey = yId + '_' + g;
            historyPairs[tId][pairKey] = (historyPairs[tId][pairKey] || 0) + 1;
          }
        });
      });
    });
  });

  if(prevAylar.length){
    const lastAy = prevAylar[prevAylar.length - 1];
    Object.keys(lastAy.tablo || {}).forEach(yId=>{
      GUNLER.forEach(g=>{
        (lastAy.tablo[yId][g] || []).forEach(tId=>{
          lastAssignedDay[tId] = g;
          lastAssignedPlace[tId] = yId;
        });
      });
    });
  }

  const aylar = [];
  const tumCakismalar = [];
  const kapsamYerIds = new Set(yerler.map(y=>y.id));
  ekYerIdler.forEach(eid=>kapsamYerIds.add(eid));

  // Adalet formülü, ekYerIdler'e ay ay eklenen taşma (overflow) slotlarını da
  // "o yerin gerçek toplam kapasitesi" olarak görebilsin diye, o ana kadar
  // eklenmiş toplam taşma slotu sayısını (yer bazında) burada biriktiriyoruz.
  let ekYerVerilenSoFarMap = {};

  for(let m = 0; m < kacAy; m++){
    const currentCompletedMonths = previousMonthsCount + m + 1;

    const configuredDates = (state.ayarlar.tarihAraliklari && state.ayarlar.tarihAraliklari[m]) || {};
    let baslangicTarihi = configuredDates.baslangic;
    let bitisTarihi = configuredDates.bitis;

    let yl, ml, ayEtiket;
    if (baslangicTarihi) {
      const p = baslangicTarihi.split('-').map(Number);
      yl = p[0];
      ml = p[1] - 1;
      ayEtiket = AYLAR_TR[ml] + ' ' + yl;
    } else {
      const today = new Date();
      const dt = new Date(today.getFullYear(), today.getMonth() + m, 1);
      yl = dt.getFullYear();
      ml = dt.getMonth();
      ayEtiket = AYLAR_TR[ml] + ' ' + yl;
      const defs = getDefaultMonthDateRange(yl, ml);
      baslangicTarihi = defs.baslangic;
      bitisTarihi = defs.bitis;
    }

    const ayInfo = { baslangicTarihi, bitisTarihi };

    const tablo = {};
    kapsamYerIds.forEach(id => { tablo[id] = {}; GUNLER.forEach(g=>tablo[id][g]=[]); });
    const cakismalar = [];

    const usedThisMonthIds = new Set();
    const restrictedPlaceIds = new Set();
    // FAZ 1.5'in (aşağıda) normal yerlerden tükettiği yer+gün birimlerini
    // sayar — FAZ 2'nin slot havuzu (slotsPhase2) bu kadarını düşmezse
    // aynı fiziksel yer/gün kontenjanı İKİ KEZ doldurulmuş olur (kapasite
    // ihlali). Bkz. slotsPhase2 satırı.
    const faz15Tuketilen = {};

    // Adalet maliyet fonksiyonu (gün/yer geçmişi + dinamik kota + jitter).
    // FAZ 2'deki Macar algoritması matrisinde VE FAZ 1.5'teki grup
    // ön-rezervasyonunda AYNI formül kullanılır — böylece "aynı gün nöbet"
    // grubuna önceden yer ayırmak, genel adalet mantığından SAPMAZ.
    function hesaplaMaliyet(tId, yerId, gun){
      const dayCnt = historyDays[tId][gun] || 0;
      const placeCnt = historyPlaces[tId][yerId] || 0;
      const pairCnt = historyPairs[tId][yerId + '_' + gun] || 0;

      const totalPlaceSlotsSoFar = slots.filter(sl => sl.yerId === yerId).length * currentCompletedMonths
        + (ekYerVerilenSoFarMap[yerId] || 0);
      const eligPlaceCount = eligibleCountPerPlace[yerId] || 1;
      const maxPlaceAllowed = Math.ceil(totalPlaceSlotsSoFar / eligPlaceCount);

      const totalDaySlotsSoFar = slots.filter(sl => sl.gun === gun).length * currentCompletedMonths;
      const eligDayCount = teacherWrapper.filter(twItem => yerler.some(y => isSlotAllowed(twItem, y.id, gun, grup, ayInfo))).length || 1;
      const maxDayAllowed = Math.ceil(totalDaySlotsSoFar / eligDayCount);

      let cost = 0;
      if (placeCnt >= maxPlaceAllowed) cost += 1e8;
      if (dayCnt >= maxDayAllowed) cost += 1e8;
      cost += (Math.pow(dayCnt, 4) * 10000) + (Math.pow(placeCnt, 4) * 10000) + (Math.pow(pairCnt, 2) * 5000);
      if (lastAssignedDay[tId] === gun) cost += 1500;
      if (lastAssignedPlace[tId] === yerId) cost += 1500;
      const jitterSeed = strHash(tId + '|' + yerId + '|' + gun + '|' + m + '|' + grup + '|' + cekilisSeed);
      cost += Math.abs(Math.sin(jitterSeed)) * 10.0;
      return cost;
    }

    // FAZ 1: Kısıtlı Yerler
    yerler.forEach(y=>{
      const whitelist = (y.izinliOgretmenler && y.izinliOgretmenler[grup]) || [];
      if(!whitelist.length) return;

      restrictedPlaceIds.add(y.id);
      const placeSlots = slots.filter(s=>s.yerId===y.id).slice()
        .sort((a,b)=> GUNLER.indexOf(a.gun) - GUNLER.indexOf(b.gun));
      if(!placeSlots.length) return;

      const eligibleTws = teacherWrapper.filter(tw =>
        GUNLER.some(g => isSlotAllowed(tw, y.id, g, grup, ayInfo))
      );
      const monthUsage = {};
      eligibleTws.forEach(tw => { monthUsage[tw.teacher.id] = 0; });

      placeSlots.forEach(s => {
        const candidates = eligibleTws.filter(tw =>
          isSlotAllowed(tw, y.id, s.gun, grup, ayInfo) &&
          !tablo[y.id][s.gun].includes(tw.teacher.id)
        );
        if(!candidates.length){
          cakismalar.push('"' + y.ad + '" YERİNDE ' + s.gun + ' GÜNÜ İÇİN UYGUN ÖĞRETMEN KALMADI.');
          return;
        }
        candidates.sort((a,b)=>{
          const aId = a.teacher.id, bId = b.teacher.id;
          const aScore = (historyPlaces[aId][y.id]||0) + monthUsage[aId];
          const bScore = (historyPlaces[bId][y.id]||0) + monthUsage[bId];
          if(aScore !== bScore) return aScore - bScore;
          const aDay = historyDays[aId][s.gun] || 0;
          const bDay = historyDays[bId][s.gun] || 0;
          if(aDay !== bDay) return aDay - bDay;
          const aJit = Math.abs(Math.sin(strHash(aId+'|'+y.id+'|'+s.gun+'|'+m+'|'+grup+'|'+cekilisSeed)));
          const bJit = Math.abs(Math.sin(strHash(bId+'|'+y.id+'|'+s.gun+'|'+m+'|'+grup+'|'+cekilisSeed)));
          return aJit - bJit;
        });

        const chosen = candidates[0];
        const tId = chosen.teacher.id;
        tablo[y.id][s.gun].push(tId);
        historyDays[tId][s.gun] = (historyDays[tId][s.gun]||0) + 1;
        historyPlaces[tId][y.id] = (historyPlaces[tId][y.id]||0) + 1;
        const pairKeyR = y.id + '_' + s.gun;
        historyPairs[tId][pairKeyR] = (historyPairs[tId][pairKeyR]||0) + 1;
        lastAssignedDay[tId] = s.gun;
        lastAssignedPlace[tId] = y.id;
        monthUsage[tId] += 1;
        usedThisMonthIds.add(tId);
      });
    });

    // İZİNDE (BELİRLİ TARİH ARALIĞI) İSTİSNASI: Bu ayın tarih aralığıyla
    // çakışan bir izin/rapor dönemi tanımlı öğretmenler bu ay hiç nöbet
    // yazılmadan atlanır (FAZ 1'de zaten isSlotAllowed üzerinden elenmiş
    // olsalar da, burada FAZ 2 havuzundan da açıkça çıkarılıp bilgi notu
    // ekleniyor ki "boş yer bulunamadı" gibi yanıltıcı bir çakışma uyarısı
    // yerine, durumun izinden kaynaklandığı açıkça görülsün).
    teacherWrapper.forEach(tw=>{
      const tId = tw.teacher.id;
      if(usedThisMonthIds.has(tId)) return;
      const izinKaydi = (tw.istler||[]).find(i=>i.tip==='izinde' && tarihAraliklariCakisiyorMu(i.izinBaslangic, i.izinBitis, baslangicTarihi, bitisTarihi));
      if(izinKaydi){
        usedThisMonthIds.add(tId);
      }
    });

    // FAZ 1.5: "AYNI GÜN NÖBET" GRUPLARINI ÖNCEDEN REZERVE ET.
    //
    // ÖNEMLİ DÜZELTME: Eskiden bu istisna FAZ 2 TAMAMEN bittikten SONRA,
    // zaten dolmuş bir tabloya sonradan "yamanmaya" çalışılıyordu — o ana
    // kadar çoğu yer/gün kotası dolduğu için grup üyelerini bir araya
    // getirecek boş yer sıklıkla kalmıyordu. ŞİMDİ: FAZ 2'nin genel havuzu
    // hiçbir yeri/günü tüketmeden ÖNCE, her "birlikte" grubu için (varsa
    // FAZ 1'de zaten sabit bir yere/güne atanmış üye onların ortak gününü
    // belirler; yoksa grup için gün geçmişi en dengeli olan gün seçilir)
    // TEK BİR günde topluca yer ayrılır — bu da FAZ 2'nin gördüğü havuzu
    // ve maliyet formülünü (yukarıdaki hesaplaMaliyet) aynen kullanır,
    // yani adalet mantığından sapmaz. Bir grup için hiçbir gün tam
    // sığmıyorsa, en çok üyeyi barındırabilen gün kısmen uygulanır; kalan
    // üye(ler) normal FAZ 2 havuzuna düşer ve ay sonunda
    // applyBirlikteGruplari yine son bir deneme yapar (üçüncü güvenlik ağı).
    getBirlikteGruplari(grup).forEach(uyeler=>{
      const twMapLocal = {};
      teacherWrapper.forEach(tw=>{ twMapLocal[tw.teacher.id] = tw; });
      const gecerli = uyeler.filter(id=>twMapLocal[id]);
      if(gecerli.length < 2) return;

      // İzinli olduğu için bu ay zaten yok sayılanlar grup hesabının dışında.
      const izinliHaric = gecerli.filter(id=>{
        const tw = twMapLocal[id];
        const izinKaydi = (tw.istler||[]).find(i=>i.tip==='izinde' && tarihAraliklariCakisiyorMu(i.izinBaslangic, i.izinBitis, baslangicTarihi, bitisTarihi));
        return !izinKaydi;
      });
      if(izinliHaric.length < 2) return;

      // FAZ 1'de zaten (kısıtlı bir yere) atanmış üye varsa, o üyenin günü
      // ZORUNLU hedef gündür — diğerleri o güne getirilmeye çalışılır.
      const fazBirAsg = {};
      let sabitGun = null;
      izinliHaric.forEach(id=>{
        if(usedThisMonthIds.has(id)){
          const a = findAssignment(tablo, id);
          if(a){ fazBirAsg[id] = a; if(!sabitGun) sabitGun = a.gun; }
        }
      });

      const yerlenecekler = izinliHaric.filter(id=>!usedThisMonthIds.has(id));
      if(!yerlenecekler.length) return; // hepsi zaten FAZ 1'de/izinli olarak çözüldü

      let gunAdaylari;
      if(sabitGun){
        gunAdaylari = [sabitGun];
      } else {
        // Grubun gün geçmişi toplamı en düşük (yani en az kullanılmış) gün
        // önce denenir — bu da genel gün adaletiyle uyumlu bir tercih.
        gunAdaylari = GUNLER.slice().sort((a,b)=>{
          const sa = izinliHaric.reduce((t,id)=>t+(historyDays[id][a]||0),0);
          const sb = izinliHaric.reduce((t,id)=>t+(historyDays[id][b]||0),0);
          return sa - sb;
        });
      }

      let enIyiPlan = null;
      for(const hedefGun of gunAdaylari){
        const geciciDolu = {};
        Object.keys(tablo).forEach(yid=>{ geciciDolu[yid] = new Set(tablo[yid][hedefGun] || []); });
        const plan = [];
        const basarisizlar = [];

        yerlenecekler.forEach(id=>{
          const tw = twMapLocal[id];
          const adaylar = yerler.filter(y=>{
            const doluSet = geciciDolu[y.id];
            if(doluSet.size >= yerKapasite(y.id)) return false;
            if(!isSlotAllowed(tw, y.id, hedefGun, grup, ayInfo)) return false;
            return true;
          }).sort((a,b)=> hesaplaMaliyet(id, a.id, hedefGun) - hesaplaMaliyet(id, b.id, hedefGun));

          if(adaylar.length){
            geciciDolu[adaylar[0].id].add(id);
            plan.push({ teacherId:id, yerId: adaylar[0].id });
          } else {
            basarisizlar.push(id);
          }
        });

        if(!enIyiPlan || basarisizlar.length < enIyiPlan.basarisizlar.length){
          enIyiPlan = { hedefGun, plan, basarisizlar };
        }
        if(basarisizlar.length===0){ enIyiPlan = { hedefGun, plan, basarisizlar }; break; }
      }

      if(enIyiPlan && enIyiPlan.plan.length){
        enIyiPlan.plan.forEach(p=>{
          tablo[p.yerId][enIyiPlan.hedefGun].push(p.teacherId);
          historyDays[p.teacherId][enIyiPlan.hedefGun] = (historyDays[p.teacherId][enIyiPlan.hedefGun]||0) + 1;
          historyPlaces[p.teacherId][p.yerId] = (historyPlaces[p.teacherId][p.yerId]||0) + 1;
          const pairKey = p.yerId + '_' + enIyiPlan.hedefGun;
          historyPairs[p.teacherId][pairKey] = (historyPairs[p.teacherId][pairKey]||0) + 1;
          lastAssignedDay[p.teacherId] = enIyiPlan.hedefGun;
          lastAssignedPlace[p.teacherId] = p.yerId;
          usedThisMonthIds.add(p.teacherId);
          const tuketimKey = p.yerId + '_' + enIyiPlan.hedefGun;
          faz15Tuketilen[tuketimKey] = (faz15Tuketilen[tuketimKey] || 0) + 1;
        });
      }
      // enIyiPlan.basarisizlar varsa: bu üyeler normal FAZ 2 havuzuna
      // düşer, ay sonunda applyBirlikteGruplari son bir deneme yapar.
    });

    // FAZ 2: Genel Dağıtım (Dinamik Aylık Kota & Sert Sınır)
    const teacherWrapperPhase2 = teacherWrapper.filter(tw => !usedThisMonthIds.has(tw.teacher.id));
    // FAZ 1.5'te tüketilen yer+gün slot birimlerini havuzdan düş — aksi
    // halde aynı fiziksel kontenjan Macar algoritması tarafından tekrar
    // doldurulabilir (kapasite ihlali).
    const faz15SayacGecici = {};
    const slotsPhase2 = slots.filter(s => {
      if(restrictedPlaceIds.has(s.yerId)) return false;
      const key = s.yerId + '_' + s.gun;
      const tuketilecek = faz15Tuketilen[key] || 0;
      if(!tuketilecek) return true;
      const suAna = faz15SayacGecici[key] || 0;
      if(suAna < tuketilecek){
        faz15SayacGecici[key] = suAna + 1;
        return false; // bu birim FAZ 1.5 tarafından zaten kullanıldı
      }
      return true;
    });

    // DİNAMİK EK YER TAMAMLAMA: Kısıtlı yerler (FAZ 1) o ay bazı öğretmenleri
    // tamamen kullanmış olabilir; bu durumda genel havuzdaki öğretmen sayısı
    // genel slot sayısından fazla kalabilir (baştaki tek seferlik ekleme bunu
    // hesaba katmıyordu, çünkü kısıtlı yer/öğretmen oranını görmüyordu).
    // Açığı seçilen ek yer(ler)e HER AY için ayrı ayrı ekleyerek kapatıyoruz.
    if(ekYerIdler.length){
      const acik = teacherWrapperPhase2.length - slotsPhase2.length;
      if(acik > 0){
        // ÖNCELİK SIRASI: seçilen ek yerler, "Taşma Ayarları"nda işaretlendiği
        // sırayla (üstteki yerler önce) doldurulur — bir yer TAMAMEN
        // dolmadan (5 günün 5'i de birer taşma alana kadar) bir sonraki
        // yere ASLA geçilmez. Her yerin kendi 5 günü içindeki başlangıç
        // günü aydan aya kayar (adalet için, hep aynı gün yüklenmesin diye)
        // ama bu kayma sadece o yerin kendi gün bloğu İÇİNDE kalır, bir
        // sonraki yere taşmaz — yani öncelik sırası hiçbir ay bozulmaz.
        const ekPairs = [];
        ekYerIdler.forEach(eid => {
          for(let d=0; d<GUNLER.length; d++){
            ekPairs.push({ yerId: eid, gun: GUNLER[(d + m) % GUNLER.length] });
          }
        });
        const buAyEklenen = {};
        for(let i=0; i<acik; i++){
          const p = ekPairs[i % ekPairs.length];
          slotsPhase2.push({ yerId: p.yerId, gun: p.gun, round: 900000 + i });
          buAyEklenen[p.yerId] = (buAyEklenen[p.yerId] || 0) + 1;
        }
        // Bu ayki taşma miktarını (yer bazında) kümülatif sayaca ekle — bu
        // ayın adalet hesaplamasında da (aşağıda) hemen devreye girsin.
        Object.keys(buAyEklenen).forEach(eid=>{
          ekYerVerilenSoFarMap[eid] = (ekYerVerilenSoFarMap[eid] || 0) + buAyEklenen[eid];
        });
      }
    }

    const priorityTws = teacherWrapperPhase2.filter(tw =>
      (tw.istler||[]).some(i => i.tip === 'sabit' || (i.tip === 'izinli' && i.yerIdler && i.yerIdler.length > 0))
    );
    const openTws = teacherWrapperPhase2.filter(tw => !priorityTws.includes(tw));

    const INF = 1e9;
    const assignedTeacherIds = new Set();
    const reportedTeacherIds = new Set();

    function assignSubset(tws, slotSubset){
      if(!tws.length || !slotSubset.length) return slotSubset;
      const costMatrix = [];
      const blockedMatrix = [];

      tws.forEach((tw) => {
        const tId = tw.teacher.id;
        const row = [];
        const blockedRow = [];

        slotSubset.forEach((s) => {
          const allowed = isSlotAllowed(tw, s.yerId, s.gun, grup, ayInfo);
          blockedRow.push(!allowed);

          if(!allowed){
            row.push(INF);
          } else {
            row.push(hesaplaMaliyet(tId, s.yerId, s.gun));
          }
        });
        costMatrix.push(row);
        blockedMatrix.push(blockedRow);
      });

      const matches = solveHungarianMinCost(costMatrix);
      const consumedIdx = new Set();

      matches.forEach(mt => {
        if(mt.teacherIdx < tws.length && mt.slotIdx < slotSubset.length){
          const tw = tws[mt.teacherIdx];
          const s = slotSubset[mt.slotIdx];
          const isBlocked = blockedMatrix[mt.teacherIdx][mt.slotIdx];

          if(isBlocked){
            cakismalar.push(tw.teacher.ad + ' — TANIMLI İSTİSNALARLA UYUMLU BOŞ NÖBET YERİ/GÜNÜ BULUNAMADI.');
            reportedTeacherIds.add(tw.teacher.id);
          } else {
            tablo[s.yerId][s.gun].push(tw.teacher.id);
            historyDays[tw.teacher.id][s.gun] = (historyDays[tw.teacher.id][s.gun] || 0) + 1;
            historyPlaces[tw.teacher.id][s.yerId] = (historyPlaces[tw.teacher.id][s.yerId] || 0) + 1;
            const pairKey = s.yerId + '_' + s.gun;
            historyPairs[tw.teacher.id][pairKey] = (historyPairs[tw.teacher.id][pairKey] || 0) + 1;
            lastAssignedDay[tw.teacher.id] = s.gun;
            lastAssignedPlace[tw.teacher.id] = s.yerId;
            assignedTeacherIds.add(tw.teacher.id);
            consumedIdx.add(mt.slotIdx);
          }
        }
      });

      return slotSubset.filter((s, idx) => !consumedIdx.has(idx));
    }

    // TEK GEÇİŞ (ÖNEMLİ ADALET DÜZELTMESİ): Bu ayın TÜM slotlarını (normal
    // yer slotları + taşma/"ek yer" slotları dahil) TEK bir Macar algoritması
    // (Hungarian) çözümünde birlikte değerlendiriyoruz.
    //
    // ÖNCEKİ HATA: Slotlar "round" bazında (round 0 = normal yerler; round
    // 9999/900000+ = sadece BAHÇE taşma slotları) AYRI AYRI çözülüyordu.
    // Round 0'da 24 öğretmenden sadece 20'si 20 normal slota (BAHÇE dahil)
    // atanabiliyordu; kalan 4 öğretmen — o öğretmenin BAHÇE geçmişi ne
    // olursa olsun — sıradaki roundlarda SADECE BAHÇE slotu bulduğu için
    // seçeneksiz şekilde zorla BAHÇE'ye düşüyordu. Yani "kim BAHÇE'ye
    // gidecek" kararı BAHÇE adaletine hiç bakmadan, round 0'da kimin
    // "kaybettiğine" göre belirleniyordu — bu da BAHÇE dağılımında
    // öngörülemeyen dengesizliğe (bazı öğretmende 2, bazısında 4 kez gibi)
    // yol açıyordu.
    //
    // DÜZELTME: Tüm slotları (BAHÇE taşması dahil) TEK matriste çözmek,
    // maliyet fonksiyonundaki (gün geçmişi, yer geçmişi, gün+yer eşleşme
    // geçmişi) üstel dengeleme cezalarının BAHÇE dahil TÜM yerler arasında
    // gerçekten global optimum bulmasını sağlar.
    let kalanSlotlarPhase2 = slotsPhase2.slice();

    const availablePriority = priorityTws.filter(tw => !assignedTeacherIds.has(tw.teacher.id));
    kalanSlotlarPhase2 = assignSubset(availablePriority, kalanSlotlarPhase2);

    const availableOpen = openTws.filter(tw => !assignedTeacherIds.has(tw.teacher.id));
    assignSubset(availableOpen, kalanSlotlarPhase2);

    teacherWrapperPhase2.forEach(tw=>{
      const tId = tw.teacher.id;
      if(!assignedTeacherIds.has(tId) && !reportedTeacherIds.has(tId)){
        cakismalar.push(tw.teacher.ad + ' — BU DÖNEMDE YETERLİ NÖBET YERİ/SLOTU OLMADIĞI İÇİN GÖREVLENDİRİLEMEDİ.');
      }
    });

    applyBirlikteGruplari(tablo, grup, teacherWrapper, cakismalar, historyDays, historyPlaces, historyPairs, lastAssignedDay, lastAssignedPlace, ayInfo);

    aylar.push({ 
      ay: yl + '-' + String(ml+1).padStart(2,'0'), 
      ayEtiket, 
      tablo, 
      cakismalar,
      baslangicTarihi,
      bitisTarihi
    });
    cakismalar.forEach(c => tumCakismalar.push(ayEtiket + ' — ' + c));
  }

  return {
    aylar, cakismalar: tumCakismalar, yapisalUyarilar,
    teacherCount: teachers.length, slotCount: baseSlots.length, eklenenSlot: ekleme,
    ekYerIdler
  };
}

// generateDagitim() her çağrıldığında rastgele bir çekiliş tohumu (cekilisSeed)
// kullanır; eşit derecede adil seçenekler arasındaki tercih bu tohuma göre
// değiştiği için, özellikle "AYNI GÜN NÖBET" gibi esnek istisnaların TAM
// olarak sağlanıp sağlanamayacağı denemeden denemeye değişebilir. Bu
// fonksiyon, adalet mantığına hiç dokunmadan generateDagitim()'i birkaç kez
// çalıştırır ve İSTİSNA ÇAKIŞMASI EN AZ (mümkünse SIFIR) olan sonucu otomatik
// seçer — kullanıcının elle "dağıtımı sıfırla" deyip tekrar tekrar denediği
// işi arka planda ve çok daha kapsamlı şekilde yapar.
function generateDagitimEnIyi(grup, kacAy, denemeSayisi){
  denemeSayisi = denemeSayisi || 15;
  let enIyi = null;
  let enIyiSkor = null;

  for(let i=0; i<denemeSayisi; i++){
    const res = generateDagitim(grup, kacAy);

    const birlikteCakisma = res.cakismalar.filter(c => c.includes('AYNI GÜN NÖBET')).length;
    const toplamCakisma = res.cakismalar.length;
    const yapisalUyariSayisi = res.yapisalUyarilar.length;
    // Öncelik sırası: önce yapısal uyarı yoksa, sonra AYNI GÜN NÖBET
    // çakışması en az olan, sonra toplam çakışma en az olan sonuç seçilir.
    const skor = [yapisalUyariSayisi, birlikteCakisma, toplamCakisma];

    if(!enIyi || skorDahaIyiMi(skor, enIyiSkor)){
      enIyi = res;
      enIyiSkor = skor;
    }
    if(skor[0]===0 && skor[1]===0 && skor[2]===0) break; // kusursuz sonuç bulundu, daha fazla denemeye gerek yok
  }

  return enIyi;
}

function skorDahaIyiMi(a, b){
  for(let i=0; i<a.length; i++){
    if(a[i] !== b[i]) return a[i] < b[i];
  }
  return false;
}

function allMonthsFor(grup){
  const map = {};
  state.dagitimlar[grup].forEach(batch=>{
    batch.aylar.forEach(ay=>{ map[ay.ay] = ay; });
  });
  return Object.values(map).sort((a,b)=>a.ay.localeCompare(b.ay));
