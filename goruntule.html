// generateDagitim() (algorithm.js) sonucu ZATEN anlık ve adil şekilde
// hesaplanır — bu dosya o sonucu BOZMADAN, sadece EKRANDA öğretmen
// öğretmen, rastgele bir çekiliş sırasıyla, "yer/gün" hücrelerine
// yerleştirerek açığa çıkarır (görsel sunum katmanı). Adalet/rotasyon
// mantığına hiç dokunmaz — çekiliş sırası kozmetiktir.
//
// DOM'a hiç dokunmaz (render.js'in işi); yalnızca `cekilis` durumunu
// (state.js) günceller ve global render() fonksiyonunu çağırır.

// ---- Ses efektleri (Web Audio API ile anlık üretilir, dosya gerekmez) ----
let cekilisAudioCtx = null;

function getCekilisAudioCtx(){
  if(!cekilisAudioCtx){
    try{ cekilisAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ cekilisAudioCtx = null; }
  }
  if(cekilisAudioCtx && cekilisAudioCtx.state === 'suspended'){
    cekilisAudioCtx.resume().catch(()=>{});
  }
  return cekilisAudioCtx;
}

// Her isim çekildiğinde çalan kısa "tık" sesi.
function playCekilisTikSesi(){
  const ctx = getCekilisAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(740, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(1040, ctx.currentTime + 0.08);
  gain.gain.setValueAtTime(0.001, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.13);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + 0.14);
}

// Çekiliş tamamlandığında çalan kısa, neşeli kapanış melodisi.
function playCekilisBitisSesi(){
  const ctx = getCekilisAudioCtx();
  if(!ctx) return;
  const notlar = [523.25, 659.25, 783.99, 1046.5]; // DO-MI-SOL-DO (yükselen)
  notlar.forEach((freq, i)=>{
    const t = ctx.currentTime + i * 0.14;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.001, t);
    gain.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.4);
  });
}


function buildCekilisSirasi(res, grup){
  const map = {};
  res.aylar.forEach((ay, ayIdx)=>{
    state.yerler.forEach(y=>{
      GUNLER.forEach(g=>{
        const ids = (ay.tablo[y.id] && ay.tablo[y.id][g]) || [];
        ids.forEach(tId=>{
          if(!map[tId]){
            const o = state.ogretmenler[grup].find(o=>o.id===tId);
            map[tId] = { teacherId: tId, teacherAd: o ? o.ad : '(SİLİNMİŞ ÖĞRETMEN)', assignments: [] };
          }
          map[tId].assignments.push({ ayIdx, yerId: y.id, gun: g });
        });
      });
    });
  });

  const units = Object.values(map);
  // Fisher-Yates: çekiliş sırası her seferinde farklı ve rastgele olsun.
  for(let i = units.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = units[i]; units[i] = units[j]; units[j] = tmp;
  }
  return units;
}


function emptyRevealedTablo(res){
  return res.aylar.map(()=>{
    const t = {};
    state.yerler.forEach(y=>{ t[y.id] = {}; GUNLER.forEach(g=>{ t[y.id][g] = []; }); });
    return t;
  });
}


function startCekilis(grup, res){
  if(cekilis) return; // zaten devam eden bir çekiliş varsa yenisini başlatma

  lastGenResults[grup] = res;
  cekilis = {
    grup,
    res,
    sira: buildCekilisSirasi(res, grup),
    index: 0,
    hiz: 'normal',
    delayMs: 1300,
    revealed: emptyRevealedTablo(res),
    lastRevealedKeys: [],
    currentTeacherAd: null,
    timer: null
  };
  render();
  cekilis.timer = setTimeout(cekilisTick, 900);
}


function cekilisTick(){
  if(!cekilis) return;
  const unit = cekilis.sira[cekilis.index];
  if(!unit){ finishCekilis(); return; }

  cekilis.currentTeacherAd = unit.teacherAd;
  const keys = [];
  unit.assignments.forEach(a=>{
    cekilis.revealed[a.ayIdx][a.yerId][a.gun].push(unit.teacherId);
    keys.push(a.ayIdx + '_' + a.yerId + '_' + a.gun);
  });
  cekilis.lastRevealedKeys = keys;
  cekilis.index++;
  playCekilisTikSesi();

  render();

  if(cekilis.index >= cekilis.sira.length){
    cekilis.timer = setTimeout(finishCekilis, 1100);
  } else {
    cekilis.timer = setTimeout(cekilisTick, cekilis.delayMs);
  }
}


function setCekilisHiz(hiz){
  if(!cekilis) return;
  cekilis.hiz = hiz;
  cekilis.delayMs = hiz === 'hizli' ? 450 : 1300;
}


function cekilisAnindaBitir(){
  if(!cekilis) return;
  if(cekilis.timer) clearTimeout(cekilis.timer);

  while(cekilis.index < cekilis.sira.length){
    const unit = cekilis.sira[cekilis.index];
    unit.assignments.forEach(a=>{
      cekilis.revealed[a.ayIdx][a.yerId][a.gun].push(unit.teacherId);
    });
    cekilis.index++;
  }
  finishCekilis();
}


function finishCekilis(){
  if(!cekilis) return;
  if(cekilis.timer) clearTimeout(cekilis.timer);
  cekilis = null;
  render();
  playCekilisBitisSesi();
  showAlert('NÖBET ÇEKİLİŞİ TAMAMLANDI! HERKESE HAYIRLI OLSUN.');
}

// Kayıtlı/yayınlanmış bir dağıtımda tek bir hücreyi (nöbet yeri + gün)
// manuel olarak düzeltmek için açılan pencere. Örn: hasta/raporlu bir
// öğretmenin yerine geçici olarak başka biri yazılabilir. Her satır ya
// mevcut öğretmen listesinden seçilir ya da serbest metin olarak yazılır.
// KAYDET'e basıldığında state.dagitimlar güncellenir ve publishSchedule()
// ile ANINDA Firebase'e yazılıp öğretmen ekranına yayınlanır.
function openHucreEditor(grup, batchIdx, ayIdx, yerId, gun){
  const modal = document.getElementById('appModal');
  const text = document.getElementById('modalText');
  const actions = document.getElementById('modalActions');
  if(!modal) return;

  const batch = state.dagitimlar[grup] && state.dagitimlar[grup][batchIdx];
  const ay = batch && batch.aylar[ayIdx];
  if(!batch || !ay) return;

  const yer = state.yerler.find(y=>y.id===yerId);
  const mevcutIds = (ay.tablo[yerId] && ay.tablo[yerId][gun]) ? ay.tablo[yerId][gun].slice() : [];
  const ogretmenListesi = state.ogretmenler[grup].slice().sort((a,b)=>a.ad.localeCompare(b.ad,'tr'));

  let satirlar = mevcutIds.length ? mevcutIds.slice() : [null];

  function ogretmenSecenekleri(seciliId){
    let opts = '<option value="">— BOŞ BIRAK —</option>';
    opts += ogretmenListesi.map(o=>`<option value="${esc(o.id)}" ${o.id===seciliId?'selected':''}>${esc(o.ad)}</option>`).join('');
    opts += `<option value="__manuel__" ${manuelMi(seciliId)?'selected':''}>✎ SERBEST YAZ (LİSTEDE YOK)</option>`;
    return opts;
  }

  function satirlarHtml(){
    return satirlar.map((id, i)=>{
      const manuelAcik = manuelMi(id);
      return `
      <div class="hucre-satir" data-row="${i}">
        <select class="hucre-secim" data-row="${i}">${ogretmenSecenekleri(id)}</select>
        <input type="text" class="hucre-serbest" data-row="${i}" placeholder="AD SOYAD YAZIN" value="${manuelAcik ? esc(manuelAdOku(id)) : ''}" style="display:${manuelAcik ? 'block' : 'none'};">
        <button type="button" class="btn outline hucre-sil-satir" data-remove-row="${i}" title="BU SATIRI KALDIR">✕</button>
      </div>`;
    }).join('');
  }

  function ciz(){
    text.innerHTML = `
      <div style="text-align:left;">
        <p style="font-weight:800;margin:0 0 4px;font-size:15px;">${esc(yer ? yer.ad : '')} — ${esc(gun)}</p>
        <p class="small-muted" style="margin:0 0 14px;">${esc(ay.ayEtiket || '')}</p>
        <div id="hucreSatirlar">${satirlarHtml()}</div>
        <button type="button" class="btn outline" id="hucreSatirEkle" style="margin-top:2px;">+ KİŞİ EKLE</button>
      </div>`;

    text.querySelectorAll('.hucre-secim').forEach(sel=>{
      sel.onchange = ()=>{
        const i = Number(sel.dataset.row);
        satirlar[i] = (sel.value === '__manuel__') ? manuelIdOlustur('') : (sel.value || null);
        ciz();
      };
    });
    text.querySelectorAll('.hucre-serbest').forEach(inp=>{
      // Not: burada ciz() ÇAĞRILMAZ — her tuş vuruşunda tüm satırları yeniden
      // çizmek input'un odağını (focus) kaybettirir. Sadece veri modelini
      // günceller; ekran zaten kullanıcının yazdığını gösteriyor.
      inp.oninput = ()=>{
        const i = Number(inp.dataset.row);
        satirlar[i] = manuelIdOlustur(inp.value);
      };
    });
    text.querySelectorAll('[data-remove-row]').forEach(btn=>{
      btn.onclick = ()=>{
        satirlar.splice(Number(btn.dataset.removeRow), 1);
        ciz();
      };
    });
    const ekleBtn = document.getElementById('hucreSatirEkle');
    if(ekleBtn) ekleBtn.onclick = ()=>{ satirlar.push(null); ciz(); };
  }
  ciz();

  actions.innerHTML = `
    <button class="btn outline" onclick="closeModal()">İPTAL</button>
    <button class="btn gold" id="hucreKaydetBtn">${icon('kaydet')}KAYDET VE YAYINLA</button>
  `;
  document.getElementById('hucreKaydetBtn').onclick = ()=>{
    const temizIds = satirlar.map(id=>{
      if(id == null) return null;
      if(manuelMi(id)){
        const ad = toUpperTr(manuelAdOku(id)).trim();
        return ad ? manuelIdOlustur(ad) : null;
      }
      return id;
    }).filter(Boolean);

    if(!ay.tablo[yerId]) ay.tablo[yerId] = {};
    ay.tablo[yerId][gun] = temizIds;
    saveState();
    closeModal();
    render();
    publishSchedule().then(()=>{
      showAlert('HÜCRE GÜNCELLENDİ VE ÖĞRETMEN EKRANINA ANINDA YAYINLANDI.');
    }).catch((err)=>{
      showAlert('HÜCRE YEREL OLARAK GÜNCELLENDİ, ANCAK ÇEVRİMİÇİ YAYINLAMA BAŞARISIZ OLDU (İNTERNET BAĞLANTINIZI KONTROL EDİN): ' + err.message);
    });
  };

  modal.style.display = 'flex';
}

    if(mtLogoImg){ mtLogoImg.src = state.kurum.logo; mtLogoImg.style.display = 'block'; }
  } else {
    logoImg.style.display = 'none';
    if(mtLogoImg) mtLogoImg.style.display = 'none';
  }

  const main = document.getElementById('main');
  if(currentTab==='ayarlar') main.innerHTML = renderAyarlar();
  else if(currentTab==='istisnalar') main.innerHTML = renderIstisnalar();
  else if(currentTab==='dagitim') main.innerHTML = renderDagitim();
  else if(currentTab==='istatistik') main.innerHTML = renderIstatistik();
  else if(currentTab==='yazdir') main.innerHTML = renderYazdir();
  bindEvents();
  updateCekilisModal();
}


// Nöbet çekilişi (kura simülasyonu) her zaman #cekilisModal içinde, tam
// ekran bir açılır pencerede gösterilir — hangi sekmede olunursa olunsun
// (main.innerHTML'in dışında yaşadığı için render()'ın normal tab dispatch'i
// bunu etkilemez). Kontrol butonları modal içinde olduğundan bindEvents()
// (yalnızca #main içini tarar) bunları bulamaz; bu yüzden ayrı bağlanır.
function updateCekilisModal(){
  const modal = document.getElementById('cekilisModal');
  const box = document.getElementById('cekilisModalBox');
  if(!modal || !box) return;

  if(!cekilis){
    modal.style.display = 'none';
    box.innerHTML = '';
    return;
  }

  modal.style.display = 'flex';
  box.innerHTML = renderCekilisModalBody();

  const bN = box.querySelector('[data-act=cekilisHizNormal]');
  if(bN) bN.onclick = ()=>{ setCekilisHiz('normal'); render(); };
  const bH = box.querySelector('[data-act=cekilisHizHizli]');
  if(bH) bH.onclick = ()=>{ setCekilisHiz('hizli'); render(); };
  const bA = box.querySelector('[data-act=cekilisAninda]');
  if(bA) bA.onclick = ()=>{ cekilisAnindaBitir(); };

  // Boyutlar DOM'a yazıldıktan sonra (bir sonraki frame'de) gerçek
  // yüksekliği ölçüp gerekirse küçültüyoruz.
  requestAnimationFrame(fitCekilisAylarGrid);
}

function renderYerKisitPaneli(yerId){
  const yer = state.yerler.find(y=>y.id===yerId);
  if(!yer) return '';
  if(!yer.izinliOgretmenler) yer.izinliOgretmenler = {sabah:[], oglen:[]};

  const grupSekmeler = `
    <div class="subtabs" style="margin:10px 0;">
      <button data-act="kisitGrupSekme" data-grup="sabah" class="${kisitGrupSekme==='sabah'?'active':''}">SABAHÇI GRUBU</button>
      <button data-act="kisitGrupSekme" data-grup="oglen" class="${kisitGrupSekme==='oglen'?'active':''}">ÖĞLENCİ GRUBU</button>
    </div>`;

  const grup = kisitGrupSekme;
  const ogretmenler = state.ogretmenler[grup] || [];
  const izinliList = yer.izinliOgretmenler[grup] || [];
  const herkeseAcik = izinliList.length === 0;

  const ogretmenChecks = ogretmenler.length ? ogretmenler.map(t=>`
    <label style="font-size:12px;display:flex;align-items:center;gap:4px;background:var(--navy-soft);padding:4px 8px;border-radius:6px;">
      <input type="checkbox" class="yerKisitOgrChk" value="${t.id}" ${izinliList.includes(t.id)?'checked':''} ${herkeseAcik?'disabled':''}> ${esc(t.ad)}
    </label>`).join('') : `<span class="empty">BU GRUPTA ÖĞRETMEN TANIMLI DEĞİL.</span>`;

  return `
  <div class="card" style="margin-top:16px;border:1px solid var(--gold);">
    <h3 style="margin-top:0;">"${esc(yer.ad)}" İÇİN ERİŞİM KISITLAMASI</h3>
    ${grupSekmeler}
    <div class="field" style="margin-top:6px;">
      <label style="display:flex;align-items:center;gap:6px;font-weight:600;">

const ISTISNA_TIP_MAP = {sabit:'SABİT YER', izinli:'SADECE ŞU YERLER', yasakli:'ŞU YERLER HARİÇ', muaf:'NÖBETTEN MUAF', birlikte:'AYNI GÜN NÖBET (GRUP)', izinde:'İZİNLİ/RAPORLU (TARİH ARALIĞI)'};
const ISTISNA_TIP_SINIF = {sabit:'t-sabit', izinli:'t-izinli', yasakli:'t-yasakli', muaf:'t-muaf', birlikte:'t-birlikte', izinde:'t-izinde'};

// Arama kutusu + tür çipleriyle eşleşen istisnaları, öğretmen adına göre
// alfabetik sırayla döndürür. Hem ilk çizimde (renderIstisnalar) hem de
// arama/filtre değiştiğinde (sayfayı tamamen yeniden çizmeden) kullanılır.
function getFilteredIstisnalar(grup){
  const arama = toUpperTr(istisnaArama).trim();
  let list = state.istisnalar.filter(i=>i.grup===grup);
  if(istisnaTipFiltre !== 'tumu') list = list.filter(i=>i.tip===istisnaTipFiltre);
  if(arama){
    list = list.filter(i=>{
      const ogr = (state.ogretmenler[grup].find(o=>o.id===i.ogretmenId)||{}).ad || '';
      return ogr.includes(arama);
    });
  }
  return list.slice().sort((a,b)=>{
    const aAd = (state.ogretmenler[grup].find(o=>o.id===a.ogretmenId)||{}).ad || '';
    const bAd = (state.ogretmenler[grup].find(o=>o.id===b.ogretmenId)||{}).ad || '';
    return aAd.localeCompare(bAd,'tr');
  });
}

function renderIstisnaTabloIcerik(grup){
  const list = getFilteredIstisnalar(grup);
  const rows = list.map(i=>{
    const ogr = (state.ogretmenler[grup].find(o=>o.id===i.ogretmenId)||{}).ad || '(SİLİNMİŞ ÖĞRETMEN)';
    const tipEtiket = ISTISNA_TIP_MAP[i.tip] || i.tip;
    const tipSinif = ISTISNA_TIP_SINIF[i.tip] || '';
    let detay;
    if(i.tip==='birlikte'){
      const partnerAdlar = (i.partnerIds||[]).map(pid=>(state.ogretmenler[grup].find(o=>o.id===pid)||{}).ad || '(SİLİNMİŞ ÖĞRETMEN)').join(', ');
      detay = 'BİRLİKTE: ' + esc(partnerAdlar || '—');
    } else if(i.tip==='izinde'){
      const bas = i.izinBaslangic ? formatDateTR(i.izinBaslangic) : '?';
      const bit = i.izinBitis ? formatDateTR(i.izinBitis) : '?';
      detay = 'İZİN ARALIĞI: ' + bas + ' &ndash; ' + bit;
    } else {
      const yerAdlari = (i.yerIdler||[]).map(id=>(state.yerler.find(y=>y.id===id)||{}).ad).filter(Boolean).join(', ');
      let gunNotu = '';
      if(i.gunTipi==='sadece') gunNotu = ' [SADECE: ' + (i.gunler||[]).join(', ') + ']';
      else if(i.gunTipi==='haric') gunNotu = ' [HARİÇ: ' + (i.gunler||[]).join(', ') + ']';
      detay = (yerAdlari || 'TÜM YERLER (SERBEST)') + esc(gunNotu);
    }
    return `<tr>
      <td style="text-align:left;font-weight:700;">${esc(ogr)}</td>
      <td><span class="tip-badge ${tipSinif}">${tipEtiket}</span></td>
      <td>${detay}</td>
      <td style="white-space:nowrap;">
        <button class="btn outline small" data-act="editIstisna" data-id="${i.id}">${icon('duzenle')}DÜZENLE</button>
        <button class="btn danger small" data-act="delIstisna" data-id="${i.id}">${icon('sil')}SİL</button>
      </td>
    </tr>`;
  }).join('');

  if(!rows){
    const hicYok = !state.istisnalar.some(i=>i.grup===grup);
    const msg = hicYok ? 'BU GRUP İÇİN İSTİSNA TANIMLANMADI.' : 'ARAMA/FİLTREYE UYAN İSTİSNA BULUNAMADI.';
    return `<table class="data" style="margin-top:14px;">
      <tr><th>ÖĞRETMEN</th><th>TÜR</th><th>YER(LER) / GÜN KISITI</th><th>İŞLEM</th></tr>
      <tr><td colspan="4" class="empty">${msg}</td></tr>
    </table>`;
  }
  return `<table class="data" style="margin-top:14px;">
    <tr><th>ÖĞRETMEN</th><th>TÜR</th><th>YER(LER) / GÜN KISITI</th><th>İŞLEM</th></tr>
    ${rows}
  </table>`;
}

// Arama kutusuna yazarken ya da tür çipine tıklarken TÜM sayfayı yeniden
// çizmek yerine sadece tablo bölümünü günceller — böylece arama kutusundaki
// imleç/odak her tuş vuruşunda kaybolmaz, üstteki form da sıfırlanmaz.
function refreshIstisnaTablo(){
  const wrap = document.getElementById('istisnaTabloWrap');
  if(!wrap) return;
  wrap.innerHTML = renderIstisnaTabloIcerik(istisnaGrup);
  bindIstisnaRowEvents();
}

function bindIstisnaRowEvents(){
  const wrap = document.getElementById('istisnaTabloWrap');
  if(!wrap) return;
  wrap.querySelectorAll('[data-act=delIstisna]').forEach(b=>b.onclick=()=>{
    showConfirm('BU İSTİSNAYI SİLMEK İSTEDİĞİNİZE EMİN MİSİNİZ?', () => {
      state.istisnalar = state.istisnalar.filter(i=>i.id!==b.dataset.id);
      saveState();
      render();
    });
  });
  wrap.querySelectorAll('[data-act=editIstisna]').forEach(b=>b.onclick=()=>istisnaDuzenleForma(b.dataset.id));
}

// Var olan bir istisnayı, üstteki ekleme formuna aynen doldurup düzenleme
// moduna geçirir. Kaydetme mantığı zaten "aynı öğretmenin eski istisnasının
// yerini alır" şeklinde çalıştığından, formu doldurup EKLE'ye basmak fiilen
// GÜNCELLEME işlevi görür.
function istisnaDuzenleForma(id){
  const it = state.istisnalar.find(x=>x.id===id);
  if(!it) return;
  istisnaDuzenlenenId = id;
  const main = document.getElementById('main');
  const qq = sel=>main.querySelector(sel);
  const qqa = sel=>Array.from(main.querySelectorAll(sel));

  qq('#istOgretmen').value = it.ogretmenId;
  qq('#istTip').value = it.tip;
  qq('#istTip').dispatchEvent(new Event('change'));

  if(it.tip==='birlikte'){
    qqa('.istPartnerChk').forEach(c=>{ c.checked = (it.partnerIds||[]).includes(c.value); });
  } else if(it.tip==='izinde'){
    const b = qq('#istIzinBaslangic'), e = qq('#istIzinBitis');
    if(b) b.value = it.izinBaslangic || '';
    if(e) e.value = it.izinBitis || '';
  } else {
    qqa('.istYerChk').forEach(c=>{ c.checked = (it.yerIdler||[]).includes(c.value); });
    const gunTipiSel = qq('#istGunTipi');
    if(gunTipiSel){
      gunTipiSel.value = it.gunTipi || 'hepsi';
      gunTipiSel.dispatchEvent(new Event('change'));
    }
    qqa('.istGunChk').forEach(c=>{ c.checked = (it.gunler||[]).includes(c.value); });
  }

  qq('#istOgretmen').dispatchEvent(new Event('change'));

  const formCard = document.getElementById('istisnaFormCard');
  if(formCard){
    formCard.classList.add('editing');
    formCard.scrollIntoView({behavior:'smooth', block:'start'});
  }
}

function renderDagitim(){
  const grup = dagitimGrup;
  const batches = state.dagitimlar[grup];
  const cekilisAktif = !!cekilis;
  const buGrubunCekilisi = cekilis && cekilis.grup === grup;

  let resultHtml = '';
  if(cekilis && cekilis.grup === grup){
    resultHtml = ''; // çekiliş açılır pencerede gösteriliyor, burada boş bırakılır
  } else if(lastGenResults[grup]){
    resultHtml = renderGenResult(lastGenResults[grup], grup);
  } else if(batches.length){
    // Sayfa yenilendiğinde (tarayıcı kapatılıp açıldığında vb.) taze
    // çekiliş sonucu (lastGenResults) hafızada kalmaz — ama kaydedilmiş
    // son dönem state.dagitimlar'da KALICI olarak durur. Bu yüzden burada
    // "hiçbir şey yok" göstermek yerine, en son kaydedilen dönemi
    // görüntülüyoruz; böylece Nöbet Dağıtımı sekmesi de Çizelge/İstatistik
    // sekmeleriyle aynı veriyi gösterir, veri "kaybolmuş" gibi görünmez.
    resultHtml = renderSavedResult(batches[batches.length - 1], grup, batches.length - 1);
  }
  const gecmis = batches.length 
    ? batches.map((b,idx)=>`<span class="pill" style="background:var(--navy-soft);color:var(--navy);font-weight:700;display:inline-flex;align-items:center;gap:6px;">${b.aylar.map(a=>a.ayEtiket).join(', ')}<button data-act="delDonem" data-grup="${grup}" data-idx="${idx}" title="BU DÖNEMİ SİL (YER AÇMAK İÇİN)" style="background:none;border:none;color:var(--danger);cursor:pointer;font-weight:800;font-size:13px;line-height:1;padding:0;">✕</button></span>`).join('') 
    : `<span class="empty">HENÜZ DAĞITIM OLUŞTURULMADI.</span>`;
    
  const grupIstisnalari = state.istisnalar.filter(i=>i.grup===grup);
  const istTipMap = {sabit:'SABİT', izinli:'İZİNLİ LİSTE', yasakli:'YASAKLI LİSTE', muaf:'MUAF', birlikte:'GRUP EŞLEŞTİRME', izinde:'İZİNLİ/RAPORLU'};

  const istisnaEtiketleri = grupIstisnalari.map(i=>{
    const ogr = (state.ogretmenler[grup].find(o=>o.id===i.ogretmenId)||{}).ad || '(SİLİNMİŞ)';
    const tipStr = istTipMap[i.tip] || i.tip;
    return `<span class="pill" style="background:var(--gold-soft);color:#8A5D14;border:1px solid #EFD9AE;font-weight:700;">${esc(ogr)} — ${tipStr}</span>`;
  }).join('');

  return `
  <div class="card">
    <h2>${icon('dagitim')}NÖBET DAĞITIMI VE HESAPLAMA</h2>
    <p class="desc">Ayarlar'da belirlediğiniz (${state.ayarlar.kacAy} dönem) süre için ayarlanan tarih aralıklarına göre otomatik ve adil dağıtım yapılır.</p>
    <div class="card-divider"></div>

    <div class="subtabs" style="margin-bottom:18px;">
      <button data-act="dagGrup" data-grup="sabah" class="${grup==='sabah'?'active':''}" ${cekilisAktif?'disabled':''}>${icon('sabah')}SABAHÇI GRUBU (${state.ogretmenler.sabah.length} ÖĞRETMEN)</button>
      <button data-act="dagGrup" data-grup="oglen" class="${grup==='oglen'?'active':''}" ${cekilisAktif?'disabled':''}>${icon('oglen')}ÖĞLENCİ GRUBU (${state.ogretmenler.oglen.length} ÖĞRETMEN)</button>
    </div>

    <div class="stat-mini-row">
      <div class="stat-mini">
        <span class="ico">${icon('ogretmenler')}</span>
        <div><div class="stat-mini-num">${state.ogretmenler[grup].length}</div><div class="stat-mini-label">ÖĞRETMEN</div></div>
      </div>
      <div class="stat-mini">
        <span class="ico">${icon('yerler')}</span>
        <div><div class="stat-mini-num">${state.yerler.length}</div><div class="stat-mini-label">NÖBET YERİ</div></div>
      </div>
      <div class="stat-mini">
        <span class="ico">${icon('istisna')}</span>
        <div><div class="stat-mini-num">${grupIstisnalari.length}</div><div class="stat-mini-label">TANIMLI İSTİSNA</div></div>
      </div>
      <div class="stat-mini">
        <span class="ico">${icon('istatistik')}</span>
        <div><div class="stat-mini-num">${batches.length}</div><div class="stat-mini-label">KAYITLI DÖNEM</div></div>
      </div>
    </div>

    <div class="row" style="margin:18px 0 16px;gap:12px;">
      <button class="btn gold" data-act="generate" style="padding:11px 22px;font-size:13px;" ${cekilisAktif?'disabled':''}>${icon('cekilis')}${buGrubunCekilisi ? 'ÇEKİLİŞ DEVAM EDİYOR...' : 'DAĞITIMI OLUŞTUR (ÇEKİLİŞ)'}</button>

    </div>

    <div class="subcard" style="margin-bottom:0;">
      <div class="subcard-title">KAYDEDİLEN DÖNEMLER <span class="count">(YER AÇMAK İÇİN SİLİNEBİLİR)</span></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">${gecmis}</div>
      <div class="subcard-title" style="margin-top:16px;">TANIMLI İSTİSNALAR (${grupIstisnalari.length})</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">${istisnaEtiketleri || '<span class="empty">YOK</span>'}</div>
    </div>
  </div>
  ${resultHtml}
  `;
}


// Sayfa yenilendiğinde/tarayıcı yeniden açıldığında taze çekiliş sonucu
// (lastGenResults) hafızada kalmadığı için, en son KAYITLI dönemi salt
// okunur şekilde gösteren yardımcı fonksiyon. "KAYDET VE YAYINLA" butonu
// yok — bu veri zaten kayıtlı ve yayınlanmış.
function renderSavedResult(batch, grup, batchIdx){
  const aylarHtml = batch.aylar.map((ay, idx)=>renderAyTablosu(ay, grup, idx + 1, {editable:true, batchIdx})).join('');
  return `

// Çekiliş penceresindeki ay ızgarasını, mevcut pencere yüksekliğine KESİN
// olarak sığacak şekilde otomatik küçültür. Statik kırılma noktaları tahmin
// etmek yerine gerçek yüksekliği ölçüp gerekiyorsa transform:scale ile
// oranlı küçültme uygular — ay sayısı ve ekran boyutu ne olursa olsun
// taşma/kaydırma ihtiyacını ortadan kaldırır.
function fitCekilisAylarGrid(){
  const box = document.getElementById('cekilisModalBox');
  if(!box) return;
  const header = box.querySelector('.cekilis-modal-header');
  const wrap = box.querySelector('.cekilis-fit-wrap');
  const grid = box.querySelector('.cekilis-aylar-grid');
  if(!header || !wrap || !grid) return;

  // Önceki ölçeklemeyi sıfırla ki gerçek (doğal) boyutu ölçebilelim.
  grid.style.transform = '';
  wrap.style.height = '';

  const boxStyle = getComputedStyle(box);
  const dikeyBosluk = (parseFloat(boxStyle.paddingTop) || 0) + (parseFloat(boxStyle.paddingBottom) || 0);
  const headerStyle = getComputedStyle(header);
  const headerToplam = header.offsetHeight + (parseFloat(headerStyle.marginBottom) || 0);

  const kullanilabilirYukseklik = box.clientHeight - dikeyBosluk - headerToplam;
  const dogalYukseklik = grid.scrollHeight;

  if(dogalYukseklik > kullanilabilirYukseklik && kullanilabilirYukseklik > 60){
    const olcek = Math.max(0.4, kullanilabilirYukseklik / dogalYukseklik);
    grid.style.transform = 'scale(' + olcek + ')';
    wrap.style.height = (dogalYukseklik * olcek) + 'px';
  }
}


function renderHucreCekilis(finalIds, revealedIds, grup){
  const parts = [];
  revealedIds.forEach(id=>{
    const o = state.ogretmenler[grup].find(o=>o.id===id);
    if(o) parts.push(`<div class="cekilis-revealed-name">${esc(o.ad)}</div>`);
  });
  const kalan = finalIds.length - revealedIds.length;
  for(let i=0; i<kalan; i++){ parts.push('<div class="cekilis-placeholder">?</div>'); }
  return parts.length ? parts.join('') : '<span class="empty">&mdash;</span>';
}


// Çekiliş (dağıtım animasyonu) tablosunda gün başlıkları TEK bir pastel
// renk, nöbet yeri hücreleri ise TEK (farklı) bir pastel renk alır —
// yani sadece iki sabit ton kullanılır, hücre/satır başına ayrı renk yok.
const CEKILIS_PASTEL_GUN = '#E3EAF6';
const CEKILIS_PASTEL_YER = '#FBEBD9';

function renderAyTablosuCekilis(ay, ayIdx, grup, siraNo, revealed, flashSet){
  const rows = state.yerler.map((y)=>{
    const cells = GUNLER.map(g=>{
      const finalIds = (ay.tablo[y.id] && ay.tablo[y.id][g]) || [];
      const revIds = (revealed[ayIdx] && revealed[ayIdx][y.id] && revealed[ayIdx][y.id][g]) || [];
      const flashCls = flashSet.has(ayIdx + '_' + y.id + '_' + g) ? 'cekilis-cell-flash' : '';
      return `<td class="${flashCls}">${renderHucreCekilis(finalIds, revIds, grup)}</td>`;
    }).join('');
    return `<tr><td class="yer" style="background:${CEKILIS_PASTEL_YER};">${esc(y.ad)}</td>${cells}</tr>`;
  }).join('');

  const tarihEtiketi = (ay.baslangicTarihi && ay.bitisTarihi)
    ? (formatDateTR(ay.baslangicTarihi) + ' &ndash; ' + formatDateTR(ay.bitisTarihi))
    : ay.ayEtiket;

  const gunBasliklari = GUNLER.map(g=>`<th style="background:${CEKILIS_PASTEL_GUN};">${g}</th>`).join('');

  return `
  <div class="card">

      ${rows}
    </table>
    </div>
  </div>`;
}


// Manuel olarak (öğretmen listesinde olmayan bir isimle) düzeltilmiş
// hücreler, "MANUAL::İSİM" biçiminde özel bir kimlik olarak saklanır.
// Böylece bu kişi rotasyon/istatistik hesaplarına karışmaz, sadece o
// hücrede görüntülenir ve öğretmen ekranına aynen yayınlanır.
const MANUEL_ON_EK = 'MANUAL::';
function manuelMi(id){ return typeof id === 'string' && id.indexOf(MANUEL_ON_EK) === 0; }
function manuelAdOku(id){ return id.slice(MANUEL_ON_EK.length); }
function manuelIdOlustur(ad){ return MANUEL_ON_EK + ad; }

function renderHucre(ids, grup){
  const names = (ids||[]).map(id=>{
    if(manuelMi(id)) return esc(manuelAdOku(id));
    const o = state.ogretmenler[grup].find(o=>o.id===id);
    return o ? esc(o.ad) : '';
  }).filter(Boolean);
  return names.length ? names.map(n=>`<div>${n}</div>`).join('') : '<span class="empty">&mdash;</span>';
}


function renderAyTablosu(ay, grup, siraNo, ctx){
  const editable = !!(ctx && ctx.editable);
  const batchIdx = ctx ? ctx.batchIdx : null;
  const ayIdx = siraNo - 1;

  const rows = state.yerler.map(y=>{
    const cells = GUNLER.map(g=>{
      const ids = ay.tablo[y.id] ? ay.tablo[y.id][g] : [];
      if(editable){
        return `<td class="hucre-duz" data-act="hucreDuzenle" data-grup="${grup}" data-batch="${batchIdx}" data-ay="${ayIdx}" data-yer="${y.id}" data-gun="${esc(g)}" title="DÜZENLEMEK İÇİN TIKLAYIN">${renderHucre(ids, grup)}<span class="hucre-kalem-ico">✎</span></td>`;
      }
      return `<td>${renderHucre(ids, grup)}</td>`;
    }).join('');
    return `<tr><td class="yer">${esc(y.ad)}</td>${cells}</tr>`;
  }).join('');

  const tarihEtiketi = (ay.baslangicTarihi && ay.bitisTarihi) 
    ? (formatDateTR(ay.baslangicTarihi) + ' &ndash; ' + formatDateTR(ay.bitisTarihi)) 
    : ay.ayEtiket;

  const izinliBuAy = state.istisnalar.filter(i=>
    i.grup===grup && i.tip==='izinde' &&
    tarihAraliklariCakisiyorMu(i.izinBaslangic, i.izinBitis, ay.baslangicTarihi, ay.bitisTarihi)
  ).map(i=>(state.ogretmenler[grup].find(o=>o.id===i.ogretmenId)||{}).ad).filter(Boolean);
  const izinNotu = izinliBuAy.length
    ? `<p class="small-muted" style="margin:4px 0 0;">İZİNLİ/RAPORLU (BU AY NÖBET YAZILMADI): ${esc(izinliBuAy.join(', '))}</p>`
    : '';

  return `
  <div class="card">
    <h2>${ay.ayEtiket.replace(/\s*\d{4}$/, '')} PROGRAMI (${tarihEtiketi}) — ${GRUP_ETIKET[grup]}</h2>
    ${izinNotu}
    ${editable ? '<p class="small-muted" style="margin:4px 0 10px;">BİR HÜCREYE TIKLAYARAK İSİM DEĞİŞTİREBİLİR VEYA MANUEL EKLEYEBİLİRSİNİZ (ÖRN. RAPORLU/HASTA ÖĞRETMEN YERİNE). DEĞİŞİKLİK ANINDA KAYDEDİLİP ÖĞRETMEN EKRANINA YAYINLANIR.</p>' : ''}
    <div class="table-scroll">
    <table class="data">
      <tr><th>NÖBET YERİ</th>${GUNLER.map(g=>`<th>${g}</th>`).join('')}</tr>
      ${rows}
    </table>
    </div>
  </div>`;

// Kaydedilmiş dağıtımlardan öğretmen/yer bazlı özet istatistik üretir.

function renderIstatistik(){
  const grup = istatistikGrup;
  const teachers = state.ogretmenler[grup];
  const yerler = state.yerler;
  const batches = state.dagitimlar[grup];

  if(!batches || !batches.length || !teachers.length){
    return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:8px;">
        <h2 style="margin:0;">${icon('istatistik')}NÖBET DAĞITIM İSTATİSTİKLERİ</h2>
      </div>
      <div class="subtabs">
        <button data-act="istatistikGrup" data-grup="sabah" class="${grup==='sabah'?'active':''}">SABAHÇI GRUBU (${state.ogretmenler.sabah.length} ÖĞRETMEN)</button>
        <button data-act="istatistikGrup" data-grup="oglen" class="${grup==='oglen'?'active':''}">ÖĞLENCİ GRUBU (${state.ogretmenler.oglen.length} ÖĞRETMEN)</button>
      </div>
      <p class="empty">BU GRUP İÇİN KAYDEDİLMİŞ DAĞITIM BULUNAMADI. ÖNCE NÖBET DAĞITIMINI OLUŞTURUP KAYDEDİN.</p>
    </div>`;
  }

  const uniqueMonthsMap = {};
  batches.forEach(b => {
    (b.aylar || []).forEach(ay => {
      uniqueMonthsMap[ay.ay] = ay;
    });
  });
  const uniqueAylar = Object.values(uniqueMonthsMap);

  const stats = {};
  teachers.forEach(t=>{
    stats[t.id] = {
      ad: t.ad,
      total: 0,
      days: { PAZARTESİ:0, SALI:0, ÇARŞAMBA:0, PERŞEMBE:0, CUMA:0 },
      places: {}
    };
    yerler.forEach(y=>{ stats[t.id].places[y.id] = 0; });
  });

  uniqueAylar.forEach(ay => {
    Object.keys(ay.tablo || {}).forEach(yId => {
      GUNLER.forEach(g => {
        (ay.tablo[yId][g] || []).forEach(tId => {
          if (stats[tId]) {
            stats[tId].total++;
            stats[tId].days[g] = (stats[tId].days[g] || 0) + 1;
            stats[tId].places[yId] = (stats[tId].places[yId] || 0) + 1;
          }
        });
      });
    });
  });

  const statList = Object.values(stats);
  const totals = statList.map(st => st.total).filter(n => n > 0);
  const maxTotal = totals.length ? Math.max(...totals) : 0;
  const avgTotal = totals.length ? (totals.reduce((a,b)=>a+b,0) / totals.length) : 0;

  const rows = statList.sort((a,b)=>a.ad.localeCompare(b.ad,'tr')).map(st=>{
    const dayPills = GUNLER.map(g=>`<span class="pill">${g.slice(0,3)}: ${st.days[g]||0}</span>`).join('');
    const placePills = yerler.map(y=>`<span class="pill">${esc(y.ad)}: ${st.places[y.id]||0}</span>`).join('');
    // Ortalamadan %25'ten fazla sapan değerler "aykırı" sayılır: yüksek olan
    // (kırmızı) fazla yüklenmiş, düşük olan (altın) az yüklenmiş anlamına gelir —
    // adaletsiz dağılım tabloya girmeden, bir bakışta fark edilsin diye.
    let outlierCls = '';
    if(avgTotal > 0 && st.total > 0){
      if(st.total >= avgTotal * 1.25) outlierCls = 'stat-high';
      else if(st.total <= avgTotal * 0.75) outlierCls = 'stat-low';
    }
    const barPct = maxTotal > 0 ? Math.round((st.total / maxTotal) * 100) : 0;
    return `
    <tr>
      <td style="text-align:left;font-weight:700;">${esc(st.ad)}</td>
      <td>
        <div class="stat-total ${outlierCls}">
          <span class="stat-total-num">${st.total}</span>
          <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${barPct}%"></div></div>
        </div>
      </td>
      <td>${dayPills}</td>
      <td>${placePills}</td>
    </tr>`;
  }).join('');

  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:8px;">
      <h2 style="margin:0;">${icon('istatistik')}NÖBET DAĞITIM İSTATİSTİKLERİ</h2>
      <button class="btn success" data-act="exportExcel">EXCEL'E AKTAR (.XLSX)</button>
    </div>
    <p class="desc">KAYDEDİLEN ${uniqueAylar.length} DÖNEM BAZINDA ÖĞRETMENLERİN TOPLAM NÖBET, GÜN VE YER DAĞILIMLARI. <span style="color:var(--danger);font-weight:700;">KIRMIZI</span> = ORTALAMANIN BELİRGİN ÜZERİNDE, <span style="color:var(--gold);font-weight:700;">ALTIN</span> = ORTALAMANIN BELİRGİN ALTINDA.</p>
    <div class="subtabs">
      <button data-act="istatistikGrup" data-grup="sabah" class="${grup==='sabah'?'active':''}">SABAHÇI GRUBU (${state.ogretmenler.sabah.length} ÖĞRETMEN)</button>
      <button data-act="istatistikGrup" data-grup="oglen" class="${grup==='oglen'?'active':''}">ÖĞLENCİ GRUBU (${state.ogretmenler.oglen.length} ÖĞRETMEN)</button>
    </div>
    <div class="table-scroll">
    <table class="data">
      <tr><th>ÖĞRETMEN ADI</th><th>TOPLAM NÖBET</th><th>GÜN DAĞILIMI</th><th>YER DAĞILIMI</th></tr>
      ${rows}
    </table>
    </div>
  </div>`;
}
