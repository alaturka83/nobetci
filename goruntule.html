<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nöbet Çizelgesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{
  --navy:#1B2A4A; --navy-soft:#EAF0F9; --gold:#C9A227; --gold-soft:#FBF1D8;
  --line:#E3E7EE; --muted:#6B7280; --text:#1F2430; --bg:#F5F6F9; --card:#FFFFFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;}
.wrap{max-width:1100px;margin:0 auto;padding:14px 10px 50px;}
.header{background:var(--navy);color:#fff;border-radius:14px;padding:16px 16px;display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.header img{width:44px;height:44px;object-fit:contain;border-radius:9px;flex-shrink:0;}
.header .h-title{font-size:16px;font-weight:800;letter-spacing:.2px;line-height:1.25;}
.header .h-sub{font-size:12px;opacity:.85;margin-top:2px;line-height:1.3;}
.updated{font-size:11.5px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.tabs button{border:1.5px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:13px;padding:12px 16px;border-radius:10px;cursor:pointer;flex:1 1 auto;min-height:44px;-webkit-user-select:none;user-select:none;}
.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.donem-list{display:flex;gap:8px;margin-bottom:14px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
.donem-list button{border:1.5px solid var(--gold);background:var(--gold-soft);color:#8A5D14;font-weight:700;font-size:12.5px;padding:10px 16px;border-radius:20px;cursor:pointer;white-space:nowrap;min-height:40px;flex-shrink:0;}
.donem-list button.active{background:var(--gold);color:#fff;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 2px rgba(20,25,40,.04);}
.card h2{font-size:13.5px;margin:0 0 10px;color:var(--navy);line-height:1.35;}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px;}
table.data{width:100%;border-collapse:collapse;font-size:12.5px;}
table.data th, table.data td{border:1px solid var(--line);padding:8px 8px;text-align:center;vertical-align:middle;min-width:78px;}
table.data th{background:var(--navy-soft);color:var(--navy);font-weight:800;font-size:11px;white-space:nowrap;}
table.data th:first-child, table.data td.yer{
  position:sticky;left:0;z-index:2;
  background:var(--navy-soft);font-weight:700;color:var(--navy);text-align:left;
  min-width:84px;max-width:110px;box-shadow:2px 0 3px rgba(20,25,40,.06);
}
table.data th:first-child{z-index:3;}
.empty{color:#B7BDC9;}
.msg{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px;}
.refresh{border:1.5px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:12px;padding:9px 14px;border-radius:9px;cursor:pointer;min-height:40px;}
.filter-bar{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;}
.filter-item{display:flex;flex-direction:column;gap:5px;width:100%;}
.filter-item label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.3px;}
.filter-item select{border:1.5px solid var(--line);border-radius:9px;padding:11px 10px;font-size:16px;font-family:inherit;color:var(--text);background:#fff;min-height:44px;width:100%;}
.filter-clear{border:1.5px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:13px;padding:11px 14px;border-radius:9px;cursor:pointer;min-height:44px;width:100%;}
tr.row-hidden{display:none;}
.cell-match{background:var(--gold-soft);font-weight:800;color:#8A5D14;border-radius:5px;padding:3px 4px;}
.cell-dim{opacity:.3;}

@media (min-width: 640px){
  .wrap{padding:22px 16px 60px;}
  .header{padding:22px 24px;gap:16px;}
  .header img{width:52px;height:52px;border-radius:10px;}
  .header .h-title{font-size:19px;}
  .header .h-sub{font-size:13px;}
  .updated{font-size:12px;}
  .tabs button{flex:0 1 auto;font-size:13px;padding:10px 16px;min-height:auto;}
  .donem-list{flex-wrap:wrap;overflow-x:visible;}
  .card{padding:20px;}
  .card h2{font-size:15px;}
  .table-scroll{margin:0;padding:0;}
  table.data{font-size:13px;}
  table.data th, table.data td{padding:9px 10px;min-width:auto;}
  table.data th{font-size:12px;white-space:normal;}
  table.data th:first-child, table.data td.yer{position:static;box-shadow:none;max-width:none;}
  .refresh{float:right;}
  .filter-bar{flex-direction:row;flex-wrap:wrap;padding:14px 16px;}
  .filter-item{min-width:180px;flex:1;}
  .filter-item select{font-size:13px;min-height:auto;}
  .filter-clear{align-self:flex-end;width:auto;min-height:auto;}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><div class="msg">YÜKLENİYOR…</div></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBUOA8oDCVkZtKmqgynjsYBHlIZEM2cCTs",
  authDomain: "nobet-programi-d0ada.firebaseapp.com",
  databaseURL: "https://nobet-programi-d0ada-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "nobet-programi-d0ada",
  storageBucket: "nobet-programi-d0ada.firebasestorage.app",
  messagingSenderId: "799459966173",
  appId: "1:799459966173:web:05528e0fe25f184cc02f34",
  measurementId: "G-EX3WRN0KF3"
};
firebase.initializeApp(firebaseConfig);
const fbDb = firebase.database();

const GUNLER = ['PAZARTESİ','SALI','ÇARŞAMBA','PERŞEMBE','CUMA'];
const GRUP_ETIKET = {sabah:'SABAHÇI GRUBU', oglen:'ÖĞLENCİ GRUBU'};

let veri = null;
let aktifGrup = 'sabah';
let aktifDonemIdx = 0;
let filtreYer = '';
let filtreOgretmen = '';

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','&':'&amp;'}[c])); }

function formatTarih(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.toLocaleString('tr-TR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
}

function ogretmenAd(grup, id){
  const list = (veri.ogretmenler && veri.ogretmenler[grup]) || [];
  const o = list.find(x=>x.id===id);
  return o ? esc(o.ad) : '';
}

function renderHucre(ids, grup){
  const names = (ids||[]).map(id=>({id, ad:ogretmenAd(grup, id)})).filter(x=>x.ad);
  if(!names.length) return '<span class="empty">&mdash;</span>';
  return names.map(n=>{
    const eslesti = filtreOgretmen && n.id === filtreOgretmen;
    return `<div class="${eslesti ? 'cell-match' : (filtreOgretmen ? 'cell-dim' : '')}">${n.ad}</div>`;
  }).join('');
}

function formatDateTR(dateStr){
  if(!dateStr) return '';
  const p = dateStr.split('-');
  if(p.length !== 3) return dateStr;
  return p[2] + '.' + p[1] + '.' + p[0];
}

function renderAyTablosu(ay, grup, siraNo){
  const yerler = veri.yerler || [];
  const rows = yerler.map(y=>{
    const gizli = filtreYer && y.id !== filtreYer;
    const cells = GUNLER.map(g=>{
      const ids = ay.tablo && ay.tablo[y.id] ? ay.tablo[y.id][g] : [];
      return `<td>${renderHucre(ids, grup)}</td>`;
    }).join('');
    return `<tr class="${gizli ? 'row-hidden' : ''}"><td class="yer">${esc(y.ad)}</td>${cells}</tr>`;
  }).join('');

  const tarihAraligi = (ay.baslangicTarihi && ay.bitisTarihi)
    ? (formatDateTR(ay.baslangicTarihi) + ' – ' + formatDateTR(ay.bitisTarihi))
    : '';

  return `
  <div class="card">
    <h2>${esc((ay.ayEtiket || '').replace(/\s*\d{4}$/, ''))} PROGRAMI${tarihAraligi ? ' (' + tarihAraligi + ')' : ''}</h2>
    <div class="table-scroll">
    <table class="data">
      <tr><th>NÖBET YERİ</th>${GUNLER.map(g=>`<th>${g}</th>`).join('')}</tr>
      ${rows}
    </table>
    </div>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  if(!veri || !veri.dagitimlar){
    app.innerHTML = '<div class="msg">HENÜZ YAYINLANMIŞ BİR NÖBET ÇİZELGESİ YOK.</div>';
    return;
  }

  const kurum = veri.kurum || {};
  const donemler = (veri.dagitimlar[aktifGrup] || []);
  if(aktifDonemIdx >= donemler.length) aktifDonemIdx = donemler.length ? donemler.length - 1 : 0;

  const headerHtml = `
    <div class="header">
      ${kurum.logo ? `<img src="${kurum.logo}" alt="Logo">` : ''}
      <div>
        <div class="h-title">${esc(kurum.ad || 'NÖBET ÇİZELGESİ')}</div>
        <div class="h-sub">${esc(kurum.altBaslik || '')}</div>
      </div>
    </div>`;

  const guncellemeHtml = `<div class="updated">SON YAYIN: ${formatTarih(veri.yayinTarihi)} <button class="refresh" id="btnYenile">YENİLE</button></div>`;

  const tabsHtml = `
    <div class="tabs">
      <button data-grup="sabah" class="${aktifGrup==='sabah'?'active':''}">${GRUP_ETIKET.sabah}</button>
      <button data-grup="oglen" class="${aktifGrup==='oglen'?'active':''}">${GRUP_ETIKET.oglen}</button>
    </div>`;

  const yerler = veri.yerler || [];
  const ogretmenler = (veri.ogretmenler && veri.ogretmenler[aktifGrup]) || [];
  const filterBarHtml = `
    <div class="filter-bar">
      <div class="filter-item">
        <label>ÖĞRETMENE GÖRE FİLTRELE</label>
        <select id="filtreOgretmenSel">
          <option value="">TÜMÜ</option>
          ${ogretmenler.map(o=>`<option value="${o.id}" ${o.id===filtreOgretmen?'selected':''}>${esc(o.ad)}</option>`).join('')}
        </select>
      </div>
      <div class="filter-item">
        <label>NÖBET YERİNE GÖRE FİLTRELE</label>
        <select id="filtreYerSel">
          <option value="">TÜMÜ</option>
          ${yerler.map(y=>`<option value="${y.id}" ${y.id===filtreYer?'selected':''}>${esc(y.ad)}</option>`).join('')}
        </select>
      </div>
      <button class="filter-clear" id="btnFiltreTemizle">FİLTREYİ TEMİZLE</button>
    </div>`;

  let bodyHtml = '';
  if(!donemler.length){
    bodyHtml = '<div class="msg">BU GRUP İÇİN HENÜZ YAYINLANMIŞ BİR DÖNEM YOK.</div>';
  } else {
    const donemListHtml = `
      <div class="donem-list">
        ${donemler.map((b,i)=>`<button data-idx="${i}" class="${i===aktifDonemIdx?'active':''}">${esc((b.aylar||[]).map(a=>a.ayEtiket).join(', '))}</button>`).join('')}
      </div>`;
    const secili = donemler[aktifDonemIdx];
    const aylarHtml = (secili.aylar || []).map((ay, idx)=>renderAyTablosu(ay, aktifGrup, idx+1)).join('');
    bodyHtml = donemListHtml + aylarHtml;
  }

  app.innerHTML = headerHtml + guncellemeHtml + tabsHtml + filterBarHtml + bodyHtml;

  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
    aktifGrup = b.dataset.grup;
    aktifDonemIdx = 0;
    filtreYer = '';
    filtreOgretmen = '';
    render();
  });
  document.querySelectorAll('.donem-list button').forEach(b=>b.onclick=()=>{
    aktifDonemIdx = Number(b.dataset.idx);
    render();
  });
  const btnYenile = document.getElementById('btnYenile');
  if(btnYenile) btnYenile.onclick = yukle;

  const selOgretmen = document.getElementById('filtreOgretmenSel');
  if(selOgretmen) selOgretmen.onchange = ()=>{ filtreOgretmen = selOgretmen.value; render(); };
  const selYer = document.getElementById('filtreYerSel');
  if(selYer) selYer.onchange = ()=>{ filtreYer = selYer.value; render(); };
  const btnTemizle = document.getElementById('btnFiltreTemizle');
  if(btnTemizle) btnTemizle.onclick = ()=>{ filtreYer=''; filtreOgretmen=''; render(); };
}

function yukle(){
  document.getElementById('app').innerHTML = '<div class="msg">YÜKLENİYOR…</div>';
  fbDb.ref('nobetListesi').once('value')
    .then(snap=>{
      veri = snap.val();
      render();
    })
    .catch(err=>{
      document.getElementById('app').innerHTML = '<div class="msg">VERİ YÜKLENEMEDİ: ' + esc(err.message) + '</div>';
    });
}

yukle();
</script>
</body>
</html>
