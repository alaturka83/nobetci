// Kaydedilmiş dağıtımları yazdırılabilir çizelgeye ve Excel dosyasına
// dönüştüren dosya. xlsx-js-style kütüphanesi index.html içinde global
// olarak (window.XLSX) yüklenir.

function exportToExcel(){
  const grup = istatistikGrup;
  const teachers = state.ogretmenler[grup];
  const yerler = state.yerler;
  const batches = state.dagitimlar[grup];

  if(!batches || !batches.length || !teachers.length){
    return showAlert('AKTARILACAK İSTATİSTİK VERİSİ BULUNAMADI.');
  }

  const uniqueMonthsMap = {};
  batches.forEach(b => {
    (b.aylar || []).forEach(ay => {
      uniqueMonthsMap[ay.ay] = ay;
    });
  });
  const uniqueAylar = Object.values(uniqueMonthsMap);

  const stats = {};
  teachers.forEach(t=>{
    stats[t.id] = {
      ad: t.ad,
      total: 0,
      days: { PAZARTESİ:0, SALI:0, ÇARŞAMBA:0, PERŞEMBE:0, CUMA:0 },
      places: {}
    };
    yerler.forEach(y=>{ stats[t.id].places[y.id] = 0; });
  });

  uniqueAylar.forEach(ay => {
    Object.keys(ay.tablo || {}).forEach(yId => {
      GUNLER.forEach(g => {
        (ay.tablo[yId][g] || []).forEach(tId => {
          if (stats[tId]) {
            stats[tId].total++;
            stats[tId].days[g] = (stats[tId].days[g] || 0) + 1;
            stats[tId].places[yId] = (stats[tId].places[yId] || 0) + 1;
          }
        });
      });
    });
  });

  const kurumAdi = toUpperTr(state.kurum.ad) || 'NÖBET DAĞITIM PROGRAMI';
  const grupAdi = GRUP_ETIKET[grup] + ' (' + uniqueAylar.length + ' DÖNEM)';

  const headers = ['ÖĞRETMEN ADI SOYADI', 'TOPLAM NÖBET', 'PAZARTESİ', 'SALI', 'ÇARŞAMBA', 'PERŞEMBE', 'CUMA'];
  yerler.forEach(y => headers.push(toUpperTr(y.ad)));

  const dataRows = [
    [kurumAdi],
    [grupAdi],
    [],
    headers
  ];

  const sortedStats = Object.values(stats).sort((a,b)=>a.ad.localeCompare(b.ad,'tr'));

  sortedStats.forEach(st => {
    const row = [st.ad, st.total, st.days.PAZARTESİ, st.days.SALI, st.days.ÇARŞAMBA, st.days.PERŞEMBE, st.days.CUMA];
    yerler.forEach(y => row.push(st.places[y.id] || 0));
    dataRows.push(row);
  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(dataRows);

  const totalCols = headers.length;

  ws['!merges'] = [
    { s: { r: 0, c: 0 }, e: { r: 0, c: totalCols - 1 } },
    { s: { r: 1, c: 0 }, e: { r: 1, c: totalCols - 1 } }
  ];

  const colWidths = [{ wch: 30 }, { wch: 15 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }];
  yerler.forEach(() => colWidths.push({ wch: 15 }));
  ws['!cols'] = colWidths;

  const thinBorder = {
    top: { style: "thin", color: { rgb: "C4C9D0" } },
    bottom: { style: "thin", color: { rgb: "C4C9D0" } },
    left: { style: "thin", color: { rgb: "C4C9D0" } },
    right: { style: "thin", color: { rgb: "C4C9D0" } }
  };

  const headerBorder = {
    top: { style: "medium", color: { rgb: "132A4E" } },
    bottom: { style: "medium", color: { rgb: "132A4E" } },
    left: { style: "thin", color: { rgb: "1E3A64" } },
    right: { style: "thin", color: { rgb: "1E3A64" } }
  };

  const cellA1 = XLSX.utils.encode_cell({ r: 0, c: 0 });
  if (ws[cellA1]) {
    ws[cellA1].s = {
      font: { name: "Segoe UI", sz: 14, bold: true, color: { rgb: "FFFFFF" } },
      fill: { fgColor: { rgb: "132A4E" } },
      alignment: { horizontal: "center", vertical: "center" }
    };
  }

  const cellA2 = XLSX.utils.encode_cell({ r: 1, c: 0 });
  if (ws[cellA2]) {
    ws[cellA2].s = {
      font: { name: "Segoe UI", sz: 11, bold: true, color: { rgb: "D7DEEA" } },
      fill: { fgColor: { rgb: "1E3A64" } },
      alignment: { horizontal: "center", vertical: "center" }
    };
  }

  for (let c = 0; c < totalCols; c++) {
    const cellRef = XLSX.utils.encode_cell({ r: 3, c });
    if (ws[cellRef]) {
      ws[cellRef].s = {
        font: { name: "Segoe UI", sz: 11, bold: true, color: { rgb: "FFFFFF" } },
        fill: { fgColor: { rgb: "132A4E" } },
        alignment: { horizontal: c === 0 ? "left" : "center", vertical: "center" },
        border: headerBorder
      };
    }
  }

  for (let r = 4; r < dataRows.length; r++) {
    const isEven = (r - 4) % 2 === 0;
    const bgHex = isEven ? "FFFFFF" : "F4F6F9";

    for (let c = 0; c < totalCols; c++) {
      const cellRef = XLSX.utils.encode_cell({ r, c });
      if (!ws[cellRef]) continue;

      const isNameCol = c === 0;
      const isTotalCol = c === 1;

      ws[cellRef].s = {
        font: {
          name: "Segoe UI",
          sz: 10,
          bold: isNameCol || isTotalCol,
          color: { rgb: isTotalCol ? "132A4E" : "1D2430" }
        },
        fill: { fgColor: { rgb: isTotalCol ? "EAF0F8" : bgHex } },
        alignment: {
          horizontal: isNameCol ? "left" : "center",
          vertical: "center"
        },
        border: thinBorder
      };
    }
  }

  XLSX.utils.book_append_sheet(wb, ws, "Nöbet İstatistikleri");
  XLSX.writeFile(wb, "Nobet_Istatistikleri_" + grup + ".xlsx");
}


function renderYazdir(){
  const grup = yazdirGrup;
  const aylar = allMonthsFor(grup);

  const ayOptions = `<option value="TUMU" ${yazdirSecili.ay==='TUMU'?'selected':''}>TÜMÜ (TÜM DÖNEMLER)</option>` + 
    aylar.map(a=>`<option value="${a.ay}" ${yazdirSecili.ay===a.ay?'selected':''}>${a.ayEtiket}</option>`).join('');

  const yerOptions = `<option value="">TÜM YERLER</option>` + state.yerler.map(y=>`<option value="${y.id}" ${yazdirSecili.yer===y.id?'selected':''}>${esc(y.ad)}</option>`).join('');
  const ogrOptions = `<option value="">TÜM ÖĞRETMENLER</option>` + state.ogretmenler[grup].map(o=>`<option value="${o.id}" ${yazdirSecili.ogretmen===o.id?'selected':''}>${esc(o.ad)}</option>`).join('');

  if(!aylar.length){
    return `
    <div class="card">
      <h2>${icon('yazdir')}ÇİZELGE GÖRÜNTÜLE / YAZDIR</h2>
      <div class="subtabs">
        <button data-act="yazGrup" data-grup="sabah" class="${grup==='sabah'?'active':''}">SABAHÇI GRUBU (${state.ogretmenler.sabah.length} ÖĞRETMEN)</button>
        <button data-act="yazGrup" data-grup="oglen" class="${grup==='oglen'?'active':''}">ÖĞLENCİ GRUBU (${state.ogretmenler.oglen.length} ÖĞRETMEN)</button>
      </div>
      <p class="empty">BU GRUP İÇİN HENÜZ KAYDEDİLMİŞ BİR DAĞITIM YOK. ÖNCE "NÖBET DAĞITIMI" SEKMESİNDEN PROGRAMI OLUŞTURUP KAYDEDİN.</p>
    </div>`;
  }

  let secilenAylar = [];
  if(yazdirSecili.ay === 'TUMU'){
    secilenAylar = aylar;
  } else {
    const matched = aylar.find(a=>a.ay===yazdirSecili.ay) || aylar[0];
    secilenAylar = [matched];
  }

  const notSatirlari = (state.kurum.notlar||'').split('\n').filter(l=>l.trim()).map((l,i)=>`<p>${i+1}. ${esc(l)}</p>`).join('');

  const renderSinglePrintCard = (ayItem, isLast) => {
    const yerListesi = yazdirSecili.yer ? state.yerler.filter(y=>y.id===yazdirSecili.yer) : state.yerler;

    const rows = yerListesi.map(y=>{
      const cells = GUNLER.map(g=>{
        let ids = (ayItem.tablo[y.id] && ayItem.tablo[y.id][g]) || [];
        if(yazdirSecili.ogretmen) ids = ids.filter(id=>id===yazdirSecili.ogretmen);
        return `<td>${renderHucre(ids, grup)}</td>`;
      }).join('');
      return `<tr><td class="yer">${esc(y.ad)}</td>${cells}</tr>`;
    }).join('');

    const tarihGosterim = (ayItem.baslangicTarihi && ayItem.bitisTarihi) 
      ? (formatDateTR(ayItem.baslangicTarihi) + ' &ndash; ' + formatDateTR(ayItem.bitisTarihi))
      : ayItem.ayEtiket;

    const logoHtml = state.kurum.logo ? `<div class="schedule-header-logo-box"><img class="schedule-header-logo" src="${state.kurum.logo}" alt="Logo"></div>` : '<div class="schedule-header-placeholder"></div>';

    return `
    <div class="card ${!isLast ? 'page-break' : ''}">
      <div class="schedule-header-wrap">
        ${logoHtml}
        <div class="schedule-title">
          <h2>${esc(toUpperTr(state.kurum.ad))}</h2>
          <h2>${esc(toUpperTr(state.kurum.altBaslik))}</h2>
          <div class="period period-tarih">${tarihGosterim}</div>
          <div class="period" style="font-size:16px;margin-top:6px;">${GRUP_KISALTMA[grup]}</div>
        </div>
        <div class="schedule-header-placeholder"></div>
      </div>
      <div class="table-scroll">
      <table class="schedule">
        <tr><th style="width:15%;">NÖBET YERİ</th>${GUNLER.map(g=>`<th style="width:17%;">${g}</th>`).join('')}</tr>
        ${rows}
      </table>
      </div>
      <div class="notes">${notSatirlari}</div>
      <div class="sign-container">
        <div class="sign-box">
          <div class="date-line">.... / .... / ${esc(state.kurum.onayYili||'2026')}</div>
          <div class="name">${esc(toUpperTr(state.kurum.duzenleyen||''))}</div>
          <div class="title">MÜDÜR YARDIMCISI<br>DÜZENLEYEN</div>
        </div>
        <div class="sign-box">
          <div class="date-line">.... / .... / ${esc(state.kurum.onayYili||'2026')}</div>
          <div class="name">${esc(toUpperTr(state.kurum.onaylayan||''))}</div>
          <div class="title">OKUL MÜDÜRÜ<br>UYGUNDUR</div>
        </div>
      </div>
    </div>`;
  };

  const scheduleCardsHtml = secilenAylar.map((aItem, index) => 
    renderSinglePrintCard(aItem, index === secilenAylar.length - 1)
  ).join('');

  return `
  <div class="card no-print">
    <h2>${icon('yazdir')}ÇİZELGE FİLTRELE VE YAZDIR</h2>
    <div class="subtabs">
      <button data-act="yazGrup" data-grup="sabah" class="${grup==='sabah'?'active':''}">SABAHÇI GRUBU (${state.ogretmenler.sabah.length} ÖĞRETMEN)</button>
      <button data-act="yazGrup" data-grup="oglen" class="${grup==='oglen'?'active':''}">ÖĞLENCİ GRUBU (${state.ogretmenler.oglen.length} ÖĞRETMEN)</button>
    </div>
    <div class="row" style="align-items:flex-end;gap:12px;">
      <div class="field" style="min-width:180px;"><label>DÖNEM / AY SEÇİN</label><select id="filtAy">${ayOptions}</select></div>
      <div class="field" style="min-width:150px;"><label>NÖBET YERİ</label><select id="filtYer">${yerOptions}</select></div>
      <div class="field" style="min-width:180px;"><label>ÖĞRETMEN</label><select id="filtOgr">${ogrOptions}</select></div>
      <div class="field"><button class="btn gold" data-act="print" style="padding:9px 20px;">YAZDIR / PDF AL</button></div>
    </div>
  </div>

  <div id="printArea">
    ${scheduleCardsHtml}
  </div>
  `;
}

/* ==============================================================
 * app.js — Uygulama girişi: olay bağlama ve başlatma
 * ============================================================== */

// Programın "omurgası": tüm ekranlardaki butonlara/inputlara tıklama
// olaylarını bağlayan bindEvents() burada yaşar; sayfa yüklenince
// çalışacak başlangıç kodu en altta yer alır.
//
// Paylaşılan sabitler/durum için state.js, saf yardımcı fonksiyonlar
// için utils.js dosyasına bakın.
//
// YÜKLEME SIRASI ÖNEMLİ DEĞİL çünkü bu dosyadaki fonksiyonlar yalnızca
// kullanıcı bir şeye tıkladığında ÇALIŞTIRILIR (o ana kadar diğer tüm
// dosyalar zaten yüklenmiş olur). Yine de index.html içinde app.js EN
// SONDA yer alır — bu bir gelenek/okunabilirlik tercihidir.

function bindEvents(){
  const main = document.getElementById('main');
  function q(sel){ return main.querySelector(sel); }
  function qa(sel){ return Array.from(main.querySelectorAll(sel)); }

  qa('[data-act=ayarlarSubTab]').forEach(b=>b.onclick=()=>{ ayarlarSubTab=b.dataset.sub; render(); });

  const fileInputLive = document.getElementById('kurumLogoFile');
  if(fileInputLive) fileInputLive.onchange = ()=>{
    const f = fileInputLive.files && fileInputLive.files[0];
    if(!f) return;
    if(f.size > 15*1024*1024){
      return showAlert('BU RESİM DOSYASI ÇOK BÜYÜK (15MB ÜZERİ). LÜTFEN DAHA KÜÇÜK BİR RESİM SEÇİN.');
    }
    compressImageToDataURL(f, 300, 0.85, (dataUrl)=>{
      if(!dataUrl) return showAlert('LOGO OKUNAMADI. LÜTFEN BAŞKA BİR RESİM DOSYASI DENEYİN.');
      const box = document.getElementById('kurumLogoPreviewBox');
      if(box) box.innerHTML = '<img id="kurumLogoPreviewImg" src="' + dataUrl + '" alt="Logo önizleme">';
    });
  };

  const bSaveKurum = q('[data-act=saveKurum]');
  if(bSaveKurum) bSaveKurum.onclick = ()=>{
    state.kurum.ad = val('kurumAd');
    state.kurum.altBaslik = val('kurumAltB');
    state.kurum.duzenleyen = val('kurumDuzenleyen');
    state.kurum.onaylayan = val('kurumOnaylayan');
    state.kurum.onayYili = val('kurumOnayYili');
    state.kurum.notlar = valRaw('kurumNotlar');

    const fileInput = document.getElementById('kurumLogoFile');
    if(fileInput && fileInput.files && fileInput.files[0]){
      compressImageToDataURL(fileInput.files[0], 300, 0.85, (dataUrl)=>{
        if(!dataUrl){
          saveState(); render();
          showAlert('LOGO OKUNAMADI, DİĞER BİLGİLER YİNE DE KAYDEDİLDİ. LÜTFEN LOGOYU TEKRAR YÜKLEMEYİ DENEYİN.');
          return;
        }
        state.kurum.logo = dataUrl;
        saveState(); render();
        showAlert('KURUM BİLGİLERİ VE LOGO KAYDEDİLDİ.');
      });
    } else {
      saveState(); render();
      showAlert('KURUM BİLGİLERİ KAYDEDİLDİ.');
    }
  };

  const bAddYer = q('[data-act=addYer]');
  if(bAddYer) bAddYer.onclick = ()=>{
    const ad = val('yeniYerAd');
    const kap = parseInt(valRaw('yeniYerKapasite'))||1;
    if(!ad) return showAlert('LÜTFEN YER ADI GİRİN.');
    state.yerler.push({id:uid(), ad, kapasite:kap, izinliOgretmenler:{sabah:[], oglen:[]}});
    saveState(); render();
  };

  qa('[data-act=delYer]').forEach(b=>b.onclick=()=>{
    showConfirm('BU NÖBET YERİNİ SİLMEK İSTEDİĞİNİZE EMİN MİSİNİZ?', () => {
      state.yerler = state.yerler.filter(y=>y.id!==b.dataset.id);
      if(kisitlananYerId === b.dataset.id) kisitlananYerId = null;
      ['sabah','oglen'].forEach(g=>{
        state.ayarlar.ekYer[g] = (state.ayarlar.ekYer[g]||[]).filter(id=>id!==b.dataset.id);
      });
      saveState(); render();
    });
  });

  qa('[data-act=editYerKisit]').forEach(b=>b.onclick=()=>{
    kisitlananYerId = b.dataset.id;
    kisitGrupSekme = 'sabah';
    render();
  });

  qa('[data-act=kisitGrupSekme]').forEach(b=>b.onclick=()=>{
    kisitGrupSekme = b.dataset.grup;
    render();
  });

  const yerKisitSeciliRadio = q('#yerKisitSecili');
  const yerKisitHerkeseRadio = q('#yerKisitHerkese');
  if(yerKisitSeciliRadio && yerKisitHerkeseRadio){
    const toggleChecks = () => {
      qa('.yerKisitOgrChk').forEach(c => { c.disabled = !yerKisitSeciliRadio.checked; });
    };
    yerKisitSeciliRadio.onchange = toggleChecks;
    yerKisitHerkeseRadio.onchange = toggleChecks;
  }

  const bCloseYerKisit = q('[data-act=closeYerKisit]');
  if(bCloseYerKisit) bCloseYerKisit.onclick = ()=>{
    kisitlananYerId = null;
    render();
  };

  const bSaveYerKisit = q('[data-act=saveYerKisit]');
  if(bSaveYerKisit) bSaveYerKisit.onclick = ()=>{
    const yer = state.yerler.find(y=>y.id===bSaveYerKisit.dataset.id);
    if(!yer) return;
    if(!yer.izinliOgretmenler) yer.izinliOgretmenler = {sabah:[], oglen:[]};

    const herkeseAcik = q('#yerKisitHerkese') ? q('#yerKisitHerkese').checked : true;
    if(herkeseAcik){
      yer.izinliOgretmenler[kisitGrupSekme] = [];
    } else {
      const secilenler = qa('.yerKisitOgrChk').filter(c=>c.checked).map(c=>c.value);
      if(!secilenler.length){
        return showAlert('EN AZ BİR ÖĞRETMEN SEÇMELİSİNİZ, YA DA "HERKESE AÇIK" SEÇENEĞİNİ İŞARETLEYİN.');
      }
      yer.izinliOgretmenler[kisitGrupSekme] = secilenler;
    }
    saveState(); render();
    showAlert('"' + yer.ad + '" İÇİN ' + GRUP_ETIKET[kisitGrupSekme] + ' ERİŞİM AYARI KAYDEDİLDİ.');
  };

  qa('[data-act=ogrGrup]').forEach(b=>b.onclick=()=>{ dagitimGrupAyarlar=b.dataset.grup; render(); });

  const bAddOgr = q('[data-act=addOgretmenler]');
  if(bAddOgr) bAddOgr.onclick = ()=>{
    const grup = bAddOgr.dataset.grup;
    const text = valRaw('ogretmenPaste');
    const isimler = text.split('\n').map(s=>toUpperTr(s).trim()).filter(Boolean);
    const mevcut = new Set(state.ogretmenler[grup].map(o=>o.ad));
    isimler.forEach(ad=>{
      if(!mevcut.has(ad)){
        state.ogretmenler[grup].push({id:uid(), ad});
        mevcut.add(ad);
      }
    });
    saveState(); render();
  };

  const bClearOgr = q('[data-act=clearOgretmenler]');
  if(bClearOgr) bClearOgr.onclick = ()=>{
    const grup = bClearOgr.dataset.grup;
    showConfirm(GRUP_ETIKET[grup] + ' İÇİNDEKİ TÜM ÖĞRETMENLER VE İSTİSNALAR SİLİNECEK. EMİN MİSİNİZ?', () => {
      state.ogretmenler[grup] = [];
      state.istisnalar = state.istisnalar.filter(i=>i.grup!==grup);
      state.yerler.forEach(y=>{
        if(y.izinliOgretmenler) y.izinliOgretmenler[grup] = [];
      });
      saveState(); render();
    });
  };

  qa('[data-act=delOgretmen]').forEach(b=>b.onclick=()=>{
    const grup = b.dataset.grup;
    state.ogretmenler[grup] = state.ogretmenler[grup].filter(o=>o.id!==b.dataset.id);
    state.istisnalar = state.istisnalar.filter(i=>!(i.grup===grup && i.ogretmenId===b.dataset.id));
    state.yerler.forEach(y=>{
      if(y.izinliOgretmenler && y.izinliOgretmenler[grup]){
        y.izinliOgretmenler[grup] = y.izinliOgretmenler[grup].filter(id=>id!==b.dataset.id);
      }
    });
    saveState(); render();
  });

  qa('.ekYerChk').forEach(cb=>cb.onchange=()=>{
    const grup = cb.dataset.grup;
    const boxes = qa('.ekYerChk[data-grup='+grup+']');
    let n = 0;
    boxes.forEach(c=>{
      const badge = c.parentElement.querySelector('.ekyer-num');
      if(!badge) return;
      if(c.checked){
        n++;
        badge.textContent = n;
        badge.style.display = '';
      } else {
        badge.style.display = 'none';
      }
    });
  });

  const kacAyInput = q('#kacAy');
  if(kacAyInput) kacAyInput.onchange = ()=>{
    const startInputs = qa('.ayTarihStart');
    const endInputs = qa('.ayTarihEnd');
    const tarihler = state.ayarlar.tarihAraliklari || [];
    
    startInputs.forEach((inp, idx) => {
      if(!tarihler[idx]) tarihler[idx] = {};
      if(inp.value) tarihler[idx].baslangic = inp.value;
    });
    endInputs.forEach((inp, idx) => {
      if(!tarihler[idx]) tarihler[idx] = {};
      if(inp.value) tarihler[idx].bitis = inp.value;
    });
    
    const count = Math.min(24, Math.max(1, parseInt(kacAyInput.value)||6));
    kacAyInput.value = count;
    state.ayarlar.kacAy = count;
    
    for(let i = tarihler.length; i < count; i++){
      const defaultRange = getDefaultMonthDateRange(new Date().getFullYear(), new Date().getMonth() + i);
      tarihler.push(defaultRange);
    }
    state.ayarlar.tarihAraliklari = tarihler;
    render();
  };

  const bSaveAyarlar = q('[data-act=saveAyarlar]');
  if(bSaveAyarlar) bSaveAyarlar.onclick = ()=>{
    const count = Math.min(24, Math.max(1, parseInt(valRaw('kacAy'))||6));
    const tarihler = [];
    const startInputs = qa('.ayTarihStart');
    const endInputs = qa('.ayTarihEnd');

    for(let i=0; i<count; i++){
      const sVal = startInputs[i] ? startInputs[i].value : '';
      const eVal = endInputs[i] ? endInputs[i].value : '';

      if(!sVal || !eVal){
        return showAlert((i+1) + '. DÖNEM İÇİN LÜTFEN BAŞLANGIÇ VE BİTİŞ TARİHLERİNİ GİRİN.');
      }
      if(sVal > eVal){
        return showAlert((i+1) + '. DÖNEM BİTİŞ TARİHİ, BAŞLANGIÇ TARİHİNDEN ÖNCE OLAMAZ.');
      }
      if(i > 0 && tarihler[i-1]){
        if(sVal <= tarihler[i-1].bitis){
          return showAlert((i+1) + '. DÖNEM BAŞLANGIÇ TARİHİ, BİR ÖNCEKİ DÖNEMİN BİTİŞ TARİHİNDEN (' + formatDateTR(tarihler[i-1].bitis) + ') SONRA OLMALIDIR.');
        }
      }
      tarihler.push({ baslangic: sVal, bitis: eVal });
    }

    state.ayarlar.kacAy = count;
    state.ayarlar.tarihAraliklari = tarihler;
    state.ayarlar.ekYer.sabah = qa('.ekYerChk[data-grup=sabah]').filter(c=>c.checked).map(c=>c.value);
    state.ayarlar.ekYer.oglen = qa('.ekYerChk[data-grup=oglen]').filter(c=>c.checked).map(c=>c.value);
    saveState();
    render();
    showAlert('DAĞITIM AYARLARI KAYDEDİLDİ.');
  };

  qa('[data-act=istGrup]').forEach(b=>b.onclick=()=>{ istisnaGrup=b.dataset.grup; istisnaArama=''; istisnaTipFiltre='tumu'; istisnaDuzenlenenId=null; render(); });
  const selTip = q('#istTip');
  if(selTip) selTip.onchange = ()=>{
    const wrap = q('#istYerWrap');
    const gunWrap = q('#istGunWrap');
    const partnerWrap = q('#istPartnerWrap');
    const izinWrap = q('#istIzinWrap');
    const isBirlikte = selTip.value==='birlikte';
    const isIzinde = selTip.value==='izinde';
    wrap.style.display = (selTip.value==='muaf' || isBirlikte || isIzinde) ? 'none' : '';
    gunWrap.style.display = (selTip.value==='muaf' || isBirlikte || isIzinde) ? 'none' : '';
    if(partnerWrap) partnerWrap.style.display = isBirlikte ? '' : 'none';
    if(izinWrap) izinWrap.style.display = isIzinde ? '' : 'none';
  };
  const selGunTipi = q('#istGunTipi');
  if(selGunTipi) selGunTipi.onchange = ()=>{
    q('#istGunListesi').style.display = selGunTipi.value==='hepsi' ? 'none' : '';
  };

  // Seçilen öğretmenin bu grupta zaten bir istisnası varsa, EKLE'ye
  // basmanın onu sessizce değiştireceğini önceden söyler.
  const selIstOgretmen = q('#istOgretmen');
  if(selIstOgretmen) selIstOgretmen.onchange = ()=>{
    const uyari = q('#istUyariMevcut');
    if(uyari){
      const varMi = state.istisnalar.some(i=>i.grup===istisnaGrup && i.ogretmenId===selIstOgretmen.value);
      uyari.style.display = (selIstOgretmen.value && varMi) ? 'block' : 'none';
    }
    // Seçilen öğretmen, "birlikte nöbet tutacakları" listesinde kendisiyle
    // eşleştirilemesin diye o listeden gizlenir.
    qa('.istPartnerLabel').forEach(lbl=>{
      const kendisi = lbl.dataset.id === selIstOgretmen.value;
      lbl.style.display = kendisi ? 'none' : '';
      if(kendisi){
        const chk = lbl.querySelector('.istPartnerChk');
        if(chk) chk.checked = false;
      }
    });
  };

  const bAddIst = q('[data-act=addIstisna]');
  if(bAddIst) bAddIst.onclick = ()=>{
    const ogretmenId = valRaw('istOgretmen');
    const tip = valRaw('istTip');
    if(!ogretmenId) return showAlert('LÜTFEN ÖĞRETMEN SEÇİN.');

    let partnerIds = [];
    if(tip==='birlikte'){
      partnerIds = qa('.istPartnerChk').filter(c=>c.checked).map(c=>c.value).filter(id=>id!==ogretmenId);
      if(!partnerIds.length) return showAlert('LÜTFEN BİRLİKTE NÖBET TUTACAK EN AZ BİR ÖĞRETMEN SEÇİN.');
    }

    let izinBaslangic = '', izinBitis = '';
    if(tip==='izinde'){
      izinBaslangic = valRaw('istIzinBaslangic');
      izinBitis = valRaw('istIzinBitis');
      if(!izinBaslangic || !izinBitis) return showAlert('LÜTFEN İZİN/RAPOR BAŞLANGIÇ VE BİTİŞ TARİHLERİNİ SEÇİN.');
      if(izinBaslangic > izinBitis) return showAlert('İZİN BAŞLANGIÇ TARİHİ, BİTİŞ TARİHİNDEN SONRA OLAMAZ.');
    }

    const yerIdler = qa('.istYerChk').filter(c=>c.checked).map(c=>c.value);
    if(tip==='sabit'){
      if(yerIdler.length !== 1) return showAlert('SABİT YER İSTİSNASI İÇİN TAM OLARAK BİR YER SEÇMELİSİNİZ (NE EKSİK NE FAZLA).');
    } else if(tip !== 'muaf' && tip !== 'birlikte' && tip !== 'izinde' && !yerIdler.length && valRaw('istGunTipi') === 'hepsi'){
      return showAlert('LÜTFEN EN AZ BİR YER VEYA GÜN KISITLAMASI SEÇİN.');
    }

    const gunTipi = (tip==='muaf' || tip==='birlikte' || tip==='izinde') ? 'hepsi' : valRaw('istGunTipi');
    const gunler = (tip==='muaf' || tip==='birlikte' || tip==='izinde') ? [] : qa('.istGunChk').filter(c=>c.checked).map(c=>c.value);
    if((gunTipi==='sadece'||gunTipi==='haric') && !gunler.length) return showAlert('LÜTFEN EN AZ BİR GÜN SEÇİN.');

    // BİR ÖĞRETMENE BİRDEN FAZLA İSTİSNA EKLENEBİLİR. Tür bazlı kurallar:
    // - "MUAF" tektir ve diğer TÜM istisnaların yerine geçer (tam muafiyet,
    //   başka hiçbir kural onunla birlikte anlamlı değildir).
    // - "SABİT", "İZİNLİ LİSTE", "YASAKLI LİSTE", "EŞLEŞTİRİLMİŞ" türlerinin
    //   her biri kendi türünde en fazla bir kez olabilir; yeni eklenen,
    //   aynı türden eskisinin yerine geçer.
    // - "İZİNLİ/RAPORLU" (izinde) birden fazla kez eklenebilir — bir
    //   öğretmenin farklı aylarda ayrı rapor/izin dönemleri olabilir.
    //
    // DÜZENLEME MODU: mevcut bir kayıt düzenleniyorsa, önce SADECE o kayıt
    // (id'sine göre) kaldırılır — böylece "izinde" gibi çoklu-kayıt destekli
    // türlerde düzenleme, yeni bir kopya eklemek yerine kaydı günceller.
    if(istisnaDuzenlenenId){
      state.istisnalar = state.istisnalar.filter(i=>i.id!==istisnaDuzenlenenId);
    }

    if(tip === 'izinde'){
      const cakisan = state.istisnalar.find(i=>i.grup===istisnaGrup && i.ogretmenId===ogretmenId && i.tip==='izinde' &&
        tarihAraliklariCakisiyorMu(i.izinBaslangic, i.izinBitis, izinBaslangic, izinBitis));
      if(cakisan) return showAlert('BU ÖĞRETMENİN ZATEN BU TARİH ARALIĞIYLA ÇAKIŞAN BİR İZİN/RAPOR KAYDI VAR (' + formatDateTR(cakisan.izinBaslangic) + ' – ' + formatDateTR(cakisan.izinBitis) + '). ÖNCE ONU SİLİN VEYA FARKLI TARİH SEÇİN.');
      // Muaf varsa (artık geçersiz kılınıyor) kaldır, aynı türden (izinde) olanlara dokunma.
      state.istisnalar = state.istisnalar.filter(i=>!(i.grup===istisnaGrup && i.ogretmenId===ogretmenId && i.tip==='muaf'));
    } else {
      // Muaf ya da aynı türden eski kaydı kaldır, farklı türden diğer istisnalara dokunma.
      state.istisnalar = state.istisnalar.filter(i=>!(i.grup===istisnaGrup && i.ogretmenId===ogretmenId && (i.tip==='muaf' || i.tip===tip)));
    }
    if(tip === 'muaf'){
      state.istisnalar = state.istisnalar.filter(i=>!(i.grup===istisnaGrup && i.ogretmenId===ogretmenId));
    }
    state.istisnalar.push({id:uid(), grup:istisnaGrup, ogretmenId, tip, yerIdler: (tip==='muaf'||tip==='birlikte'||tip==='izinde')?[]:yerIdler, gunTipi, gunler, partnerIds: tip==='birlikte' ? partnerIds : [], izinBaslangic, izinBitis});
    istisnaDuzenlenenId = null;
    saveState(); render();
  };

  bindIstisnaRowEvents();

  const istAramaKutusu = q('#istisnaAramaKutusu');
  if(istAramaKutusu) istAramaKutusu.oninput = ()=>{ istisnaArama = istAramaKutusu.value; refreshIstisnaTablo(); };

  qa('#istisnaChipbar [data-act=istTipFiltre]').forEach(b=>b.onclick=()=>{
    istisnaTipFiltre = b.dataset.tip;
    qa('#istisnaChipbar [data-act=istTipFiltre]').forEach(x=>x.classList.toggle('active', x===b));
    refreshIstisnaTablo();
  });

  qa('[data-act=dagGrup]').forEach(b=>b.onclick=()=>{ if(cekilis) return; dagitimGrup=b.dataset.grup; render(); });
  const bGen = q('[data-act=generate]');
  if(bGen) bGen.onclick = ()=>{
    if(cekilis) return;
    if(state.ogretmenler[dagitimGrup].length===0) return showAlert('BU GRUPTA ÖNCE ÖĞRETMEN EKLEMELİSİNİZ.');
    if(state.yerler.length===0) return showAlert('ÖNCE NÖBET YERLERİNİ TANIMLAMALISINIZ.');

    const res = generateDagitimEnIyi(dagitimGrup, state.ayarlar.kacAy);
    startCekilis(dagitimGrup, res);
  };

  const bSaveDag = q('[data-act=saveDagitim]');
  if(bSaveDag) bSaveDag.onclick = ()=>{
    const grup = bSaveDag.dataset.grup;
    state.dagitimlar[grup].push({olusturma: new Date().toISOString(), aylar: lastGenResults[grup].aylar});
    saveState();
    render();
    bSaveDag.disabled = true;
    publishSchedule().then(()=>{
      showAlert('DAĞITIM KAYDEDİLDİ VE ÖĞRETMENLERİN GÖRDÜĞÜ SAYFAYA YAYINLANDI.');
    }).catch((err)=>{
      showAlert('DAĞITIM YEREL OLARAK KAYDEDİLDİ, ANCAK ÇEVRİMİÇİ YAYINLAMA BAŞARISIZ OLDU (İNTERNET BAĞLANTINIZI KONTROL EDİN): ' + err.message);
    }).finally(()=>{
      const btn = document.querySelector('[data-act=saveDagitim]');
      if(btn) btn.disabled = false;
    });
  };

  const bResetDag = q('[data-act=resetDagitimGrup]');
  if(bResetDag) bResetDag.onclick = ()=>{
    if(cekilis) return;
    const grup = bResetDag.dataset.grup;
    showConfirm(GRUP_ETIKET[grup] + ' İÇİN KAYDEDİLMİŞ TÜM DAĞITIM GEÇMİŞİ SİLİNECEK. EMİN MİSİNİZ?', () => {
      state.dagitimlar[grup] = [];
      lastGenResults[grup] = null;
      saveState();
      render();
      publishSchedule().catch(()=>{});
    });
  };

  qa('[data-act=delDonem]').forEach(b=>b.onclick=()=>{
    if(cekilis) return;
    const grup = b.dataset.grup;
    const idx = Number(b.dataset.idx);
    const batch = state.dagitimlar[grup] && state.dagitimlar[grup][idx];
    if(!batch) return;
    const etiket = batch.aylar.map(a=>a.ayEtiket).join(', ');
    showConfirm('"' + etiket + '" DÖNEMİ SİLİNECEK. BU İŞLEM GERİ ALINAMAZ. EMİN MİSİNİZ?', () => {
      state.dagitimlar[grup].splice(idx, 1);
      saveState();
      render();
      publishSchedule().catch(()=>{});
    });
  });

  qa('[data-act=hucreDuzenle]').forEach(td=>{
    td.onclick = ()=>{
      const grup = td.dataset.grup;
      const batchIdx = Number(td.dataset.batch);
      const ayIdx = Number(td.dataset.ay);
      const yerId = td.dataset.yer;
      const gun = td.dataset.gun;
      openHucreEditor(grup, batchIdx, ayIdx, yerId, gun);
    };
  });

  const bSaveSifre = q('[data-act=saveYoneticiSifre]');
  if(bSaveSifre) bSaveSifre.onclick = async ()=>{
    const yeni = valRaw('yoneticiSifreInput').trim();
    if(!yeni) return showAlert('ŞİFRE BOŞ OLAMAZ.');
    console.log('[NÖBET-DEBUG] Şifre kaydet tıklandı. Yazılan yeni şifre:', yeni);
    state.ayarlar.yoneticiSifre = yeni;
    console.log('[NÖBET-DEBUG] state.ayarlar.yoneticiSifre şu an bellekte:', state.ayarlar.yoneticiSifre);
    bSaveSifre.disabled = true;
    bSaveSifre.textContent = 'KAYDEDİLİYOR…';
    // Burada bilerek saveState()'in ÇEVRİMİÇİ yazmayı bitirmesini
    // BEKLİYORUZ: aksi halde "güncellendi" mesajı, veri Firebase'e
    // ulaşmadan (hatta hiç ulaşmadan) gösterilmiş olabilir — tam da
    // yaşadığınız "değişiklik görünmüyor" sorununun kaynağı buydu.
    const basarili = await saveState();
    console.log('[NÖBET-DEBUG] saveState bitti. başarılı mı:', basarili, '— bellekteki şifre şimdi:', state.ayarlar.yoneticiSifre);
    render();
    if(basarili){
      showAlert('YÖNETİCİ ŞİFRESİ GÜNCELLENDİ VE ÇEVRİMİÇİ KAYDEDİLDİ.\n\nArtık hangi cihazdan girerseniz girin bu YENİ şifre geçerli.');
    }
    // Başarısızsa saveState() zaten kendi kırmızı uyarı penceresini gösterdi.
  };

  qa('[data-act=istatistikGrup]').forEach(b=>b.onclick=()=>{ istatistikGrup=b.dataset.grup; render(); });
  qa('[data-act=exportExcel]').forEach(b=>b.onclick=()=>exportToExcel());

  qa('[data-act=yazGrup]').forEach(b=>b.onclick=()=>{ yazdirGrup=b.dataset.grup; yazdirSecili={ay:'TUMU',yer:'',ogretmen:''}; render(); });
  const fAy = q('#filtAy'); if(fAy) fAy.onchange=()=>{ yazdirSecili.ay=fAy.value; render(); };
  const fYer = q('#filtYer'); if(fYer) fYer.onchange=()=>{ yazdirSecili.yer=fYer.value; render(); };
  const fOgr = q('#filtOgr'); if(fOgr) fOgr.onchange=()=>{ yazdirSecili.ogretmen=fOgr.value; render(); };
  const bPrint = q('[data-act=print]'); if(bPrint) bPrint.onclick = ()=>window.print();

  const bExportBackup = q('[data-act=exportBackup]');
  if(bExportBackup) bExportBackup.onclick = ()=>exportBackupJSON(state);

  const bResetAll = q('[data-act=resetAllExceptKurum]');
  if(bResetAll) bResetAll.onclick = ()=>{
    showConfirm('KURUM BİLGİLERİ HARİÇ TÜM VERİLER (NÖBET YERLERİ, ÖĞRETMENLER, DAĞITIM AYARLARI, İSTİSNALAR VE KAYITLI DAĞITIM GEÇMİŞİ) SİLİNECEK. BU İŞLEM GERİ ALINAMAZ. DEVAM ETMEDEN ÖNCE YEDEK ALDIĞINIZDAN EMİN OLUN. EMİN MİSİNİZ?', () => {
      showConfirm('SON ONAY: SIFIRLAMA İŞLEMİ HEMEN UYGULANACAK VE GERİ ALINAMAYACAK. YİNE DE DEVAM ETMEK İSTİYOR MUSUNUZ?', async () => {
        await resetAllExceptKurum();
        render();
        publishSchedule().catch(()=>{});
        showAlert('SİSTEM KURUM BİLGİLERİ HARİÇ SIFIRLANDI. ARTIK NÖBET YERLERİNİ VE ÖĞRETMENLERİ SIFIRDAN TANIMLAYABİLİRSİNİZ.');
      });
    });
  };

  const fileImport = q('#importBackupFile');
  if(fileImport) fileImport.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    importBackupJSON(file,
      async (parsed)=>{
        state = parsed;
        const basarili = await saveState();
        render();
        if(basarili){
          showAlert('YEDEK DOSYASI BAŞARIYLA YÜKLENDİ VE ÇEVRİMİÇİ KAYDEDİLDİ.');
        }
        // Başarısızsa saveState() zaten kendi kırmızı uyarı penceresini gösterdi.
      },
      (errMsg)=> showAlert(errMsg)
    );
  };
}


/* ==============================================================
 * teacher-mode.js — Öğretmen (görüntüleme) modu: eski goruntule.html'in
 * TAMAMI, isim çakışması olmasın diye initTeacherApp() fonksiyonunun
 * içine kapatıldı. Yönetici moduyla AYNI Firebase projesini (yukarıda
 * zaten başlatılan fbDb) kullanır.
 * ============================================================== */
function initTeacherApp(){

const GUNLER = ['PAZARTESİ','SALI','ÇARŞAMBA','PERŞEMBE','CUMA'];
const GRUP_ETIKET = {sabah:'SABAHÇI GRUBU', oglen:'ÖĞLENCİ GRUBU'};
const GRUP_KISALTMA = {sabah:'SABAH', oglen:'ÖĞLE'};

let veri = null;
let aktifGrup = 'sabah';
let aktifAyIdx = 0;
let filtreYer = '';
let filtreOgretmen = '';
let gorunum = 'program'; // 'program' | 'istatistik' | 'yazdir'
let istatistikArama = '';

// "YAZDIR" görünümü için ayrı filtre durumu (ay/yer/öğretmen bazlı yazdırma)
let yazdirAy = 'TUMU';
let yazdirYer = '';
let yazdirOgretmen = '';

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','&':'&amp;'}[c])); }

function toUpperTr(str){
  if(!str) return '';
  return String(str).replace(/i/g,'İ').replace(/ı/g,'I').toUpperCase();
}

function formatTarih(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.toLocaleString('tr-TR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
}

function formatDateTR(dateStr){
  if(!dateStr) return '';
  const p = dateStr.split('-');
  if(p.length !== 3) return dateStr;
  return p[2] + '.' + p[1] + '.' + p[0];
}

// Yönetim panelinde bir hücre manuel olarak düzeltildiğinde (örn. raporlu
// bir öğretmenin yerine geçici biri yazıldığında), o kişi öğretmen
// listesinde olmayabilir; kimliği "MANUAL::İSİM" biçiminde gelir.
const MANUEL_ON_EK = 'MANUAL::';
function manuelMi(id){ return typeof id === 'string' && id.indexOf(MANUEL_ON_EK) === 0; }

function ogretmenAd(grup, id){
  if(manuelMi(id)) return esc(id.slice(MANUEL_ON_EK.length));
  const list = (veri.ogretmenler && veri.ogretmenler[grup]) || [];
  const o = list.find(x=>x.id===id);
  return o ? esc(o.ad) : '';
}

function renderHucre(ids, grup){
  const names = (ids||[]).map(id=>({id, ad:ogretmenAd(grup, id)})).filter(x=>x.ad);
  if(!names.length) return '<span class="empty">&mdash;</span>';
  return names.map(n=>{
    const eslesti = filtreOgretmen && n.id === filtreOgretmen;
    return `<div class="${eslesti ? 'cell-match' : (filtreOgretmen ? 'cell-dim' : '')}">${n.ad}</div>`;
  }).join('');
}

// Bugünün tarihine en yakın / içinde bulunulan ayı bulur; yoksa son ayı döner.
function varsayilanAyIdx(aylar){
  if(!aylar || !aylar.length) return 0;
  const bugun = new Date(); bugun.setHours(0,0,0,0);
  for(let i=0;i<aylar.length;i++){
    const bit = aylar[i].bitisTarihi ? new Date(aylar[i].bitisTarihi) : null;
    if(bit && bit >= bugun) return i;
  }
  return aylar.length - 1;
}

function renderAyIcerik(ay, grup){
  const yerler = veri.yerler || [];

  const rows = yerler.map(y=>{
    const gizli = filtreYer && y.id !== filtreYer;
    const cells = GUNLER.map(g=>{
      const ids = ay.tablo && ay.tablo[y.id] ? ay.tablo[y.id][g] : [];
      return `<td>${renderHucre(ids, grup)}</td>`;
    }).join('');
    return `<tr style="${gizli ? 'display:none;' : ''}"><td class="yer">${esc(y.ad)}</td>${cells}</tr>`;
  }).join('');

  const yerBloklari = yerler.map(y=>{
    const gizli = filtreYer && y.id !== filtreYer;
    const icerirMi = filtreOgretmen && GUNLER.some(g=>{
      const ids = (ay.tablo && ay.tablo[y.id] ? ay.tablo[y.id][g] : []) || [];
      return ids.includes(filtreOgretmen);
    });
    const acik = !!filtreYer || icerirMi;
    const gunSatirlari = GUNLER.map(g=>{
      const ids = ay.tablo && ay.tablo[y.id] ? ay.tablo[y.id][g] : [];
      return `<div class="day-row"><div class="day-label">${g}</div><div class="day-names">${renderHucre(ids, grup)}</div></div>`;
    }).join('');
    return `<div class="yer-block ${gizli ? 'yer-hidden' : ''} ${acik ? 'expanded' : ''}">
      <div class="yer-block-title" data-toggle="1">${esc(y.ad)}<span class="chevron">▾</span></div>
      ${gunSatirlari}
    </div>`;
  }).join('');

  const tarihAraligi = (ay.baslangicTarihi && ay.bitisTarihi)
    ? (formatDateTR(ay.baslangicTarihi) + ' – ' + formatDateTR(ay.bitisTarihi))
    : '';

  return `
    <div class="donem-baslik">${esc((ay.ayEtiket || '').replace(/\s*\d{4}$/, ''))} PROGRAMI${tarihAraligi ? ' (' + tarihAraligi + ')' : ''}</div>
    <div class="mobile-cards">${yerBloklari}</div>
    <div class="desktop-table">
    <table class="data">
      <tr><th>NÖBET YERİ</th>${GUNLER.map(g=>`<th>${g}</th>`).join('')}</tr>
      ${rows}
    </table>
    </div>`;
}

// Tüm yayınlanmış dönemlerdeki (ay tekrar etmeyecek şekilde) nöbet
// sayılarını öğretmen bazında toplar — gün ve yer kırılımıyla birlikte.
function hesaplaIstatistik(grup){
  const teachers = (veri.ogretmenler && veri.ogretmenler[grup]) || [];
  const yerler = veri.yerler || [];
  const donemler = (veri.dagitimlar && veri.dagitimlar[grup]) || [];

  const uniqueAylarMap = {};
  donemler.forEach(b=>{
    (b.aylar || []).forEach(ay=>{ uniqueAylarMap[ay.ay] = ay; });
  });
  const uniqueAylar = Object.values(uniqueAylarMap);

  const stats = {};
  teachers.forEach(t=>{
    stats[t.id] = { id:t.id, ad:t.ad, total:0, days:{PAZARTESİ:0,SALI:0,ÇARŞAMBA:0,PERŞEMBE:0,CUMA:0}, places:{} };
    yerler.forEach(y=>{ stats[t.id].places[y.id] = 0; });
  });

  uniqueAylar.forEach(ay=>{
    Object.keys(ay.tablo || {}).forEach(yId=>{
      GUNLER.forEach(g=>{
        (ay.tablo[yId][g] || []).forEach(tId=>{
          if(stats[tId]){
            stats[tId].total++;
            stats[tId].days[g] = (stats[tId].days[g] || 0) + 1;
            stats[tId].places[yId] = (stats[tId].places[yId] || 0) + 1;
          }
        });
      });
    });
  });

  return { list: Object.values(stats), donemSayisi: uniqueAylar.length };
}

function renderIstatistikIcerik(grup){
  const { list, donemSayisi } = hesaplaIstatistik(grup);
  const yerler = veri.yerler || [];

  if(!donemSayisi || !list.length){
    return '<div class="msg">BU GRUP İÇİN HENÜZ İSTATİSTİK OLUŞTURACAK YAYINLANMIŞ DÖNEM YOK.</div>';
  }

  const totals = list.map(s=>s.total).filter(n=>n>0);
  const maxTotal = totals.length ? Math.max(...totals) : 0;
  const avgTotal = totals.length ? (totals.reduce((a,b)=>a+b,0) / totals.length) : 0;

  const sorted = list.slice().sort((a,b)=>a.ad.localeCompare(b.ad,'tr'));

  const rowsMobile = sorted.map(s=>{
    let cls = '';
    if(avgTotal>0 && s.total>0){
      if(s.total >= avgTotal*1.25) cls = 'stat-high';
      else if(s.total <= avgTotal*0.75) cls = 'stat-low';
    }
    const barPct = maxTotal>0 ? Math.round((s.total/maxTotal)*100) : 0;
    const eslesti = filtreOgretmen && s.id === filtreOgretmen;
    const dayPills = GUNLER.map(g=>`<span class="stat-pill">${g.slice(0,3)}: ${s.days[g]||0}</span>`).join('');
    const placePills = yerler.map(y=>`<span class="stat-pill">${esc(y.ad)}: ${s.places[y.id]||0}</span>`).join('');
    return `<div class="stat-row ${eslesti?'expanded':''}" data-ad="${esc(s.ad.toLocaleLowerCase('tr'))}">
      <div class="stat-row-head">
        <div style="flex:1;">
          <div class="stat-ad">${esc(s.ad)}</div>
          <div class="stat-bar-track"><div class="stat-bar-fill ${cls}" style="width:${barPct}%"></div></div>
        </div>
        <div class="stat-num ${cls}">${s.total}</div>
      </div>
      <div class="stat-row-body">
        <div class="stat-pill-group">
          <div class="stat-pill-group-title">GÜN DAĞILIMI</div>
          ${dayPills}
        </div>
        <div class="stat-pill-group">
          <div class="stat-pill-group-title">YER DAĞILIMI</div>
          ${placePills}
        </div>
      </div>
    </div>`;
  }).join('');

  const rowsDesktop = sorted.map(s=>{
    let cls = '';
    if(avgTotal>0 && s.total>0){
      if(s.total >= avgTotal*1.25) cls = 'stat-high';
      else if(s.total <= avgTotal*0.75) cls = 'stat-low';
    }
    const barPct = maxTotal>0 ? Math.round((s.total/maxTotal)*100) : 0;
    const dayPills = GUNLER.map(g=>`<span class="stat-pill">${g.slice(0,3)}: ${s.days[g]||0}</span>`).join('');
    const placePills = yerler.map(y=>`<span class="stat-pill">${esc(y.ad)}: ${s.places[y.id]||0}</span>`).join('');
    return `<tr data-ad="${esc(s.ad.toLocaleLowerCase('tr'))}">
      <td style="text-align:left;font-weight:700;">${esc(s.ad)}</td>
      <td class="stat-num-cell ${cls}">
        ${s.total}
        <div class="stat-bar-track"><div class="stat-bar-fill ${cls}" style="width:${barPct}%"></div></div>
      </td>
      <td>${dayPills}</td>
      <td>${placePills}</td>
    </tr>`;
  }).join('');

  return `
    <div class="donem-baslik">NÖBET DAĞITIM İSTATİSTİKLERİ</div>
    <input type="text" id="statAramaInput" class="stat-search" placeholder="ÖĞRETMEN ARA…" value="${esc(istatistikArama)}">
    <div class="stat-legend mobile-cards">İSİMLERİN ÜZERİNE DOKUNARAK GÜN VE YER DAĞILIMINI GÖREBİLİRSİNİZ.</div>
    <div class="stat-legend desktop-table">${donemSayisi} DÖNEM ÜZERİNDEN TOPLAM NÖBET SAYILARI.</div>
    <div id="statSonucYok" class="msg" style="display:none;padding:16px;">EŞLEŞEN ÖĞRETMEN BULUNAMADI.</div>
    <div class="mobile-cards">${rowsMobile}</div>
    <div class="desktop-table">
    <table class="data">
      <tr><th>ÖĞRETMEN ADI</th><th>TOPLAM NÖBET</th><th>GÜN DAĞILIMI</th><th>YER DAĞILIMI</th></tr>
      ${rowsDesktop}
    </table>
    </div>`;
}

// Bir grubun TÜM yayınlanmış dönemlerindeki ayları (tekrarsız) toplar —
// "yıl bazlı" yazdırmada kullanılır; yöneticideki allMonthsFor() ile aynı mantık.
function allMonthsForYazdir(grup){
  const map = {};
  ((veri.dagitimlar && veri.dagitimlar[grup]) || []).forEach(batch=>{
    (batch.aylar || []).forEach(ay=>{ map[ay.ay] = ay; });
  });
  return Object.values(map).sort((a,b)=>a.ay.localeCompare(b.ay));
}

// Yöneticideki "ÇİZELGE FİLTRELE VE YAZDIR" ekranıyla birebir aynı kart/tablo
// düzenini üretir; öğretmenler ay bazlı, yıl bazlı (TÜMÜ) veya yalnızca kendi
// nöbetlerini (ÖĞRETMEN filtresiyle) yazdırabilir.
function renderYazdirIcerik(grup){
  const kurum = veri.kurum || {};
  const yerler = veri.yerler || [];
  const ogretmenler = (veri.ogretmenler && veri.ogretmenler[grup]) || [];
  const aylar = allMonthsForYazdir(grup);

  if(!aylar.length){
    return '<div class="msg">BU GRUP İÇİN HENÜZ YAYINLANMIŞ BİR PROGRAM YOK.</div>';
  }

  if(yazdirAy !== 'TUMU' && !aylar.some(a=>a.ay===yazdirAy)) yazdirAy = 'TUMU';
  if(yazdirYer && !yerler.some(y=>y.id===yazdirYer)) yazdirYer = '';
  if(yazdirOgretmen && !ogretmenler.some(o=>o.id===yazdirOgretmen)) yazdirOgretmen = '';

  const ayOptions = `<option value="TUMU" ${yazdirAy==='TUMU'?'selected':''}>TÜMÜ (TÜM YIL)</option>` +
    aylar.map(a=>`<option value="${a.ay}" ${yazdirAy===a.ay?'selected':''}>${esc(a.ayEtiket)}</option>`).join('');
  const yerOptions = `<option value="">TÜM YERLER</option>` +
    yerler.map(y=>`<option value="${y.id}" ${yazdirYer===y.id?'selected':''}>${esc(y.ad)}</option>`).join('');
  const ogrOptions = `<option value="">TÜM ÖĞRETMENLER</option>` +
    ogretmenler.map(o=>`<option value="${o.id}" ${yazdirOgretmen===o.id?'selected':''}>${esc(o.ad)}</option>`).join('');

  const secilenAylar = yazdirAy === 'TUMU' ? aylar : [aylar.find(a=>a.ay===yazdirAy) || aylar[0]];

  const notSatirlari = (kurum.notlar||'').split('\n').filter(l=>l.trim()).map((l,i)=>`<p>${i+1}. ${esc(l)}</p>`).join('');

  const renderSinglePrintCard = (ayItem, isLast) => {
    const yerListesi = yazdirYer ? yerler.filter(y=>y.id===yazdirYer) : yerler;
    const rows = yerListesi.map(y=>{
      const cells = GUNLER.map(g=>{
        let ids = (ayItem.tablo && ayItem.tablo[y.id] && ayItem.tablo[y.id][g]) || [];
        if(yazdirOgretmen) ids = ids.filter(id=>id===yazdirOgretmen);
        return `<td>${renderHucre(ids, grup)}</td>`;
      }).join('');
      return `<tr><td class="yer">${esc(y.ad)}</td>${cells}</tr>`;
    }).join('');

    const tarihGosterim = (ayItem.baslangicTarihi && ayItem.bitisTarihi)
      ? (formatDateTR(ayItem.baslangicTarihi) + ' &ndash; ' + formatDateTR(ayItem.bitisTarihi))
      : ayItem.ayEtiket;

    const logoHtml = kurum.logo ? `<div class="schedule-header-logo-box"><img class="schedule-header-logo" src="${kurum.logo}" alt="Logo"></div>` : '<div class="schedule-header-placeholder"></div>';

    return `
    <div class="yazdir-page-outer">
    <div class="card yazdir-page ${!isLast ? 'page-break' : ''}">
      <div class="schedule-header-wrap">
        ${logoHtml}
        <div class="schedule-title">
          <h2>${esc(toUpperTr(kurum.ad))}</h2>
          <h2>${esc(toUpperTr(kurum.altBaslik))}</h2>
          <div class="period period-tarih">${tarihGosterim}</div>
          <div class="period" style="font-size:12px;margin-top:6px;">${GRUP_KISALTMA[grup]}</div>
        </div>
        <div class="schedule-header-placeholder"></div>
      </div>
      <div class="table-scroll">
      <table class="schedule">
        <tr><th style="width:15%;">NÖBET YERİ</th>${GUNLER.map(g=>`<th style="width:17%;">${g}</th>`).join('')}</tr>
        ${rows}
      </table>
      </div>
      <div class="notes">${notSatirlari}</div>
    </div>
    </div>`;
  };

  const scheduleCardsHtml = secilenAylar.map((aItem, index) => renderSinglePrintCard(aItem, index === secilenAylar.length - 1)).join('');

  return `
  <div class="panel no-print">
    <div class="field">
      <label>DÖNEM / AY SEÇİN</label>
      <select id="yazdirAySel" class="ay-select">${ayOptions}</select>
    </div>
    <div class="field filter-row">
      <div class="field">
        <label>ÖĞRETMEN (SADECE KENDİ NÖBETİNİZİ YAZDIRMAK İÇİN SEÇİN)</label>
        <select id="yazdirOgrSel">${ogrOptions}</select>
      </div>
      <div class="field">
        <label>NÖBET YERİ</label>
        <select id="yazdirYerSel">${yerOptions}</select>
      </div>
    </div>
    <button class="btn-print" id="btnYazdirBas">🖨️ YAZDIR / PDF AL</button>
    <button class="btn-jpg" id="btnJpgIndir">📷 JPG OLARAK İNDİR</button>
  </div>
  <div class="yazdir-preview-wrap" id="tmPrintArea">
    <div class="yazdir-preview-hint no-print">ÖNİZLEME — ÇIKTI YATAY (A4 LANDSCAPE) SAYFA OLARAK ALINACAKTIR</div>
    ${scheduleCardsHtml}
  </div>`;
}

// Yazdırma önizleme sayfalarını (sabit 1000px genişlikteki .yazdir-page) ekran
// genişliğine göre ölçekleyip küçültür — kaydırma/gizlenme olmadan tüm sütunlar görünür.
function scaleYazdirPages(){
  document.querySelectorAll('.yazdir-page-outer').forEach(outer=>{
    const page = outer.querySelector('.yazdir-page');
    if(!page) return;
    page.style.transform = 'none';
    const wrapWidth = outer.clientWidth;
    const pageWidth = page.offsetWidth || 1000;
    const pageHeight = page.offsetHeight;
    const scale = wrapWidth > 0 ? Math.min(1, wrapWidth / pageWidth) : 1;
    page.style.transform = 'scale(' + scale + ')';
    outer.style.height = Math.round(pageHeight * scale) + 'px';
  });
}
let yazdirRescaleTimer = null;
window.addEventListener('resize', ()=>{
  if(gorunum !== 'yazdir') return;
  clearTimeout(yazdirRescaleTimer);
  yazdirRescaleTimer = setTimeout(scaleYazdirPages, 150);
});

// Önizlemedeki her çizelge sayfasını (ay filtresine göre 1 veya daha
// fazla olabilir) ekrandaki küçültülmüş haliyle DEĞİL, gerçek/tam
// boyutuyla yakalayıp yüksek çözünürlüklü bir JPG olarak indirir —
// telefonda galeriye kaydedip WhatsApp'tan paylaşmak PDF'ten daha kolay.
async function indirJPG(){
  const btn = document.getElementById('btnJpgIndir');
  if(!btn || btn.disabled) return;
  const eskiMetin = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'HAZIRLANIYOR…';

  const sayfalar = Array.from(document.querySelectorAll('.yazdir-page'));
  try{
    for(let i=0; i<sayfalar.length; i++){
      const page = sayfalar[i];
      const outer = page.parentElement;
      const eskiTransform = page.style.transform;
      const eskiOuterHeight = outer.style.height;
      const eskiOuterOverflow = outer.style.overflow;

      // Önizleme için uygulanan küçültme ölçeğini geçici olarak kaldır —
      // aksi halde görsel, ekrandaki kadar küçük ve bulanık çıkar.
      page.style.transform = 'none';
      outer.style.overflow = 'visible';
      outer.style.height = 'auto';

      try{
        const canvas = await html2canvas(page, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
        const etiketKaynak = page.querySelector('.period-tarih');
        const etiket = (etiketKaynak ? etiketKaynak.textContent : ('sayfa-' + (i + 1)))
          .trim().replace(/\s+/g, '_').replace(/[^\w.-]+/g, '');
        const link = document.createElement('a');
        link.download = 'Nobet_Cizelgesi_' + etiket + (sayfalar.length > 1 ? ('_' + (i + 1)) : '') + '.jpg';
        link.href = canvas.toDataURL('image/jpeg', 0.92);
        document.body.appendChild(link);
        link.click();
        link.remove();
      } finally {
        page.style.transform = eskiTransform;
        outer.style.overflow = eskiOuterOverflow;
        outer.style.height = eskiOuterHeight;
      }
    }
  } catch(e){
    alert('GÖRSEL OLUŞTURULURKEN BİR SORUN OLUŞTU: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = eskiMetin;
  }
}

// Bu fonksiyon artık tek seferlik değil, CANLI bir Firebase dinleyicisi
// kurar: yönetim panelinde bir dağıtım kaydedildiğinde/yayınlandığında ya
// da tek bir hücre manuel düzeltildiğinde, bu ekran öğretmen hiçbir şeye
// dokunmadan ANINDA güncellenir. İlk yüklemede (sayfa ilk açıldığında)
// bugüne en yakın ayı otomatik seçeriz; sonraki canlı güncellemelerde ise
// kullanıcının o an baktığı sekme/ay/filtre seçimini BOZMADAN sadece veri
// tazelenip ekran yeniden çizilir.
let ilkYuklemeTamam = false;

function yukle(){
  if(!ilkYuklemeTamam){
    document.getElementById('app').innerHTML = '<div class="msg">YÜKLENİYOR…</div>';
  }
  fbDb.ref('nobetListesi').off('value');
  fbDb.ref('nobetListesi').on('value', snap=>{
    veri = snap.val();
    if(!ilkYuklemeTamam){
      const donemler = veri && veri.dagitimlar ? (veri.dagitimlar[aktifGrup] || []) : [];
      const sonDonem = donemler.length ? donemler[donemler.length - 1] : null;
      aktifAyIdx = sonDonem ? varsayilanAyIdx(sonDonem.aylar || []) : 0;
      ilkYuklemeTamam = true;
      asistanIlkYuklemeyiIsaretle();
    }
    render();
  }, err=>{
    document.getElementById('app').innerHTML = '<div class="msg">VERİ YÜKLENEMEDİ: ' + esc(err.message) + '</div>';
  });
}

/* ==============================================================
 * asistan.js — Kural tabanlı "sanal asistan": öğretmenlerin sıkça
 * sorduğu soruları (bugün/yarın kim nöbetçi, filanca öğretmen ne
 * zaman nöbetçi, en çok kim nöbet tuttu, filtre nasıl çalışır vb.)
 * doğrudan yayınlanmış veriden (veri objesi) yanıtlar. Sunucu/LLM
 * çağrısı yapmaz — tamamen istemci tarafında çalışır.
 * ============================================================== */

let asistanAcikMi = false;
let asistanOtoAcildi = false;
const asistanGunSira = ['PAZAR','PAZARTESİ','SALI','ÇARŞAMBA','PERŞEMBE','CUMA','CUMARTESİ'];

function asistanIlkYuklemeyiIsaretle(){
  if(asistanOtoAcildi) return;
  asistanOtoAcildi = true;
  // Mobilde (dar ekran) sayfa açılır açılmaz asistanı otomatik açmıyoruz —
  // sadece sağ alttaki "Şakir'e Sor" baloncuğu duruyor, dokununca açılır.
  if(window.innerWidth < 640) return;
  setTimeout(()=>{ asistanAc(true); }, 400);
}

function asistanNormalize(s){
  return (s||'').toLocaleUpperCase('tr').replace(/İ/g,'İ').trim();
}

function asistanBugun(ofsetGun){
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + (ofsetGun||0));
  return d;
}

function asistanGunAdi(tarih){
  return asistanGunSira[tarih.getDay()];
}

// Verilen tarihin, bir grubun SON kaydedilen döneminde hangi aya denk
// geldiğini bulur (ay.baslangicTarihi/bitisTarihi aralığına göre).
function asistanTarihinAyi(grup, tarih){
  const donemler = (veri.dagitimlar && veri.dagitimlar[grup]) || [];
  const sonDonem = donemler.length ? donemler[donemler.length-1] : null;
  if(!sonDonem) return null;
  const iso = tarih.toISOString().slice(0,10);
  return (sonDonem.aylar||[]).find(ay=>ay.baslangicTarihi && ay.bitisTarihi && iso>=ay.baslangicTarihi && iso<=ay.bitisTarihi) || null;
}

function asistanAktifAy(grup){
  const donemler = (veri.dagitimlar && veri.dagitimlar[grup]) || [];
  const sonDonem = donemler.length ? donemler[donemler.length-1] : null;
  if(!sonDonem || !sonDonem.aylar || !sonDonem.aylar.length) return null;
  return sonDonem.aylar[varsayilanAyIdx(sonDonem.aylar)];
}

const ASISTAN_AY_ADLARI = ['OCAK','ŞUBAT','MART','NİSAN','MAYIS','HAZİRAN','TEMMUZ','AĞUSTOS','EYLÜL','EKİM','KASIM','ARALIK'];

// Soruda bir ay adı (ör. "KASIM") geçiyorsa, o grubun SON kaydedilen
// döneminde adı o ayla başlayan ayı bulur (ör. "KASIM 2026 PROGRAMI").
// Ay adı geçmiyorsa null döner (çağıran taraf o zaman "aktif ay"ı kullanır).
function asistanAySorudanBul(grup, soru){
  const bulunanAdlar = ASISTAN_AY_ADLARI.filter(ad=>soru.includes(ad));
  if(!bulunanAdlar.length) return null;
  const ayAdi = bulunanAdlar.sort((a,b)=>b.length-a.length)[0];
  const donemler = (veri.dagitimlar && veri.dagitimlar[grup]) || [];
  const sonDonem = donemler.length ? donemler[donemler.length-1] : null;
  if(!sonDonem) return null;
  return (sonDonem.aylar||[]).find(ay=>asistanNormalize(ay.ayEtiket||'').startsWith(ayAdi)) || 'YOK';
}

// Bir soru için hangi ayın kullanılacağını belirler: önce soruda geçen
// ay adına bakar, yoksa "aktif/güncel ay"a düşer. Soruda ay adı geçip de
// o dönemde öyle bir ay bulunamazsa 'YOK' işaretini yukarı taşır.
function asistanIlgiliAy(grup, soru){
  const soruAyi = asistanAySorudanBul(grup, soru);
  if(soruAyi === 'YOK') return null;
  if(soruAyi) return soruAyi;
  return asistanAktifAy(grup);
}

// Soruda bir gün adı (PAZARTESİ, SALI, ...) geçiyorsa onu döner.
function asistanGunSorudanBul(soru){
  return GUNLER.find(g=>soru.includes(g)) || null;
}

function asistanGrupBelirle(soru){
  if(soru.includes('ÖĞLEN') || soru.includes('ÖĞLE')) return 'oglen';
  if(soru.includes('SABAH')) return 'sabah';
  return null;
}

function asistanYerBul(soru){
  const yerler = veri.yerler || [];
  return yerler.find(y=>soru.includes(asistanNormalize(y.ad)));
}

// Sorudaki metinde geçen bir öğretmen adını (her iki grupta da) arar.
// Tam ad geçiyorsa onu, yoksa soyadı/parça eşleşen ilk kişiyi döner.
function asistanOgretmenBul(soru){
  const adaylar = [];
  ['sabah','oglen'].forEach(grup=>{
    ((veri.ogretmenler && veri.ogretmenler[grup]) || []).forEach(o=>{
      const ad = asistanNormalize(o.ad);
      if(soru.includes(ad)) adaylar.push({grup, id:o.id, ad:o.ad, uzunluk:ad.length});
    });
  });
  if(!adaylar.length) return null;
  adaylar.sort((a,b)=>b.uzunluk-a.uzunluk);
  return adaylar[0];
}

function asistanOgretmenProgramCevap(kisi, soru){
  soru = soru || '';
  const yerFiltre = asistanYerBul(soru);
  const gunFiltre = asistanGunSorudanBul(soru);

  function ayBulunanlari(ay){
    const sonuc = [];
    (veri.yerler||[]).forEach(y=>{
      if(yerFiltre && y.id !== yerFiltre.id) return;
      (gunFiltre ? [gunFiltre] : GUNLER).forEach(g=>{
        const ids = (ay.tablo && ay.tablo[y.id] && ay.tablo[y.id][g]) || [];
        if(ids.includes(kisi.id)) sonuc.push(g + ' — ' + y.ad);
      });
    });
    return sonuc;
  }

  // "BÜTÜN / TÜM / HANGİ AY(LAR)DA" gibi ifadeler geçiyorsa, tek bir aya
  // değil, yayınlanmış SON DÖNEMİN tüm aylarına bakılır. Bir yer ve/veya
  // gün de belirtilmişse (ör. "1. Kat'ta hangi aylarda"), sadece o
  // yer/gün için filtrelenmiş sonuç gösterilir.
  const tumDonemIstendi = (soru.includes('BÜTÜN') || soru.includes('TÜM') || soru.includes('HANGİ AY')) && !asistanAySorudanBul(kisi.grup, soru);
  if(tumDonemIstendi){
    const donemler = (veri.dagitimlar && veri.dagitimlar[kisi.grup]) || [];
    const sonDonem = donemler.length ? donemler[donemler.length-1] : null;
    if(!sonDonem || !sonDonem.aylar || !sonDonem.aylar.length){
      return kisi.ad + ' için yayınlanmış bir program bulamadım.';
    }
    const satirlar = [];
    sonDonem.aylar.forEach(ay=>{
      const ayAdi = (ay.ayEtiket||'').replace(/\s*\d{4}$/, '');
      const buAy = ayBulunanlari(ay);
      if(buAy.length) satirlar.push(ayAdi + ':\n' + buAy.map(b=>'  • ' + b).join('\n'));
    });
    const yerNotu = yerFiltre ? (' (' + yerFiltre.ad + ')') : '';
    if(!satirlar.length){
      return kisi.ad + yerNotu + ', yayınlanmış hiçbir dönemde' + (yerFiltre ? ' bu yerde' : '') + ' nöbet listesinde görünmüyor.';
    }
    return kisi.ad + ' (' + GRUP_ETIKET[kisi.grup] + ')' + yerNotu + ' — TÜM DÖNEM NÖBETLERİ:\n\n' + satirlar.join('\n\n');
  }

  const ay = asistanIlgiliAy(kisi.grup, soru);
  if(ay === null && asistanAySorudanBul(kisi.grup, soru) === 'YOK'){
    return 'Sorduğunuz aya ait yayınlanmış bir dönem bulamadım.';
  }
  if(!ay) return kisi.ad + ' için yayınlanmış bir program bulamadım.';
  const bulunanlar = ayBulunanlari(ay);
  const ayAdi = (ay.ayEtiket||'').replace(/\s*\d{4}$/, '');
  if(!bulunanlar.length){
    const yerNotu = yerFiltre ? (' ' + yerFiltre.ad + ' için') : '';
    return kisi.ad + ',' + yerNotu + ' ' + ayAdi + (gunFiltre ? ' ' + gunFiltre : '') + ' için nöbet listesinde görünmüyor (izinli/muaf olabilir, ya da o ay o yerde/günde görevli değil).';
  }
  return kisi.ad + ' (' + GRUP_ETIKET[kisi.grup] + ') — ' + ayAdi + ' PROGRAMI:\n' + bulunanlar.map(b=>'• ' + b).join('\n');
}

function asistanGunSorgusuCevap(soru, ofset){
  const grup = asistanGrupBelirle(soru) || aktifGrup;
  const tarih = asistanBugun(ofset);
  const gun = asistanGunAdi(tarih);
  const etiket = ofset < 0 ? 'DÜN' : (ofset > 0 ? 'YARIN' : 'BUGÜN');
  if(gun === 'CUMARTESİ' || gun === 'PAZAR'){
    return etiket.charAt(0) + etiket.slice(1).toLocaleLowerCase('tr') + ' hafta sonu, nöbet yazılmıyor.';
  }
  const ay = asistanTarihinAyi(grup, tarih);
  if(!ay){
    return etiket.charAt(0) + etiket.slice(1).toLocaleLowerCase('tr') + ' için yayınlanmış bir program bulamadım (dönem dışında olabilir).';
  }
  const yer = asistanYerBul(soru);
  const yerler = yer ? [yer] : (veri.yerler||[]);
  const satirlar = yerler.map(y=>{
    const ids = (ay.tablo && ay.tablo[y.id] && ay.tablo[y.id][gun]) || [];
    const adlar = ids.map(id=>ogretmenAd(grup, id)).filter(Boolean);
    return '• ' + y.ad + ': ' + (adlar.length ? adlar.join(', ') : '—');
  });
  return etiket + ' (' + gun + ', ' + GRUP_ETIKET[grup] + '):\n' + satirlar.join('\n');
}

function asistanYerProgramCevap(yer, soru){
  const grup = asistanGrupBelirle(soru) || aktifGrup;
  const ay = asistanIlgiliAy(grup, soru);
  if(ay === null && asistanAySorudanBul(grup, soru) === 'YOK'){
    return 'Sorduğunuz aya ait yayınlanmış bir dönem bulamadım.';
  }
  if(!ay) return yer.ad + ' için yayınlanmış bir program bulamadım.';
  const ayAdi = (ay.ayEtiket||'').replace(/\s*\d{4}$/, '');
  const gunFiltre = asistanGunSorudanBul(soru);
  const satirlar = (gunFiltre ? [gunFiltre] : GUNLER).map(g=>{
    const ids = (ay.tablo && ay.tablo[yer.id] && ay.tablo[yer.id][g]) || [];
    const adlar = ids.map(id=>ogretmenAd(grup, id)).filter(Boolean);
    return '• ' + g + ': ' + (adlar.length ? adlar.join(', ') : '—');
  });
  return yer.ad + ' (' + GRUP_ETIKET[grup] + ') — ' + ayAdi + ':\n' + satirlar.join('\n');
}

// "Bu hafta kim nöbetçi?" — belirli bir yer verilmemişse TÜM yerlerin,
// o haftaki (=ilgili ayın haftalık deseni) programını listeler.
function asistanHaftaCevap(soru){
  const grup = asistanGrupBelirle(soru) || aktifGrup;
  const ay = asistanIlgiliAy(grup, soru);
  if(ay === null && asistanAySorudanBul(grup, soru) === 'YOK'){
    return 'Sorduğunuz aya ait yayınlanmış bir dönem bulamadım.';
  }
  if(!ay) return 'Bu hafta için yayınlanmış bir program bulamadım.';
  const ayAdi = (ay.ayEtiket||'').replace(/\s*\d{4}$/, '');
  const yer = asistanYerBul(soru);
  const yerler = yer ? [yer] : (veri.yerler||[]);
  const satirlar = yerler.map(y=>{
    const gunler = GUNLER.map(g=>{
      const ids = (ay.tablo && ay.tablo[y.id] && ay.tablo[y.id][g]) || [];
      const adlar = ids.map(id=>ogretmenAd(grup, id)).filter(Boolean);
      return g.slice(0,3) + ': ' + (adlar.length ? adlar.join(', ') : '—');
    }).join(' | ');
    return '• ' + y.ad + '\n   ' + gunler;
  });
  return 'BU HAFTA (' + ayAdi + ' PROGRAMI, ' + GRUP_ETIKET[grup] + '):\n' + satirlar.join('\n');
}

// "15 Ekim'de kim nöbetçi?" gibi belirli bir takvim tarihini soran
// sorularda, sorudaki gün numarası + ay adını bulup gerçek tarihe çevirir.
function asistanBelirliTarihCevap(soru){
  const m = soru.match(new RegExp('(\\d{1,2})\\.?\\s*(' + ASISTAN_AY_ADLARI.join('|') + ')')) ||
            soru.match(new RegExp('(' + ASISTAN_AY_ADLARI.join('|') + ')\\s*(\\d{1,2})'));
  if(!m) return null;
  const gunNo = parseInt(m[1].match(/^\d+$/) ? m[1] : m[2], 10);
  const ayAdi = m[1].match(/^\d+$/) ? m[2] : m[1];
  if(!gunNo || gunNo < 1 || gunNo > 31) return null;

  const grup = asistanGrupBelirle(soru) || aktifGrup;
  const donemler = (veri.dagitimlar && veri.dagitimlar[grup]) || [];
  const sonDonem = donemler.length ? donemler[donemler.length-1] : null;
  if(!sonDonem) return 'Yayınlanmış bir program bulamadım.';
  const ay = (sonDonem.aylar||[]).find(a=>asistanNormalize(a.ayEtiket||'').startsWith(ayAdi));
  if(!ay) return 'Sorduğunuz aya ait yayınlanmış bir dönem bulamadım.';

  const yil = (ay.baslangicTarihi||'').slice(0,4);
  const ayNo = (ay.baslangicTarihi||'').slice(5,7);
  const iso = yil + '-' + ayNo + '-' + String(gunNo).padStart(2,'0');
  const tarih = new Date(iso + 'T00:00:00');
  if(isNaN(tarih)) return null;
  if(iso < ay.baslangicTarihi || iso > ay.bitisTarihi){
    return formatDateTR(iso) + ' tarihi, ' + (ay.ayEtiket||'').replace(/\s*\d{4}$/, '') + ' döneminin dışında kalıyor.';
  }
  const gun = asistanGunAdi(tarih);
  if(gun === 'CUMARTESİ' || gun === 'PAZAR'){
    return formatDateTR(iso) + ' (' + gun + ') hafta sonu, nöbet yazılmıyor.';
  }
  const yer = asistanYerBul(soru);
  const yerler = yer ? [yer] : (veri.yerler||[]);
  const satirlar = yerler.map(y=>{
    const ids = (ay.tablo && ay.tablo[y.id] && ay.tablo[y.id][gun]) || [];
    const adlar = ids.map(id=>ogretmenAd(grup, id)).filter(Boolean);
    return '• ' + y.ad + ': ' + (adlar.length ? adlar.join(', ') : '—');
  });
  return formatDateTR(iso) + ' (' + gun + ', ' + GRUP_ETIKET[grup] + '):\n' + satirlar.join('\n');
}

function asistanIstatistikCevap(soru){
  const grup = asistanGrupBelirle(soru) || aktifGrup;
  const {list, donemSayisi} = hesaplaIstatistik(grup);
  if(!donemSayisi || !list.length) return 'Bu grup için henüz istatistik oluşturacak yayınlanmış dönem yok.';
  const sirali = list.slice().sort((a,b)=> soru.includes('AZ') ? a.total-b.total : b.total-a.total);
  const ilk3 = sirali.slice(0,3).filter(s=>s.total>0 || sirali.length<=3);
  const baslik = soru.includes('AZ') ? 'EN AZ NÖBET TUTANLAR' : 'EN ÇOK NÖBET TUTANLAR';
  return baslik + ' (' + GRUP_ETIKET[grup] + ', ' + donemSayisi + ' dönem):\n' + ilk3.map((s,i)=>(i+1)+'. '+s.ad+' — '+s.total+' nöbet').join('\n');
}

// "Ayşe kaç kez nöbet tuttu?" — tek bir kişinin toplam sayısı + kırılımı.
function asistanKacKezCevap(kisi){
  const {list, donemSayisi} = hesaplaIstatistik(kisi.grup);
  if(!donemSayisi) return kisi.ad + ' için henüz istatistik oluşturacak yayınlanmış dönem yok.';
  const s = list.find(x=>x.id===kisi.id);
  if(!s || !s.total) return kisi.ad + ', yayınlanmış ' + donemSayisi + ' dönem boyunca hiç nöbet listesinde görünmüyor.';
  const gunler = GUNLER.map(g=>g.slice(0,3)+': '+(s.days[g]||0)).join(', ');
  const yerler = (veri.yerler||[]).map(y=>y.ad+': '+(s.places[y.id]||0)).filter(x=>!x.endsWith(': 0')).join(', ');
  return kisi.ad + ', yayınlanmış ' + donemSayisi + ' dönem boyunca toplam ' + s.total + ' kez nöbet tutmuş.\nGün dağılımı: ' + gunler + (yerler ? '\nYer dağılımı: ' + yerler : '');
}

// "Hangi gün en çok/az nöbet var?" — ilgili ayın haftalık deseninde,
// günlere göre toplam nöbetçi sayısını karşılaştırır.
function asistanGunBazliYukCevap(soru){
  const grup = asistanGrupBelirle(soru) || aktifGrup;
  const ay = asistanIlgiliAy(grup, soru);
  if(!ay) return 'Bu grup için yayınlanmış bir program bulamadım.';
  const sayaclar = GUNLER.map(g=>{
    let toplam = 0;
    (veri.yerler||[]).forEach(y=>{ toplam += ((ay.tablo && ay.tablo[y.id] && ay.tablo[y.id][g]) || []).length; });
    return {gun:g, toplam};
  });
  sayaclar.sort((a,b)=> soru.includes('AZ') ? a.toplam-b.toplam : b.toplam-a.toplam);
  const ayAdi = (ay.ayEtiket||'').replace(/\s*\d{4}$/, '');
  const baslik = soru.includes('AZ') ? 'EN AZ NÖBETÇİ OLAN GÜN' : 'EN ÇOK NÖBETÇİ OLAN GÜN';
  return baslik + ' (' + ayAdi + ', ' + GRUP_ETIKET[grup] + '):\n' + sayaclar.map(s=>'• ' + s.gun + ': ' + s.toplam + ' nöbetçi').join('\n');
}

// "Hangi yerde en çok/az nöbet yazılmış?" — TÜM yayınlanmış dönem boyunca
// (hesaplaIstatistik'in "places" toplamları üzerinden) yer bazlı toplam.
function asistanYerBazliYukCevap(soru){
  const grup = asistanGrupBelirle(soru) || aktifGrup;
  const {list, donemSayisi} = hesaplaIstatistik(grup);
  if(!donemSayisi) return 'Bu grup için henüz istatistik oluşturacak yayınlanmış dönem yok.';
  const toplamlar = (veri.yerler||[]).map(y=>{
    let toplam = 0;
    list.forEach(s=>{ toplam += (s.places[y.id]||0); });
    return {ad:y.ad, toplam};
  });
  toplamlar.sort((a,b)=> soru.includes('AZ') ? a.toplam-b.toplam : b.toplam-a.toplam);
  const baslik = soru.includes('AZ') ? 'EN AZ NÖBET YAZILAN YER' : 'EN ÇOK NÖBET YAZILAN YER';
  return baslik + ' (' + donemSayisi + ' dönem, ' + GRUP_ETIKET[grup] + '):\n' + toplamlar.map(t=>'• ' + t.ad + ': ' + t.toplam + ' nöbet').join('\n');
}

// Genel sayısal bilgiler: kaç öğretmen, kaç yer, kaç dönem, dönem ne zaman.
function asistanGenelBilgiCevap(soru){
  const grup = asistanGrupBelirle(soru) || aktifGrup;
  if(soru.includes('ÖĞRETMEN')){
    const sabah = (veri.ogretmenler && veri.ogretmenler.sabah || []).length;
    const oglen = (veri.ogretmenler && veri.ogretmenler.oglen || []).length;
    return 'SABAHÇI GRUBU: ' + sabah + ' öğretmen\nÖĞLENCİ GRUBU: ' + oglen + ' öğretmen';
  }
  if(soru.includes('YER')){
    const yerler = veri.yerler || [];
    return 'Toplam ' + yerler.length + ' nöbet yeri var: ' + yerler.map(y=>y.ad).join(', ');
  }
  if(soru.includes('DÖNEM') || soru.includes('AY ')){
    const {donemSayisi} = hesaplaIstatistik(grup);
    const ay0 = asistanAktifAy(grup);
    const donemler = (veri.dagitimlar && veri.dagitimlar[grup]) || [];
    const sonDonem = donemler.length ? donemler[donemler.length-1] : null;
    const aylar = sonDonem ? (sonDonem.aylar||[]) : [];
    if(!aylar.length) return 'Bu grup için henüz yayınlanmış bir dönem yok.';
    const ilk = aylar[0], son = aylar[aylar.length-1];
    return GRUP_ETIKET[grup] + ' için ' + aylar.length + ' aylık bir program yayınlanmış: ' +
      formatDateTR(ilk.baslangicTarihi) + ' – ' + formatDateTR(son.bitisTarihi) + '.';
  }
  return null;
}

// Sorudaki metinde geçen TÜM öğretmen adlarını (tekrarsız) bulur —
// karşılaştırma sorularında ("Ayşe mi Fatma mı daha çok nöbet tutmuş")
// kullanılır.
function asistanTumOgretmenleriBul(soru){
  const bulunanlar = [];
  ['sabah','oglen'].forEach(grup=>{
    ((veri.ogretmenler && veri.ogretmenler[grup]) || []).forEach(o=>{
      const ad = asistanNormalize(o.ad);
      if(soru.includes(ad) && !bulunanlar.some(b=>b.id===o.id)){
        bulunanlar.push({grup, id:o.id, ad:o.ad, uzunluk:ad.length});
      }
    });
  });
  return bulunanlar.sort((a,b)=>b.uzunluk-a.uzunluk);
}

function asistanKarsilastirCevap(kisiler){
  const sonuc = kisiler.map(k=>{
    const {list} = hesaplaIstatistik(k.grup);
    const s = list.find(x=>x.id===k.id);
    return {ad:k.ad, total: s ? s.total : 0};
  });
  sonuc.sort((a,b)=>b.total-a.total);
  const satirlar = sonuc.map(s=>'• ' + s.ad + ': ' + s.total + ' nöbet').join('\n');
  const kazanan = sonuc[0];
  const esitMi = sonuc.every(s=>s.total===sonuc[0].total);
  return satirlar + (esitMi ? '\n\nİkisi de eşit sayıda nöbet tutmuş.' : '\n\n' + kazanan.ad + ' daha fazla nöbet tutmuş.');
}

function asistanCevapUret(soruRaw){
  if(!veri || !veri.dagitimlar){
    return 'Henüz yayınlanmış bir nöbet programı bulamadım.';
  }
  const soru = asistanNormalize(soruRaw);

  if(soru.includes('MERHABA') || soru.includes('SELAM')){
    return 'Merhaba! Nöbet programınızla ilgili aşağıdaki gibi sorular sorabilirsiniz:\n• "Bugün/yarın/dün kim nöbetçi?"\n• "Ayşe Yılmaz ne zaman nöbetçi?"\n• "Ayşe kaç kez nöbet tuttu?"\n• "En çok nöbet tutan kim?"\n• "15 Ekim\'de kim nöbetçi?"';
  }
  if(soru.includes('TEŞEKKÜR')){
    return 'Rica ederim, başka bir sorunuz olursa buradayım. 🙂';
  }
  if(soru.includes('FİLTRE')){
    return '"PROGRAM" görünümünde, ay seçiminin altındaki ÖĞRETMEN ve NÖBET YERİ kutularından seçim yaparak listeyi daraltabilirsiniz. "FİLTREYİ TEMİZLE" ile sıfırlayabilirsiniz.';
  }
  if(soru.includes('İSTATİSTİK') && (soru.includes('NEDİR') || soru.includes('NASIL'))){
    return 'Üstteki "GÖRÜNÜM" bölümünden İSTATİSTİKLER\'e geçerek, yayınlanan tüm dönemler boyunca kimin kaç kez, hangi gün ve yerde nöbet tuttuğunu görebilirsiniz. Arama kutusuyla isim de arayabilirsiniz.';
  }
  if(soru.includes('AY SEÇ') || (soru.includes('DÖNEM') && soru.includes('NASIL'))){
    return '"AY SEÇİN" açılır menüsünden, o dönemdeki farklı ayların programını görüntüleyebilirsiniz. Sayfa açıldığında otomatik olarak içinde bulunduğunuz ay seçili gelir.';
  }
  if(soru.includes('GÜNCELLE') || soru.includes('YENİLE') || soru.includes('SON YAYIN')){
    return 'Sayfanın üst kısmındaki "YENİLE" butonuna basarak en güncel yayınlanan programı çekebilirsiniz. "SON YAYIN" yazısı, en son ne zaman güncellendiğini gösterir.';
  }
  if((soru.includes('SABAHÇI') || soru.includes('ÖĞLENCİ')) && (soru.includes('NASIL') || soru.includes('DEĞİŞ') || soru.includes('GEÇ'))){
    return 'Üstteki "SABAHÇI GRUBU" / "ÖĞLENCİ GRUBU" sekmelerine dokunarak iki grup arasında geçiş yapabilirsiniz.';
  }

  // Genel sayısal bilgiler (kaç öğretmen / kaç yer / kaç dönem / tarih aralığı)
  if(soru.includes('KAÇ') && (soru.includes('ÖĞRETMEN') || soru.includes('YER') || soru.includes('DÖNEM') || soru.includes('AY VAR'))){
    const cevap = asistanGenelBilgiCevap(soru);
    if(cevap) return cevap;
  }
  if((soru.includes('NE ZAMAN') || soru.includes('TARİH')) && soru.includes('DÖNEM')){
    const cevap = asistanGenelBilgiCevap('DÖNEM');
    if(cevap) return cevap;
  }

  // Hangi gün en çok/az nöbet var?
  if(soru.includes('GÜN') && (soru.includes('EN ÇOK') || soru.includes('EN FAZLA') || soru.includes('EN AZ')) && soru.includes('NÖBET')){
    return asistanGunBazliYukCevap(soru);
  }
  // Hangi yerde en çok/az nöbet yazılmış?
  if(soru.includes('YER') && (soru.includes('EN ÇOK') || soru.includes('EN FAZLA') || soru.includes('EN AZ')) && soru.includes('NÖBET')){
    return asistanYerBazliYukCevap(soru);
  }
  // En çok / en az nöbet tutan KİŞİ
  if((soru.includes('EN ÇOK') || soru.includes('EN FAZLA') || soru.includes('EN AZ')) && soru.includes('NÖBET')){
    return asistanIstatistikCevap(soru);
  }

  // İki (veya daha fazla) öğretmen karşılaştırması
  const cokluKisi = asistanTumOgretmenleriBul(soru);
  if(cokluKisi.length >= 2 && (soru.includes('ÇOK') || soru.includes('AZ') || soru.includes('KARŞILAŞTIR') || soru.includes(' MI ') || soru.includes(' Mİ '))){
    return asistanKarsilastirCevap(cokluKisi);
  }

  // Tek öğretmen adı geçiyor mu?
  const kisi = asistanOgretmenBul(soru);
  if(kisi){
    if(soru.includes('KAÇ')){
      return asistanKacKezCevap(kisi);
    }
    return asistanOgretmenProgramCevap(kisi, soru);
  }

  // Dün / bugün / yarın
  if(soru.includes('DÜN')) return asistanGunSorgusuCevap(soru, -1);
  if(soru.includes('YARIN')) return asistanGunSorgusuCevap(soru, 1);
  if(soru.includes('BUGÜN')) return asistanGunSorgusuCevap(soru, 0);

  // Bu hafta
  if(soru.includes('HAFTA')){
    return asistanHaftaCevap(soru);
  }

  // Belirli bir takvim tarihi (ör. "15 Ekim")
  const tarihCevabi = asistanBelirliTarihCevap(soru);
  if(tarihCevabi) return tarihCevabi;

  // Yer adı geçiyor mu? (BAHÇE, 1. KAT vb.)
  const yer = asistanYerBul(soru);
  if(yer){
    return asistanYerProgramCevap(yer, soru);
  }

  if(soru.includes('KİM') || soru.includes('NÖBET')){
    return 'Tam olarak anlayamadım. Bir öğretmen adı, bir nöbet yeri adı, bir tarih (ör. "15 Ekim") ya da "bugün/yarın/dün kim nöbetçi" gibi sorabilirsiniz. Örnekler için aşağıdaki önerilere göz atabilirsiniz.';
  }

  return 'Bunu tam olarak anlayamadım 🙂 Aşağıdaki örnek sorulardan birini deneyebilir, ya da bir öğretmen adı veya nöbet yeri adı yazabilirsiniz.';
}

function asistanOneriler(){
  return ['Bugün kim nöbetçi?','Bu hafta kim nöbetçi?','En çok nöbet tutan kim?','Kaç öğretmen var?'];
}

function asistanMesajEkle(tip, metin){
  const body = document.getElementById('asistanBody');
  if(!body) return;
  const div = document.createElement('div');
  div.className = 'asistan-msg ' + tip;
  const bubble = document.createElement('div');
  bubble.className = 'asistan-bubble';
  bubble.textContent = metin;
  div.appendChild(bubble);
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

function asistanChipleriEkle(){
  const body = document.getElementById('asistanBody');
  if(!body) return;
  const eskiler = body.querySelectorAll('.asistan-chips');
  eskiler.forEach(e=>e.remove());
  const wrap = document.createElement('div');
  wrap.className = 'asistan-chips';
  asistanOneriler().forEach(soru=>{
    const b = document.createElement('button');
    b.className = 'asistan-chip';
    b.textContent = soru;
    b.onclick = ()=> asistanSoruGonder(soru);
    wrap.appendChild(b);
  });
  body.appendChild(wrap);
  body.scrollTop = body.scrollHeight;
}

function asistanSoruGonder(soru){
  const metin = (soru||'').trim();
  if(!metin) return;
  asistanMesajEkle('user', metin);
  const input = document.getElementById('asistanInput');
  if(input) input.value = '';
  setTimeout(()=>{
    const cevap = asistanCevapUret(metin);
    asistanMesajEkle('bot', cevap);
    asistanChipleriEkle();
  }, 250);
}

// Web Speech API ile Türkçe sesli okuma — tarayıcı desteklemiyorsa
// (veya engelliyorsa) sessizce hiçbir şey yapmaz, hata vermez.
// Masaüstü ve mobil tarayıcılar farklı ses listeleri sunabiliyor; bu
// yüzden mevcut Türkçe sesler arasından (tercihen bir Google/kadın
// sesi) HEP AYNI kriterle seçim yapılıyor ki iki platformda da mümkün
// olduğunca benzer bir ses çıksın.
function asistanTurkceSesSec(){
  if(!('speechSynthesis' in window)) return null;
  const sesler = window.speechSynthesis.getVoices() || [];
  const trSesler = sesler.filter(s=>(s.lang||'').toLowerCase().startsWith('tr'));
  if(!trSesler.length) return null;
  // Öncelik sırası: Google Türkçe > adında "female/kadın" geçen > ilk Türkçe ses.
  return trSesler.find(s=>/google/i.test(s.name))
    || trSesler.find(s=>/female|kadın/i.test(s.name))
    || trSesler[0];
}

function asistanSesliOkuGercek(metin){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(metin);
    u.lang = 'tr-TR';
    u.rate = 1;
    u.pitch = 1;
    const ses = asistanTurkceSesSec();
    if(ses) u.voice = ses;
    window.speechSynthesis.speak(u);
  }catch(e){ /* sesli okuma desteklenmiyorsa sessizce geç */ }
}

function asistanSesliOku(metin){
  if(!('speechSynthesis' in window)) return;
  let okundu = false;
  const okuVeIsaretle = ()=>{ if(okundu) return; okundu = true; asistanSesliOkuGercek(metin); };
  const mevcutSesler = window.speechSynthesis.getVoices();
  if(mevcutSesler && mevcutSesler.length){
    okuVeIsaretle();
  } else {
    const dinleyici = ()=>{
      window.speechSynthesis.removeEventListener('voiceschanged', dinleyici);
      okuVeIsaretle();
    };
    window.speechSynthesis.addEventListener('voiceschanged', dinleyici);
    // Bazı tarayıcılarda 'voiceschanged' hiç tetiklenmeyebilir; güvenlik
    // amacıyla kısa bir süre sonra yine de dener (yukarıdaki bayrak
    // sayesinde iki kez okuma olmaz).
    setTimeout(()=>{
      window.speechSynthesis.removeEventListener('voiceschanged', dinleyici);
      okuVeIsaretle();
    }, 300);
  }
}

const ASISTAN_KARSILAMA_METNI = 'Merhaba! Nöbet ile ilgili sorularınızı Şakir\'e sorabilirsiniz.';
let asistanSesOkunduMu = false;

function asistanAc(otomatikMi){
  asistanAcikMi = true;
  const panel = document.getElementById('asistanPanel');
  const backdrop = document.getElementById('asistanBackdrop');
  if(panel) panel.classList.add('acik');
  if(backdrop) backdrop.classList.add('acik');
  const body = document.getElementById('asistanBody');
  if(body && !body.dataset.baslatildi){
    body.dataset.baslatildi = '1';
    asistanMesajEkle('bot', '🕵️ ' + ASISTAN_KARSILAMA_METNI);
    asistanChipleriEkle();
  }
  if(!otomatikMi){
    const input = document.getElementById('asistanInput');
    if(input) setTimeout(()=>input.focus(), 200);
  }
}

function asistanKapat(){
  asistanAcikMi = false;
  const panel = document.getElementById('asistanPanel');
  const backdrop = document.getElementById('asistanBackdrop');
  if(panel) panel.classList.remove('acik');
  if(backdrop) backdrop.classList.remove('acik');
  try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
}

document.getElementById('asistanFab').onclick = ()=> asistanAcikMi ? asistanKapat() : asistanAc(false);
document.getElementById('asistanClose').onclick = asistanKapat;
document.getElementById('asistanBackdrop').onclick = asistanKapat;
document.getElementById('asistanGonder').onclick = ()=> asistanSoruGonder(document.getElementById('asistanInput').value);
document.getElementById('asistanInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') asistanSoruGonder(document.getElementById('asistanInput').value);
});

// TARAYICI KISITI: Masaüstünde panel sayfa açılır açılmaz kendiliğinden
// (kullanıcı tıklamadan) açıldığı için, çoğu tarayıcı o anda sesli
// okumayı engeller — sesli okuma gerçek bir kullanıcı etkileşimi (tıklama/
// dokunma) gerektirir. Bu yüzden karşılama sesi, sayfadaki İLK gerçek
// tıklamada (hangi öğeye olursa olsun — baloncuk dahil) bir kere çalınır.
function asistanIlkEtkilesimdeSesOku(){
  if(asistanSesOkunduMu) return;
  const body = document.getElementById('asistanBody');
  if(!body || !body.dataset.baslatildi) return; // karşılama mesajı henüz gösterilmediyse bekle
  asistanSesOkunduMu = true;
  asistanSesliOku(ASISTAN_KARSILAMA_METNI);
}
document.addEventListener('click', asistanIlkEtkilesimdeSesOku);
document.addEventListener('touchstart', asistanIlkEtkilesimdeSesOku);

function tmSifreDogrula(girilenSifre){
  return fbDb.ref('yonetimVerisi/ayarlar/yoneticiSifre').once('value').then(snap=>{
    const dogruSifre = snap.val();
    const girilen = String(girilenSifre||'').trim().toLocaleUpperCase('tr');
    if(dogruSifre == null){
      // Yönetim verisi Firebase'de henüz hiç oluşturulmadı (İLK KURULUM).
      // Bu durumda yalnızca fabrika/varsayılan şifre (123456) ile girişe
      // izin verilir. Giriş yapıldıktan sonra AYARLAR > 6'dan şifre hemen
      // değiştirilmeli ve gerekirse eski bir JSON yedeği (AYARLAR > 5)
      // içeri aktarılarak gerçek veriler yüklenmelidir.
      return girilen === '123456';
    }
    const dogru = String(dogruSifre).trim().toLocaleUpperCase('tr');
    return !!dogru && girilen === dogru;
  });
}

/* ==============================================================
 * bootstrap.js — Şifreyle giden roller: 'teacher' (varsayılan,
 * görüntüleme) | 'admin' (yönetim paneli). Hangi modda açılacağı bu
 * cihazda daha önce doğru şifre girilip girilmediğine (localStorage)
 * bakılarak belirlenir; sayfa her açıldığında/roldeğiştiğinde TEK bir
 * mod için gerekli HTML kökü DOM'da bırakılır, diğeri tamamen kaldırılır.
 * ============================================================== */
function nbTazeYenile(){
  // DİKKAT: Bilerek location.reload() KULLANMIYORUZ — bazı tarayıcılar
  // (özellikle telefonlarda) normal bir yenilemeyi hâlâ önbellekten
  // (eski/güncellenmemiş bir kopyadan) karşılayabiliyor. Adrese her seferinde
  // FARKLI bir sorgu parametresi (?t=...) ekleyerek, tarayıcının bunu HİÇ
  // görmediği YENİ bir adres sanıp sunucudan gerçekten taze bir kopya
  // indirmesini garantiliyoruz.
  const temelUrl = location.href.split('#')[0].split('?')[0];
  location.href = temelUrl + '?t=' + Date.now();
}

let nbRole = (function(){
  try { return localStorage.getItem('nb_role') === 'admin' ? 'admin' : 'teacher'; }
  catch(e){ return 'teacher'; }
})();

function nbCikisYap(){
  // Az önce yapılmış bir değişikliğin Firebase'e yazılması bitmeden sayfa
  // yenilenip veri kaybolmasın diye, varsa bekleyen kaydın bitmesini
  // bekliyoruz (en fazla ~4 saniye; daha uzun sürerse yine de çıkış yapılır).
  const bekleyen = (typeof sonKayitPromise !== 'undefined' && sonKayitPromise) ? sonKayitPromise : Promise.resolve();
  const zamanAsimi = new Promise(r=>setTimeout(r, 4000));
  Promise.race([bekleyen.catch(()=>{}), zamanAsimi]).then(()=>{
    try{ localStorage.removeItem('nb_role'); }catch(e){}
    nbTazeYenile();
  });
}

window.onload = function(){
  const adminRoot = document.getElementById('adminRoot');
  const teacherRoot = document.getElementById('teacherRoot');
  if(nbRole === 'admin'){
    if(teacherRoot) teacherRoot.remove();
    if(adminRoot) adminRoot.style.display = '';
    const btnCikis = document.getElementById('btnCikisYap');
    if(btnCikis) btnCikis.onclick = nbCikisYap;
    const mtCikis = document.getElementById('mtCikisYap');
    if(mtCikis) mtCikis.onclick = nbCikisYap;
    loadState();
  } else {
    if(adminRoot) adminRoot.remove();
    if(teacherRoot) teacherRoot.style.display = '';
    initTeacherApp();
  }
};
