<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nöbet Çizelgesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{
  --navy:#1B2A4A; --navy-soft:#EAF0F9; --gold:#C9A227; --gold-soft:#FBF1D8;
  --line:#E3E7EE; --muted:#6B7280; --text:#1F2430; --bg:#F5F6F9; --card:#FFFFFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
.wrap{max-width:1000px;margin:0 auto;padding:10px 10px 30px;}

.header{background:var(--navy);color:#fff;border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.header img{width:32px;height:32px;object-fit:contain;border-radius:7px;flex-shrink:0;}
.header .h-title{font-size:13.5px;font-weight:800;letter-spacing:.1px;line-height:1.2;}
.header .h-sub{font-size:10.5px;opacity:.85;margin-top:1px;line-height:1.2;}

.updated{font-size:10.5px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.refresh{border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:11px;padding:6px 11px;border-radius:8px;cursor:pointer;}

.tabs{display:flex;gap:6px;margin-bottom:8px;}
.tabs button{flex:1;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:12px;padding:9px 8px;border-radius:9px;cursor:pointer;-webkit-user-select:none;user-select:none;}
.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);}

.view-tabs{display:flex;gap:6px;margin-bottom:8px;}
.view-tabs button{flex:1;border:1.5px solid var(--gold);background:#fff;color:#8A5D14;font-weight:700;font-size:11.5px;padding:7px 8px;border-radius:8px;cursor:pointer;-webkit-user-select:none;user-select:none;}
.view-tabs button.active{background:var(--gold);color:#fff;border-color:var(--gold);}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
.field{margin-bottom:8px;}
.field:last-child{margin-bottom:0;}
.field label{display:block;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.3px;margin-bottom:4px;}
.field select{border:1.5px solid var(--line);border-radius:8px;padding:9px 9px;font-size:15px;font-family:inherit;color:var(--text);background:#fff;width:100%;min-height:40px;}
.field select.ay-select{font-weight:800;color:var(--navy);border-color:var(--gold);background:var(--gold-soft);}
.filter-row{display:flex;gap:8px;}
.filter-row .field{flex:1;margin-bottom:0;}
.filter-clear{margin-top:8px;width:100%;border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:11.5px;padding:8px 10px;border-radius:8px;cursor:pointer;}

.donem-baslik{font-size:13px;font-weight:800;color:var(--navy);margin:2px 0 8px;}

.yer-block{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.yer-block.yer-hidden{display:none;}
.yer-block-title{background:var(--navy-soft);color:var(--navy);font-weight:800;font-size:12px;padding:9px 10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;-webkit-user-select:none;user-select:none;}
.yer-block-title .chevron{transition:transform .15s;font-size:11px;color:var(--navy);}
.yer-block.expanded .yer-block-title .chevron{transform:rotate(180deg);}
.yer-block .day-row{display:none;}
.yer-block.expanded .day-row{display:flex;}
.day-row{padding:7px 10px;border-top:1px solid var(--line);gap:8px;}
.day-row .day-label{flex:0 0 74px;font-size:10.5px;font-weight:800;color:var(--muted);padding-top:1px;}
.day-row .day-names{flex:1;font-size:12.5px;line-height:1.45;}
.day-row .day-names .isim{display:block;}
.day-row .day-names .isim + .isim{margin-top:1px;}
.empty{color:#B7BDC9;}
.cell-match{background:var(--gold-soft);font-weight:800;color:#8A5D14;border-radius:5px;padding:1px 5px;display:inline-block;}
.cell-dim{opacity:.35;}

.desktop-table{display:none;}
table.data{width:100%;border-collapse:collapse;font-size:13px;}
table.data th, table.data td{border:1px solid var(--line);padding:8px 9px;text-align:center;vertical-align:middle;}
table.data th{background:var(--navy-soft);color:var(--navy);font-weight:800;font-size:12px;}
table.data td.yer{background:var(--navy-soft);font-weight:700;color:var(--navy);text-align:left;}

.msg{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px;}

.stat-row{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.stat-row-head{padding:9px 10px;cursor:pointer;display:flex;align-items:center;gap:10px;-webkit-user-select:none;user-select:none;}
.stat-row-head .stat-ad{flex:1;font-weight:800;font-size:12.5px;color:var(--text);}
.stat-row-head .stat-num{font-weight:800;font-size:13px;color:var(--navy);flex:0 0 auto;}
.stat-row-head .stat-num.stat-high{color:#B3261E;}
.stat-row-head .stat-num.stat-low{color:#8A5D14;}
.stat-bar-track{height:5px;border-radius:4px;background:var(--navy-soft);overflow:hidden;margin-top:5px;}
.stat-bar-fill{height:100%;background:var(--navy);border-radius:4px;}
.stat-bar-fill.stat-high{background:#B3261E;}
.stat-bar-fill.stat-low{background:var(--gold);}
.stat-row-body{display:none;padding:0 10px 10px;}
.stat-row.expanded .stat-row-body{display:block;}
.stat-pill-group{margin-top:6px;}
.stat-pill-group-title{font-size:9.5px;font-weight:800;color:var(--muted);letter-spacing:.3px;margin-bottom:4px;}
.stat-pill{display:inline-block;background:var(--navy-soft);color:var(--navy);font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;margin:0 4px 4px 0;}
.stat-legend{font-size:10.5px;color:var(--muted);margin-bottom:8px;line-height:1.5;}
.stat-search{border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:15px;font-family:inherit;color:var(--text);background:#fff;width:100%;margin-bottom:8px;}
@media (min-width: 640px){ .stat-search{font-size:13px;max-width:320px;} }
table.data td.stat-num-cell{font-weight:800;color:var(--navy);}
table.data td.stat-num-cell.stat-high{color:#B3261E;}
table.data td.stat-num-cell.stat-low{color:#8A5D14;}

@media (min-width: 640px){
  body{font-size:15px;}
  .wrap{padding:22px 16px 60px;}
  .header{padding:18px 22px;gap:14px;border-radius:14px;}
  .header img{width:46px;height:46px;border-radius:9px;}
  .header .h-title{font-size:18px;}
  .header .h-sub{font-size:12.5px;}
  .updated{font-size:12px;margin-bottom:14px;}
  .tabs{margin-bottom:14px;}
  .tabs button{flex:0 1 auto;font-size:13px;padding:9px 18px;}
  .panel{padding:16px 18px;margin-bottom:14px;}
  .field select{font-size:13px;min-height:auto;}
  .filter-row{gap:14px;}
  .filter-clear{width:auto;float:right;margin-top:0;}
  .donem-baslik{font-size:16px;}
  .desktop-table{display:block;}
  .mobile-cards{display:none;}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><div class="msg">YÜKLENİYOR…</div></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBUOA8oDCVkZtKmqgynjsYBHlIZEM2cCTs",
  authDomain: "nobet-programi-d0ada.firebaseapp.com",
  databaseURL: "https://nobet-programi-d0ada-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "nobet-programi-d0ada",
  storageBucket: "nobet-programi-d0ada.firebasestorage.app",
  messagingSenderId: "799459966173",
  appId: "1:799459966173:web:05528e0fe25f184cc02f34",
  measurementId: "G-EX3WRN0KF3"
};
firebase.initializeApp(firebaseConfig);
const fbDb = firebase.database();

const GUNLER = ['PAZARTESİ','SALI','ÇARŞAMBA','PERŞEMBE','CUMA'];
const GRUP_ETIKET = {sabah:'SABAHÇI GRUBU', oglen:'ÖĞLENCİ GRUBU'};

let veri = null;
let aktifGrup = 'sabah';
let aktifAyIdx = 0;
let filtreYer = '';
let filtreOgretmen = '';
let gorunum = 'program'; // 'program' | 'istatistik'
let istatistikArama = '';

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','&':'&amp;'}[c])); }

function formatTarih(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.toLocaleString('tr-TR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
}

function formatDateTR(dateStr){
  if(!dateStr) return '';
  const p = dateStr.split('-');
  if(p.length !== 3) return dateStr;
  return p[2] + '.' + p[1] + '.' + p[0];
}

function ogretmenAd(grup, id){
  const list = (veri.ogretmenler && veri.ogretmenler[grup]) || [];
  const o = list.find(x=>x.id===id);
  return o ? esc(o.ad) : '';
}

function renderHucre(ids, grup){
  const names = (ids||[]).map(id=>({id, ad:ogretmenAd(grup, id)})).filter(x=>x.ad);
  if(!names.length) return '<span class="empty">&mdash;</span>';
  return names.map(n=>{
    const eslesti = filtreOgretmen && n.id === filtreOgretmen;
    return `<div class="${eslesti ? 'cell-match' : (filtreOgretmen ? 'cell-dim' : '')}">${n.ad}</div>`;
  }).join('');
}

// Bugünün tarihine en yakın / içinde bulunulan ayı bulur; yoksa son ayı döner.
function varsayilanAyIdx(aylar){
  if(!aylar || !aylar.length) return 0;
  const bugun = new Date(); bugun.setHours(0,0,0,0);
  for(let i=0;i<aylar.length;i++){
    const bit = aylar[i].bitisTarihi ? new Date(aylar[i].bitisTarihi) : null;
    if(bit && bit >= bugun) return i;
  }
  return aylar.length - 1;
}

function renderAyIcerik(ay, grup){
  const yerler = veri.yerler || [];

  const rows = yerler.map(y=>{
    const gizli = filtreYer && y.id !== filtreYer;
    const cells = GUNLER.map(g=>{
      const ids = ay.tablo && ay.tablo[y.id] ? ay.tablo[y.id][g] : [];
      return `<td>${renderHucre(ids, grup)}</td>`;
    }).join('');
    return `<tr style="${gizli ? 'display:none;' : ''}"><td class="yer">${esc(y.ad)}</td>${cells}</tr>`;
  }).join('');

  const yerBloklari = yerler.map(y=>{
    const gizli = filtreYer && y.id !== filtreYer;
    const icerirMi = filtreOgretmen && GUNLER.some(g=>{
      const ids = (ay.tablo && ay.tablo[y.id] ? ay.tablo[y.id][g] : []) || [];
      return ids.includes(filtreOgretmen);
    });
    const acik = !!filtreYer || icerirMi;
    const gunSatirlari = GUNLER.map(g=>{
      const ids = ay.tablo && ay.tablo[y.id] ? ay.tablo[y.id][g] : [];
      return `<div class="day-row"><div class="day-label">${g}</div><div class="day-names">${renderHucre(ids, grup)}</div></div>`;
    }).join('');
    return `<div class="yer-block ${gizli ? 'yer-hidden' : ''} ${acik ? 'expanded' : ''}">
      <div class="yer-block-title" data-toggle="1">${esc(y.ad)}<span class="chevron">▾</span></div>
      ${gunSatirlari}
    </div>`;
  }).join('');

  const tarihAraligi = (ay.baslangicTarihi && ay.bitisTarihi)
    ? (formatDateTR(ay.baslangicTarihi) + ' – ' + formatDateTR(ay.bitisTarihi))
    : '';

  return `
    <div class="donem-baslik">${esc((ay.ayEtiket || '').replace(/\s*\d{4}$/, ''))} PROGRAMI${tarihAraligi ? ' (' + tarihAraligi + ')' : ''}</div>
    <div class="mobile-cards">${yerBloklari}</div>
    <div class="desktop-table">
    <table class="data">
      <tr><th>NÖBET YERİ</th>${GUNLER.map(g=>`<th>${g}</th>`).join('')}</tr>
      ${rows}
    </table>
    </div>`;
}

// Tüm yayınlanmış dönemlerdeki (ay tekrar etmeyecek şekilde) nöbet
// sayılarını öğretmen bazında toplar — gün ve yer kırılımıyla birlikte.
function hesaplaIstatistik(grup){
  const teachers = (veri.ogretmenler && veri.ogretmenler[grup]) || [];
  const yerler = veri.yerler || [];
  const donemler = (veri.dagitimlar && veri.dagitimlar[grup]) || [];

  const uniqueAylarMap = {};
  donemler.forEach(b=>{
    (b.aylar || []).forEach(ay=>{ uniqueAylarMap[ay.ay] = ay; });
  });
  const uniqueAylar = Object.values(uniqueAylarMap);

  const stats = {};
  teachers.forEach(t=>{
    stats[t.id] = { id:t.id, ad:t.ad, total:0, days:{PAZARTESİ:0,SALI:0,ÇARŞAMBA:0,PERŞEMBE:0,CUMA:0}, places:{} };
    yerler.forEach(y=>{ stats[t.id].places[y.id] = 0; });
  });

  uniqueAylar.forEach(ay=>{
    Object.keys(ay.tablo || {}).forEach(yId=>{
      GUNLER.forEach(g=>{
        (ay.tablo[yId][g] || []).forEach(tId=>{
          if(stats[tId]){
            stats[tId].total++;
            stats[tId].days[g] = (stats[tId].days[g] || 0) + 1;
            stats[tId].places[yId] = (stats[tId].places[yId] || 0) + 1;
          }
        });
      });
    });
  });

  return { list: Object.values(stats), donemSayisi: uniqueAylar.length };
}

function renderIstatistikIcerik(grup){
  const { list, donemSayisi } = hesaplaIstatistik(grup);
  const yerler = veri.yerler || [];

  if(!donemSayisi || !list.length){
    return '<div class="msg">BU GRUP İÇİN HENÜZ İSTATİSTİK OLUŞTURACAK YAYINLANMIŞ DÖNEM YOK.</div>';
  }

  const totals = list.map(s=>s.total).filter(n=>n>0);
  const maxTotal = totals.length ? Math.max(...totals) : 0;
  const avgTotal = totals.length ? (totals.reduce((a,b)=>a+b,0) / totals.length) : 0;

  const sorted = list.slice().sort((a,b)=>a.ad.localeCompare(b.ad,'tr'));

  const rowsMobile = sorted.map(s=>{
    let cls = '';
    if(avgTotal>0 && s.total>0){
      if(s.total >= avgTotal*1.25) cls = 'stat-high';
      else if(s.total <= avgTotal*0.75) cls = 'stat-low';
    }
    const barPct = maxTotal>0 ? Math.round((s.total/maxTotal)*100) : 0;
    const eslesti = filtreOgretmen && s.id === filtreOgretmen;
    const dayPills = GUNLER.map(g=>`<span class="stat-pill">${g.slice(0,3)}: ${s.days[g]||0}</span>`).join('');
    const placePills = yerler.map(y=>`<span class="stat-pill">${esc(y.ad)}: ${s.places[y.id]||0}</span>`).join('');
    return `<div class="stat-row ${eslesti?'expanded':''}" data-ad="${esc(s.ad.toLocaleLowerCase('tr'))}">
      <div class="stat-row-head">
        <div style="flex:1;">
          <div class="stat-ad">${esc(s.ad)}</div>
          <div class="stat-bar-track"><div class="stat-bar-fill ${cls}" style="width:${barPct}%"></div></div>
        </div>
        <div class="stat-num ${cls}">${s.total}</div>
      </div>
      <div class="stat-row-body">
        <div class="stat-pill-group">
          <div class="stat-pill-group-title">GÜN DAĞILIMI</div>
          ${dayPills}
        </div>
        <div class="stat-pill-group">
          <div class="stat-pill-group-title">YER DAĞILIMI</div>
          ${placePills}
        </div>
      </div>
    </div>`;
  }).join('');

  const rowsDesktop = sorted.map(s=>{
    let cls = '';
    if(avgTotal>0 && s.total>0){
      if(s.total >= avgTotal*1.25) cls = 'stat-high';
      else if(s.total <= avgTotal*0.75) cls = 'stat-low';
    }
    const barPct = maxTotal>0 ? Math.round((s.total/maxTotal)*100) : 0;
    const dayPills = GUNLER.map(g=>`<span class="stat-pill">${g.slice(0,3)}: ${s.days[g]||0}</span>`).join('');
    const placePills = yerler.map(y=>`<span class="stat-pill">${esc(y.ad)}: ${s.places[y.id]||0}</span>`).join('');
    return `<tr data-ad="${esc(s.ad.toLocaleLowerCase('tr'))}">
      <td style="text-align:left;font-weight:700;">${esc(s.ad)}</td>
      <td class="stat-num-cell ${cls}">
        ${s.total}
        <div class="stat-bar-track"><div class="stat-bar-fill ${cls}" style="width:${barPct}%"></div></div>
      </td>
      <td>${dayPills}</td>
      <td>${placePills}</td>
    </tr>`;
  }).join('');

  return `
    <div class="donem-baslik">NÖBET DAĞITIM İSTATİSTİKLERİ</div>
    <input type="text" id="statAramaInput" class="stat-search" placeholder="ÖĞRETMEN ARA…" value="${esc(istatistikArama)}">
    <div class="stat-legend mobile-cards">İSİMLERİN ÜZERİNE DOKUNARAK GÜN VE YER DAĞILIMINI GÖREBİLİRSİNİZ.</div>
    <div class="stat-legend desktop-table">${donemSayisi} DÖNEM ÜZERİNDEN TOPLAM NÖBET SAYILARI.</div>
    <div id="statSonucYok" class="msg" style="display:none;padding:16px;">EŞLEŞEN ÖĞRETMEN BULUNAMADI.</div>
    <div class="mobile-cards">${rowsMobile}</div>
    <div class="desktop-table">
    <table class="data">
      <tr><th>ÖĞRETMEN ADI</th><th>TOPLAM NÖBET</th><th>GÜN DAĞILIMI</th><th>YER DAĞILIMI</th></tr>
      ${rowsDesktop}
    </table>
    </div>`;
}

function render(){
  const app = document.getElementById('app');
  if(!veri || !veri.dagitimlar){
    app.innerHTML = '<div class="msg">HENÜZ YAYINLANMIŞ BİR NÖBET ÇİZELGESİ YOK.</div>';
    return;
  }

  const kurum = veri.kurum || {};
  const donemler = (veri.dagitimlar[aktifGrup] || []);
  const sonDonem = donemler.length ? donemler[donemler.length - 1] : null;
  const aylar = sonDonem ? (sonDonem.aylar || []) : [];
  if(aktifAyIdx >= aylar.length) aktifAyIdx = 0;

  const headerHtml = `
    <div class="header">
      ${kurum.logo ? `<img src="${kurum.logo}" alt="Logo">` : ''}
      <div>
        <div class="h-title">${esc(kurum.ad || 'NÖBET ÇİZELGESİ')}</div>
        <div class="h-sub">${esc(kurum.altBaslik || '')}</div>
      </div>
    </div>`;

  const guncellemeHtml = `<div class="updated"><span>SON YAYIN: ${formatTarih(veri.yayinTarihi)}</span><button class="refresh" id="btnYenile">YENİLE</button></div>`;

  const tabsHtml = `
    <div class="tabs">
      <button data-grup="sabah" class="${aktifGrup==='sabah'?'active':''}">${GRUP_ETIKET.sabah}</button>
      <button data-grup="oglen" class="${aktifGrup==='oglen'?'active':''}">${GRUP_ETIKET.oglen}</button>
    </div>`;

  const viewTabsHtml = `
    <div class="view-tabs">
      <button data-view="program" class="${gorunum==='program'?'active':''}">PROGRAM</button>
      <button data-view="istatistik" class="${gorunum==='istatistik'?'active':''}">İSTATİSTİKLER</button>
    </div>`;

  if(gorunum==='istatistik'){
    app.innerHTML = headerHtml + guncellemeHtml + tabsHtml + viewTabsHtml + renderIstatistikIcerik(aktifGrup);
    document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ aktifGrup=b.dataset.grup; filtreYer=''; filtreOgretmen=''; istatistikArama=''; render(); });
    document.querySelectorAll('.view-tabs button').forEach(b=>b.onclick=()=>{ gorunum=b.dataset.view; render(); });
    const bY = document.getElementById('btnYenile'); if(bY) bY.onclick = yukle;
    document.querySelectorAll('.stat-row-head').forEach(t=>t.onclick=()=>{ t.parentElement.classList.toggle('expanded'); });
    const statArama = document.getElementById('statAramaInput');
    if(statArama) statArama.oninput = ()=>{
      istatistikArama = statArama.value;
      const q = istatistikArama.toLocaleLowerCase('tr').trim();
      let eslesenSayi = 0;
      document.querySelectorAll('.stat-row, table.data tr[data-ad]').forEach(el=>{
        const ad = el.dataset.ad || '';
        const uyar = !q || ad.includes(q);
        el.style.display = uyar ? '' : 'none';
        if(uyar) eslesenSayi++;
      });
      const sonucYok = document.getElementById('statSonucYok');
      if(sonucYok) sonucYok.style.display = (q && eslesenSayi===0) ? '' : 'none';
    };
    return;
  }

  if(!aylar.length){
    app.innerHTML = headerHtml + guncellemeHtml + tabsHtml + viewTabsHtml + '<div class="msg">BU GRUP İÇİN HENÜZ YAYINLANMIŞ BİR PROGRAM YOK.</div>';
    document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ aktifGrup=b.dataset.grup; aktifAyIdx=0; filtreYer=''; filtreOgretmen=''; render(); });
    document.querySelectorAll('.view-tabs button').forEach(b=>b.onclick=()=>{ gorunum=b.dataset.view; render(); });
    const bY = document.getElementById('btnYenile'); if(bY) bY.onclick = yukle;
    return;
  }

  const yerler = veri.yerler || [];
  const ogretmenler = (veri.ogretmenler && veri.ogretmenler[aktifGrup]) || [];

  const panelHtml = `
    <div class="panel">
      <div class="field">
        <label>AY SEÇİN</label>
        <select id="aySel" class="ay-select">
          ${aylar.map((a,i)=>`<option value="${i}" ${i===aktifAyIdx?'selected':''}>${esc((a.ayEtiket||'').replace(/\s*\d{4}$/, ''))} PROGRAMI</option>`).join('')}
        </select>
      </div>
      <div class="field filter-row">
        <div class="field">
          <label>ÖĞRETMEN</label>
          <select id="filtreOgretmenSel">
            <option value="">TÜMÜ</option>
            ${ogretmenler.map(o=>`<option value="${o.id}" ${o.id===filtreOgretmen?'selected':''}>${esc(o.ad)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>NÖBET YERİ</label>
          <select id="filtreYerSel">
            <option value="">TÜMÜ</option>
            ${yerler.map(y=>`<option value="${y.id}" ${y.id===filtreYer?'selected':''}>${esc(y.ad)}</option>`).join('')}
          </select>
        </div>
      </div>
      ${(filtreYer || filtreOgretmen) ? `<button class="filter-clear" id="btnFiltreTemizle">FİLTREYİ TEMİZLE</button>` : ''}
    </div>`;

  const ayIcerikHtml = renderAyIcerik(aylar[aktifAyIdx], aktifGrup);

  app.innerHTML = headerHtml + guncellemeHtml + tabsHtml + viewTabsHtml + panelHtml + ayIcerikHtml;

  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
    aktifGrup = b.dataset.grup;
    aktifAyIdx = 0;
    filtreYer = '';
    filtreOgretmen = '';
    render();
  });
  document.querySelectorAll('.view-tabs button').forEach(b=>b.onclick=()=>{ gorunum=b.dataset.view; render(); });
  const btnYenile = document.getElementById('btnYenile');
  if(btnYenile) btnYenile.onclick = yukle;

  const aySel = document.getElementById('aySel');
  if(aySel) aySel.onchange = ()=>{ aktifAyIdx = Number(aySel.value); render(); };
  const selOgretmen = document.getElementById('filtreOgretmenSel');
  if(selOgretmen) selOgretmen.onchange = ()=>{ filtreOgretmen = selOgretmen.value; render(); };
  const selYer = document.getElementById('filtreYerSel');
  if(selYer) selYer.onchange = ()=>{ filtreYer = selYer.value; render(); };
  const btnTemizle = document.getElementById('btnFiltreTemizle');
  if(btnTemizle) btnTemizle.onclick = ()=>{ filtreYer=''; filtreOgretmen=''; render(); };

  document.querySelectorAll('.yer-block-title').forEach(t=>t.onclick=()=>{
    t.parentElement.classList.toggle('expanded');
  });
}

function yukle(){
  document.getElementById('app').innerHTML = '<div class="msg">YÜKLENİYOR…</div>';
  fbDb.ref('nobetListesi').once('value')
    .then(snap=>{
      veri = snap.val();
      const donemler = veri && veri.dagitimlar ? (veri.dagitimlar[aktifGrup] || []) : [];
      const sonDonem = donemler.length ? donemler[donemler.length - 1] : null;
      aktifAyIdx = sonDonem ? varsayilanAyIdx(sonDonem.aylar || []) : 0;
      render();
    })
    .catch(err=>{
      document.getElementById('app').innerHTML = '<div class="msg">VERİ YÜKLENEMEDİ: ' + esc(err.message) + '</div>';
    });
}

yukle();
</script>
</body>
</html>
