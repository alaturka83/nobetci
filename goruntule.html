<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nöbet Çizelgesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{
  --navy:#1B2A4A; --navy-soft:#EAF0F9; --gold:#C9A227; --gold-soft:#FBF1D8;
  --line:#E3E7EE; --muted:#6B7280; --text:#1F2430; --bg:#F5F6F9; --card:#FFFFFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
.wrap{max-width:1000px;margin:0 auto;padding:10px 10px 30px;}

.header{background:var(--navy);color:#fff;border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.header img{width:32px;height:32px;object-fit:contain;border-radius:7px;flex-shrink:0;}
.header .h-title{font-size:13.5px;font-weight:800;letter-spacing:.1px;line-height:1.2;}
.header .h-sub{font-size:10.5px;opacity:.85;margin-top:1px;line-height:1.2;}

.updated{font-size:10.5px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.refresh{border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:11px;padding:6px 11px;border-radius:8px;cursor:pointer;}

.tabs{display:flex;gap:6px;margin-bottom:8px;}
.tabs button{flex:1;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:12px;padding:9px 8px;border-radius:9px;cursor:pointer;-webkit-user-select:none;user-select:none;}
.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);}

.view-toggle-label{font-size:9.5px;font-weight:800;color:var(--muted);letter-spacing:.5px;margin-bottom:5px;}
.view-toggle{display:flex;background:var(--navy-soft);border-radius:10px;padding:3px;gap:3px;margin-bottom:8px;}
.view-toggle button{flex:1;border:none;background:transparent;color:var(--navy);font-weight:700;font-size:12px;padding:8px 6px;border-radius:7px;cursor:pointer;-webkit-user-select:none;user-select:none;display:flex;align-items:center;justify-content:center;gap:5px;opacity:.65;}
.view-toggle button.active{background:#fff;box-shadow:0 1px 4px rgba(20,25,40,.15);color:var(--navy);opacity:1;}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
.field{margin-bottom:8px;}
.field:last-child{margin-bottom:0;}
.field label{display:block;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.3px;margin-bottom:4px;}
.field select{border:1.5px solid var(--line);border-radius:8px;padding:9px 9px;font-size:15px;font-family:inherit;color:var(--text);background:#fff;width:100%;min-height:40px;}
.field select.ay-select{font-weight:800;color:var(--navy);border-color:var(--gold);background:var(--gold-soft);}
.filter-row{display:flex;gap:8px;}
.filter-row .field{flex:1;margin-bottom:0;}
.filter-clear{margin-top:8px;width:100%;border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:11.5px;padding:8px 10px;border-radius:8px;cursor:pointer;}

.donem-baslik{font-size:13px;font-weight:800;color:var(--navy);margin:2px 0 8px;}

.yer-block{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.yer-block.yer-hidden{display:none;}
.yer-block-title{background:var(--navy-soft);color:var(--navy);font-weight:800;font-size:12px;padding:9px 10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;-webkit-user-select:none;user-select:none;}
.yer-block-title .chevron{transition:transform .15s;font-size:11px;color:var(--navy);}
.yer-block.expanded .yer-block-title .chevron{transform:rotate(180deg);}
.yer-block .day-row{display:none;}
.yer-block.expanded .day-row{display:flex;}
.day-row{padding:7px 10px;border-top:1px solid var(--line);gap:8px;}
.day-row .day-label{flex:0 0 74px;font-size:10.5px;font-weight:800;color:var(--muted);padding-top:1px;}
.day-row .day-names{flex:1;font-size:12.5px;line-height:1.45;}
.day-row .day-names .isim{display:block;}
.day-row .day-names .isim + .isim{margin-top:1px;}
.empty{color:#B7BDC9;}
.cell-match{background:var(--gold-soft);font-weight:800;color:#8A5D14;border-radius:5px;padding:1px 5px;display:inline-block;}
.cell-dim{opacity:.35;}

.desktop-table{display:none;}
table.data{width:100%;border-collapse:collapse;font-size:13px;}
table.data th, table.data td{border:1px solid var(--line);padding:8px 9px;text-align:center;vertical-align:middle;}
table.data th{background:var(--navy-soft);color:var(--navy);font-weight:800;font-size:12px;}
table.data td.yer{background:var(--navy-soft);font-weight:700;color:var(--navy);text-align:left;}

.msg{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px;}

.stat-row{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.stat-row-head{padding:9px 10px;cursor:pointer;display:flex;align-items:center;gap:10px;-webkit-user-select:none;user-select:none;}
.stat-row-head .stat-ad{flex:1;font-weight:800;font-size:12.5px;color:var(--text);}
.stat-row-head .stat-num{font-weight:800;font-size:13px;color:var(--navy);flex:0 0 auto;}
.stat-row-head .stat-num.stat-high{color:#B3261E;}
.stat-row-head .stat-num.stat-low{color:#8A5D14;}
.stat-bar-track{height:5px;border-radius:4px;background:var(--navy-soft);overflow:hidden;margin-top:5px;}
.stat-bar-fill{height:100%;background:var(--navy);border-radius:4px;}
.stat-bar-fill.stat-high{background:#B3261E;}
.stat-bar-fill.stat-low{background:var(--gold);}
.stat-row-body{display:none;padding:0 10px 10px;}
.stat-row.expanded .stat-row-body{display:block;}
.stat-pill-group{margin-top:6px;}
.stat-pill-group-title{font-size:9.5px;font-weight:800;color:var(--muted);letter-spacing:.3px;margin-bottom:4px;}
.stat-pill{display:inline-block;background:var(--navy-soft);color:var(--navy);font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;margin:0 4px 4px 0;}
.stat-legend{font-size:10.5px;color:var(--muted);margin-bottom:8px;line-height:1.5;}
.stat-search{border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:15px;font-family:inherit;color:var(--text);background:#fff;width:100%;margin-bottom:8px;}
@media (min-width: 640px){ .stat-search{font-size:13px;max-width:320px;} }
table.data td.stat-num-cell{font-weight:800;color:var(--navy);}
table.data td.stat-num-cell.stat-high{color:#B3261E;}
table.data td.stat-num-cell.stat-low{color:#8A5D14;}

/* ---- Sanal Asistan ---- */
.asistan-fab{position:fixed;right:14px;bottom:14px;z-index:400;height:48px;border-radius:26px;background:var(--navy);color:#fff;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(20,25,40,.3);display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;}
.asistan-fab .ico{font-size:20px;}
.asistan-fab .txt{font-weight:800;font-size:12.5px;white-space:nowrap;}
.asistan-fab .dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--navy);display:none;}
.asistan-fab.uyari .dot{display:block;}
.asistan-backdrop{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:410;display:none;}
.asistan-backdrop.acik{display:block;}
.asistan-panel{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:380px;background:var(--bg);z-index:420;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;box-shadow:-6px 0 24px rgba(0,0,0,.18);}
.asistan-panel.acik{transform:translateX(0);}
.asistan-head{background:var(--navy);color:#fff;padding:14px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.asistan-head .av{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.asistan-head .tit{flex:1;}
.asistan-head .tit .t1{font-weight:800;font-size:13.5px;}
.asistan-head .tit .t2{font-size:10.5px;opacity:.8;}
.asistan-close{background:rgba(255,255,255,.12);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0;}
.asistan-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}
.asistan-msg{display:flex;margin-bottom:10px;}
.asistan-msg.user{justify-content:flex-end;}
.asistan-bubble{max-width:85%;padding:9px 12px;border-radius:14px;font-size:12.5px;line-height:1.5;white-space:pre-line;}
.asistan-msg.bot .asistan-bubble{background:#fff;border:1px solid var(--line);color:var(--text);border-bottom-left-radius:4px;}
.asistan-msg.user .asistan-bubble{background:var(--navy);color:#fff;border-bottom-right-radius:4px;}
.asistan-chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px;}
.asistan-chip{border:1.5px solid var(--gold);background:var(--gold-soft);color:#8A5D14;font-weight:700;font-size:11.5px;padding:7px 11px;border-radius:16px;cursor:pointer;}
.asistan-inputrow{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fff;flex-shrink:0;}
.asistan-inputrow input{flex:1;border:1.5px solid var(--line);border-radius:20px;padding:10px 14px;font-size:15px;font-family:inherit;}
.asistan-inputrow button{border:none;background:var(--navy);color:#fff;width:40px;height:40px;border-radius:50%;font-size:16px;cursor:pointer;flex-shrink:0;}

@media (min-width: 640px){
  body{font-size:15px;}
  .wrap{padding:22px 16px 60px;}
  .header{padding:18px 22px;gap:14px;border-radius:14px;}
  .header img{width:46px;height:46px;border-radius:9px;}
  .header .h-title{font-size:18px;}
  .header .h-sub{font-size:12.5px;}
  .updated{font-size:12px;margin-bottom:14px;}
  .tabs{margin-bottom:14px;}
  .tabs button{flex:0 1 auto;font-size:13px;padding:9px 18px;}
  .panel{padding:16px 18px;margin-bottom:14px;}
  .field select{font-size:13px;min-height:auto;}
  .filter-row{gap:14px;}
  .filter-clear{width:auto;float:right;margin-top:0;}
  .donem-baslik{font-size:16px;}
  .view-toggle{max-width:280px;margin-bottom:14px;}
  .view-toggle button{font-size:13px;}
  .desktop-table{display:block;}
  .mobile-cards{display:none;}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><div class="msg">YÜKLENİYOR…</div></div>
</div>

<button class="asistan-fab" id="asistanFab" aria-label="Sanal Asistan"><span class="ico">🕵️</span><span class="txt">Şakir'e Sor</span><span class="dot"></span></button>
<div class="asistan-backdrop" id="asistanBackdrop"></div>
<div class="asistan-panel" id="asistanPanel">
  <div class="asistan-head">
    <div class="av">🕵️</div>
    <div class="tit">
      <div class="t1">SANAL ASİSTAN</div>
      <div class="t2">Nöbet programınızla ilgili sorun</div>
    </div>
    <button class="asistan-close" id="asistanClose">✕</button>
  </div>
  <div class="asistan-body" id="asistanBody"></div>
  <div class="asistan-inputrow">
    <input type="text" id="asistanInput" placeholder="Bir soru yazın…">
    <button id="asistanGonder" aria-label="Gönder">➤</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBUOA8oDCVkZtKmqgynjsYBHlIZEM2cCTs",
  authDomain: "nobet-programi-d0ada.firebaseapp.com",
  databaseURL: "https://nobet-programi-d0ada-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "nobet-programi-d0ada",
  storageBucket: "nobet-programi-d0ada.firebasestorage.app",
  messagingSenderId: "799459966173",
  appId: "1:799459966173:web:05528e0fe25f184cc02f34",
  measurementId: "G-EX3WRN0KF3"
};
firebase.initializeApp(firebaseConfig);
const fbDb = firebase.database();

const GUNLER = ['PAZARTESİ','SALI','ÇARŞAMBA','PERŞEMBE','CUMA'];
const GRUP_ETIKET = {sabah:'SABAHÇI GRUBU', oglen:'ÖĞLENCİ GRUBU'};

let veri = null;
let aktifGrup = 'sabah';
let aktifAyIdx = 0;
let filtreYer = '';
let filtreOgretmen = '';
let gorunum = 'program'; // 'program' | 'istatistik'
let istatistikArama = '';

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','&':'&amp;'}[c])); }

function formatTarih(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.toLocaleString('tr-TR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
}

function formatDateTR(dateStr){
  if(!dateStr) return '';
  const p = dateStr.split('-');
  if(p.length !== 3) return dateStr;
  return p[2] + '.' + p[1] + '.' + p[0];
}

function ogretmenAd(grup, id){
  const list = (veri.ogretmenler && veri.ogretmenler[grup]) || [];
  const o = list.find(x=>x.id===id);
  return o ? esc(o.ad) : '';
}

function renderHucre(ids, grup){
  const names = (ids||[]).map(id=>({id, ad:ogretmenAd(grup, id)})).filter(x=>x.ad);
  if(!names.length) return '<span class="empty">&mdash;</span>';
  return names.map(n=>{
    const eslesti = filtreOgretmen && n.id === filtreOgretmen;
    return `<div class="${eslesti ? 'cell-match' : (filtreOgretmen ? 'cell-dim' : '')}">${n.ad}</div>`;
  }).join('');
}

// Bugünün tarihine en yakın / içinde bulunulan ayı bulur; yoksa son ayı döner.
function varsayilanAyIdx(aylar){
  if(!aylar || !aylar.length) return 0;
  const bugun = new Date(); bugun.setHours(0,0,0,0);
  for(let i=0;i<aylar.length;i++){
    const bit = aylar[i].bitisTarihi ? new Date(aylar[i].bitisTarihi) : null;
    if(bit && bit >= bugun) return i;
  }
  return aylar.length - 1;
}

function renderAyIcerik(ay, grup){
  const yerler = veri.yerler || [];

  const rows = yerler.map(y=>{
    const gizli = filtreYer && y.id !== filtreYer;
    const cells = GUNLER.map(g=>{
      const ids = ay.tablo && ay.tablo[y.id] ? ay.tablo[y.id][g] : [];
      return `<td>${renderHucre(ids, grup)}</td>`;
    }).join('');
    return `<tr style="${gizli ? 'display:none;' : ''}"><td class="yer">${esc(y.ad)}</td>${cells}</tr>`;
  }).join('');

  const yerBloklari = yerler.map(y=>{
    const gizli = filtreYer && y.id !== filtreYer;
    const icerirMi = filtreOgretmen && GUNLER.some(g=>{
      const ids = (ay.tablo && ay.tablo[y.id] ? ay.tablo[y.id][g] : []) || [];
      return ids.includes(filtreOgretmen);
    });
    const acik = !!filtreYer || icerirMi;
    const gunSatirlari = GUNLER.map(g=>{
      const ids = ay.tablo && ay.tablo[y.id] ? ay.tablo[y.id][g] : [];
      return `<div class="day-row"><div class="day-label">${g}</div><div class="day-names">${renderHucre(ids, grup)}</div></div>`;
    }).join('');
    return `<div class="yer-block ${gizli ? 'yer-hidden' : ''} ${acik ? 'expanded' : ''}">
      <div class="yer-block-title" data-toggle="1">${esc(y.ad)}<span class="chevron">▾</span></div>
      ${gunSatirlari}
    </div>`;
  }).join('');

  const tarihAraligi = (ay.baslangicTarihi && ay.bitisTarihi)
    ? (formatDateTR(ay.baslangicTarihi) + ' – ' + formatDateTR(ay.bitisTarihi))
    : '';

  return `
    <div class="donem-baslik">${esc((ay.ayEtiket || '').replace(/\s*\d{4}$/, ''))} PROGRAMI${tarihAraligi ? ' (' + tarihAraligi + ')' : ''}</div>
    <div class="mobile-cards">${yerBloklari}</div>
    <div class="desktop-table">
    <table class="data">
      <tr><th>NÖBET YERİ</th>${GUNLER.map(g=>`<th>${g}</th>`).join('')}</tr>
      ${rows}
    </table>
    </div>`;
}

// Tüm yayınlanmış dönemlerdeki (ay tekrar etmeyecek şekilde) nöbet
// sayılarını öğretmen bazında toplar — gün ve yer kırılımıyla birlikte.
function hesaplaIstatistik(grup){
  const teachers = (veri.ogretmenler && veri.ogretmenler[grup]) || [];
  const yerler = veri.yerler || [];
  const donemler = (veri.dagitimlar && veri.dagitimlar[grup]) || [];

  const uniqueAylarMap = {};
  donemler.forEach(b=>{
    (b.aylar || []).forEach(ay=>{ uniqueAylarMap[ay.ay] = ay; });
  });
  const uniqueAylar = Object.values(uniqueAylarMap);

  const stats = {};
  teachers.forEach(t=>{
    stats[t.id] = { id:t.id, ad:t.ad, total:0, days:{PAZARTESİ:0,SALI:0,ÇARŞAMBA:0,PERŞEMBE:0,CUMA:0}, places:{} };
    yerler.forEach(y=>{ stats[t.id].places[y.id] = 0; });
  });

  uniqueAylar.forEach(ay=>{
    Object.keys(ay.tablo || {}).forEach(yId=>{
      GUNLER.forEach(g=>{
        (ay.tablo[yId][g] || []).forEach(tId=>{
          if(stats[tId]){
            stats[tId].total++;
            stats[tId].days[g] = (stats[tId].days[g] || 0) + 1;
            stats[tId].places[yId] = (stats[tId].places[yId] || 0) + 1;
          }
        });
      });
    });
  });

  return { list: Object.values(stats), donemSayisi: uniqueAylar.length };
}

function renderIstatistikIcerik(grup){
  const { list, donemSayisi } = hesaplaIstatistik(grup);
  const yerler = veri.yerler || [];

  if(!donemSayisi || !list.length){
    return '<div class="msg">BU GRUP İÇİN HENÜZ İSTATİSTİK OLUŞTURACAK YAYINLANMIŞ DÖNEM YOK.</div>';
  }

  const totals = list.map(s=>s.total).filter(n=>n>0);
  const maxTotal = totals.length ? Math.max(...totals) : 0;
  const avgTotal = totals.length ? (totals.reduce((a,b)=>a+b,0) / totals.length) : 0;

  const sorted = list.slice().sort((a,b)=>a.ad.localeCompare(b.ad,'tr'));

  const rowsMobile = sorted.map(s=>{
    let cls = '';
    if(avgTotal>0 && s.total>0){
      if(s.total >= avgTotal*1.25) cls = 'stat-high';
      else if(s.total <= avgTotal*0.75) cls = 'stat-low';
    }
    const barPct = maxTotal>0 ? Math.round((s.total/maxTotal)*100) : 0;
    const eslesti = filtreOgretmen && s.id === filtreOgretmen;
    const dayPills = GUNLER.map(g=>`<span class="stat-pill">${g.slice(0,3)}: ${s.days[g]||0}</span>`).join('');
    const placePills = yerler.map(y=>`<span class="stat-pill">${esc(y.ad)}: ${s.places[y.id]||0}</span>`).join('');
    return `<div class="stat-row ${eslesti?'expanded':''}" data-ad="${esc(s.ad.toLocaleLowerCase('tr'))}">
      <div class="stat-row-head">
        <div style="flex:1;">
          <div class="stat-ad">${esc(s.ad)}</div>
          <div class="stat-bar-track"><div class="stat-bar-fill ${cls}" style="width:${barPct}%"></div></div>
        </div>
        <div class="stat-num ${cls}">${s.total}</div>
      </div>
      <div class="stat-row-body">
        <div class="stat-pill-group">
          <div class="stat-pill-group-title">GÜN DAĞILIMI</div>
          ${dayPills}
        </div>
        <div class="stat-pill-group">
          <div class="stat-pill-group-title">YER DAĞILIMI</div>
          ${placePills}
        </div>
      </div>
    </div>`;
  }).join('');

  const rowsDesktop = sorted.map(s=>{
    let cls = '';
    if(avgTotal>0 && s.total>0){
      if(s.total >= avgTotal*1.25) cls = 'stat-high';
      else if(s.total <= avgTotal*0.75) cls = 'stat-low';
    }
    const barPct = maxTotal>0 ? Math.round((s.total/maxTotal)*100) : 0;
    const dayPills = GUNLER.map(g=>`<span class="stat-pill">${g.slice(0,3)}: ${s.days[g]||0}</span>`).join('');
    const placePills = yerler.map(y=>`<span class="stat-pill">${esc(y.ad)}: ${s.places[y.id]||0}</span>`).join('');
    return `<tr data-ad="${esc(s.ad.toLocaleLowerCase('tr'))}">
      <td style="text-align:left;font-weight:700;">${esc(s.ad)}</td>
      <td class="stat-num-cell ${cls}">
        ${s.total}
        <div class="stat-bar-track"><div class="stat-bar-fill ${cls}" style="width:${barPct}%"></div></div>
      </td>
      <td>${dayPills}</td>
      <td>${placePills}</td>
    </tr>`;
  }).join('');

  return `
    <div class="donem-baslik">NÖBET DAĞITIM İSTATİSTİKLERİ</div>
    <input type="text" id="statAramaInput" class="stat-search" placeholder="ÖĞRETMEN ARA…" value="${esc(istatistikArama)}">
    <div class="stat-legend mobile-cards">İSİMLERİN ÜZERİNE DOKUNARAK GÜN VE YER DAĞILIMINI GÖREBİLİRSİNİZ.</div>
    <div class="stat-legend desktop-table">${donemSayisi} DÖNEM ÜZERİNDEN TOPLAM NÖBET SAYILARI.</div>
    <div id="statSonucYok" class="msg" style="display:none;padding:16px;">EŞLEŞEN ÖĞRETMEN BULUNAMADI.</div>
    <div class="mobile-cards">${rowsMobile}</div>
    <div class="desktop-table">
    <table class="data">
      <tr><th>ÖĞRETMEN ADI</th><th>TOPLAM NÖBET</th><th>GÜN DAĞILIMI</th><th>YER DAĞILIMI</th></tr>
      ${rowsDesktop}
    </table>
    </div>`;
}

function render(){
  const app = document.getElementById('app');
  if(!veri || !veri.dagitimlar){
    app.innerHTML = '<div class="msg">HENÜZ YAYINLANMIŞ BİR NÖBET ÇİZELGESİ YOK.</div>';
    return;
  }

  const kurum = veri.kurum || {};
  const donemler = (veri.dagitimlar[aktifGrup] || []);
  const sonDonem = donemler.length ? donemler[donemler.length - 1] : null;
  const aylar = sonDonem ? (sonDonem.aylar || []) : [];
  if(aktifAyIdx >= aylar.length) aktifAyIdx = 0;

  const headerHtml = `
    <div class="header">
      ${kurum.logo ? `<img src="${kurum.logo}" alt="Logo">` : ''}
      <div>
        <div class="h-title">${esc(kurum.ad || 'NÖBET ÇİZELGESİ')}</div>
        <div class="h-sub">${esc(kurum.altBaslik || '')}</div>
      </div>
    </div>`;

  const guncellemeHtml = `<div class="updated"><span>SON YAYIN: ${formatTarih(veri.yayinTarihi)}</span><button class="refresh" id="btnYenile">YENİLE</button></div>`;

  const tabsHtml = `
    <div class="tabs">
      <button data-grup="sabah" class="${aktifGrup==='sabah'?'active':''}">${GRUP_ETIKET.sabah}</button>
      <button data-grup="oglen" class="${aktifGrup==='oglen'?'active':''}">${GRUP_ETIKET.oglen}</button>
    </div>`;

  const viewTabsHtml = `
    <div class="view-toggle-label">GÖRÜNÜM</div>
    <div class="view-toggle">
      <button data-view="program" class="${gorunum==='program'?'active':''}">📋 PROGRAM</button>
      <button data-view="istatistik" class="${gorunum==='istatistik'?'active':''}">📊 İSTATİSTİKLER</button>
    </div>`;

  if(gorunum==='istatistik'){
    app.innerHTML = headerHtml + guncellemeHtml + tabsHtml + viewTabsHtml + renderIstatistikIcerik(aktifGrup);
    document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ aktifGrup=b.dataset.grup; filtreYer=''; filtreOgretmen=''; istatistikArama=''; render(); });
    document.querySelectorAll('.view-toggle button').forEach(b=>b.onclick=()=>{ gorunum=b.dataset.view; render(); });
    const bY = document.getElementById('btnYenile'); if(bY) bY.onclick = yukle;
    document.querySelectorAll('.stat-row-head').forEach(t=>t.onclick=()=>{ t.parentElement.classList.toggle('expanded'); });
    const statArama = document.getElementById('statAramaInput');
    if(statArama) statArama.oninput = ()=>{
      istatistikArama = statArama.value;
      const q = istatistikArama.toLocaleLowerCase('tr').trim();
      let eslesenSayi = 0;
      document.querySelectorAll('.stat-row, table.data tr[data-ad]').forEach(el=>{
        const ad = el.dataset.ad || '';
        const uyar = !q || ad.includes(q);
        el.style.display = uyar ? '' : 'none';
        if(uyar) eslesenSayi++;
      });
      const sonucYok = document.getElementById('statSonucYok');
      if(sonucYok) sonucYok.style.display = (q && eslesenSayi===0) ? '' : 'none';
    };
    return;
  }

  if(!aylar.length){
    app.innerHTML = headerHtml + guncellemeHtml + tabsHtml + viewTabsHtml + '<div class="msg">BU GRUP İÇİN HENÜZ YAYINLANMIŞ BİR PROGRAM YOK.</div>';
    document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ aktifGrup=b.dataset.grup; aktifAyIdx=0; filtreYer=''; filtreOgretmen=''; render(); });
    document.querySelectorAll('.view-toggle button').forEach(b=>b.onclick=()=>{ gorunum=b.dataset.view; render(); });
    const bY = document.getElementById('btnYenile'); if(bY) bY.onclick = yukle;
    return;
  }

  const yerler = veri.yerler || [];
  const ogretmenler = (veri.ogretmenler && veri.ogretmenler[aktifGrup]) || [];

  const panelHtml = `
    <div class="panel">
      <div class="field">
        <label>AY SEÇİN</label>
        <select id="aySel" class="ay-select">
          ${aylar.map((a,i)=>`<option value="${i}" ${i===aktifAyIdx?'selected':''}>${esc((a.ayEtiket||'').replace(/\s*\d{4}$/, ''))} PROGRAMI</option>`).join('')}
        </select>
      </div>
      <div class="field filter-row">
        <div class="field">
          <label>ÖĞRETMEN</label>
          <select id="filtreOgretmenSel">
            <option value="">TÜMÜ</option>
            ${ogretmenler.map(o=>`<option value="${o.id}" ${o.id===filtreOgretmen?'selected':''}>${esc(o.ad)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>NÖBET YERİ</label>
          <select id="filtreYerSel">
            <option value="">TÜMÜ</option>
            ${yerler.map(y=>`<option value="${y.id}" ${y.id===filtreYer?'selected':''}>${esc(y.ad)}</option>`).join('')}
          </select>
        </div>
      </div>
      ${(filtreYer || filtreOgretmen) ? `<button class="filter-clear" id="btnFiltreTemizle">FİLTREYİ TEMİZLE</button>` : ''}
    </div>`;

  const ayIcerikHtml = renderAyIcerik(aylar[aktifAyIdx], aktifGrup);

  app.innerHTML = headerHtml + guncellemeHtml + tabsHtml + viewTabsHtml + panelHtml + ayIcerikHtml;

  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
    aktifGrup = b.dataset.grup;
    aktifAyIdx = 0;
    filtreYer = '';
    filtreOgretmen = '';
    render();
  });
  document.querySelectorAll('.view-toggle button').forEach(b=>b.onclick=()=>{ gorunum=b.dataset.view; render(); });
  const btnYenile = document.getElementById('btnYenile');
  if(btnYenile) btnYenile.onclick = yukle;

  const aySel = document.getElementById('aySel');
  if(aySel) aySel.onchange = ()=>{ aktifAyIdx = Number(aySel.value); render(); };
  const selOgretmen = document.getElementById('filtreOgretmenSel');
  if(selOgretmen) selOgretmen.onchange = ()=>{ filtreOgretmen = selOgretmen.value; render(); };
  const selYer = document.getElementById('filtreYerSel');
  if(selYer) selYer.onchange = ()=>{ filtreYer = selYer.value; render(); };
  const btnTemizle = document.getElementById('btnFiltreTemizle');
  if(btnTemizle) btnTemizle.onclick = ()=>{ filtreYer=''; filtreOgretmen=''; render(); };

  document.querySelectorAll('.yer-block-title').forEach(t=>t.onclick=()=>{
    t.parentElement.classList.toggle('expanded');
  });
}

function yukle(){
  document.getElementById('app').innerHTML = '<div class="msg">YÜKLENİYOR…</div>';
  fbDb.ref('nobetListesi').once('value')
    .then(snap=>{
      veri = snap.val();
      const donemler = veri && veri.dagitimlar ? (veri.dagitimlar[aktifGrup] || []) : [];
      const sonDonem = donemler.length ? donemler[donemler.length - 1] : null;
      aktifAyIdx = sonDonem ? varsayilanAyIdx(sonDonem.aylar || []) : 0;
      render();
      asistanIlkYuklemeyiIsaretle();
    })
    .catch(err=>{
      document.getElementById('app').innerHTML = '<div class="msg">VERİ YÜKLENEMEDİ: ' + esc(err.message) + '</div>';
    });
}

/* ==============================================================
 * asistan.js — Kural tabanlı "sanal asistan": öğretmenlerin sıkça
 * sorduğu soruları (bugün/yarın kim nöbetçi, filanca öğretmen ne
 * zaman nöbetçi, en çok kim nöbet tuttu, filtre nasıl çalışır vb.)
 * doğrudan yayınlanmış veriden (veri objesi) yanıtlar. Sunucu/LLM
 * çağrısı yapmaz — tamamen istemci tarafında çalışır.
 * ============================================================== */

let asistanAcikMi = false;
let asistanOtoAcildi = false;
const asistanGunSira = ['PAZAR','PAZARTESİ','SALI','ÇARŞAMBA','PERŞEMBE','CUMA','CUMARTESİ'];

function asistanIlkYuklemeyiIsaretle(){
  if(asistanOtoAcildi) return;
  asistanOtoAcildi = true;
  // Mobilde (dar ekran) sayfa açılır açılmaz asistanı otomatik açmıyoruz —
  // sadece sağ alttaki "Şakir'e Sor" baloncuğu duruyor, dokununca açılır.
  if(window.innerWidth < 640) return;
  setTimeout(()=>{ asistanAc(true); }, 400);
}

function asistanNormalize(s){
  return (s||'').toLocaleUpperCase('tr').replace(/İ/g,'İ').trim();
}

function asistanBugun(ofsetGun){
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + (ofsetGun||0));
  return d;
}

function asistanGunAdi(tarih){
  return asistanGunSira[tarih.getDay()];
}

// Verilen tarihin, bir grubun SON kaydedilen döneminde hangi aya denk
// geldiğini bulur (ay.baslangicTarihi/bitisTarihi aralığına göre).
function asistanTarihinAyi(grup, tarih){
  const donemler = (veri.dagitimlar && veri.dagitimlar[grup]) || [];
  const sonDonem = donemler.length ? donemler[donemler.length-1] : null;
  if(!sonDonem) return null;
  const iso = tarih.toISOString().slice(0,10);
  return (sonDonem.aylar||[]).find(ay=>ay.baslangicTarihi && ay.bitisTarihi && iso>=ay.baslangicTarihi && iso<=ay.bitisTarihi) || null;
}

function asistanAktifAy(grup){
  const donemler = (veri.dagitimlar && veri.dagitimlar[grup]) || [];
  const sonDonem = donemler.length ? donemler[donemler.length-1] : null;
  if(!sonDonem || !sonDonem.aylar || !sonDonem.aylar.length) return null;
  return sonDonem.aylar[varsayilanAyIdx(sonDonem.aylar)];
}

const ASISTAN_AY_ADLARI = ['OCAK','ŞUBAT','MART','NİSAN','MAYIS','HAZİRAN','TEMMUZ','AĞUSTOS','EYLÜL','EKİM','KASIM','ARALIK'];

// Soruda bir ay adı (ör. "KASIM") geçiyorsa, o grubun SON kaydedilen
// döneminde adı o ayla başlayan ayı bulur (ör. "KASIM 2026 PROGRAMI").
// Ay adı geçmiyorsa null döner (çağıran taraf o zaman "aktif ay"ı kullanır).
function asistanAySorudanBul(grup, soru){
  const bulunanAdlar = ASISTAN_AY_ADLARI.filter(ad=>soru.includes(ad));
  if(!bulunanAdlar.length) return null;
  const ayAdi = bulunanAdlar.sort((a,b)=>b.length-a.length)[0];
  const donemler = (veri.dagitimlar && veri.dagitimlar[grup]) || [];
  const sonDonem = donemler.length ? donemler[donemler.length-1] : null;
  if(!sonDonem) return null;
  return (sonDonem.aylar||[]).find(ay=>asistanNormalize(ay.ayEtiket||'').startsWith(ayAdi)) || 'YOK';
}

// Bir soru için hangi ayın kullanılacağını belirler: önce soruda geçen
// ay adına bakar, yoksa "aktif/güncel ay"a düşer. Soruda ay adı geçip de
// o dönemde öyle bir ay bulunamazsa 'YOK' işaretini yukarı taşır.
function asistanIlgiliAy(grup, soru){
  const soruAyi = asistanAySorudanBul(grup, soru);
  if(soruAyi === 'YOK') return null;
  if(soruAyi) return soruAyi;
  return asistanAktifAy(grup);
}

// Soruda bir gün adı (PAZARTESİ, SALI, ...) geçiyorsa onu döner.
function asistanGunSorudanBul(soru){
  return GUNLER.find(g=>soru.includes(g)) || null;
}

function asistanGrupBelirle(soru){
  if(soru.includes('ÖĞLEN') || soru.includes('ÖĞLE')) return 'oglen';
  if(soru.includes('SABAH')) return 'sabah';
  return null;
}

function asistanYerBul(soru){
  const yerler = veri.yerler || [];
  return yerler.find(y=>soru.includes(asistanNormalize(y.ad)));
}

// Sorudaki metinde geçen bir öğretmen adını (her iki grupta da) arar.
// Tam ad geçiyorsa onu, yoksa soyadı/parça eşleşen ilk kişiyi döner.
function asistanOgretmenBul(soru){
  const adaylar = [];
  ['sabah','oglen'].forEach(grup=>{
    ((veri.ogretmenler && veri.ogretmenler[grup]) || []).forEach(o=>{
      const ad = asistanNormalize(o.ad);
      if(soru.includes(ad)) adaylar.push({grup, id:o.id, ad:o.ad, uzunluk:ad.length});
    });
  });
  if(!adaylar.length) return null;
  adaylar.sort((a,b)=>b.uzunluk-a.uzunluk);
  return adaylar[0];
}

function asistanOgretmenProgramCevap(kisi, soru){
  soru = soru || '';

  // "BÜTÜN / TÜM NÖBETLERİNİ" gibi ifadeler geçiyorsa, tek bir aya değil,
  // yayınlanmış SON DÖNEMİN tüm aylarına bakılır.
  const tumDonemIstendi = (soru.includes('BÜTÜN') || soru.includes('TÜM')) && !asistanAySorudanBul(kisi.grup, soru);
  if(tumDonemIstendi){
    const donemler = (veri.dagitimlar && veri.dagitimlar[kisi.grup]) || [];
    const sonDonem = donemler.length ? donemler[donemler.length-1] : null;
    if(!sonDonem || !sonDonem.aylar || !sonDonem.aylar.length){
      return kisi.ad + ' için yayınlanmış bir program bulamadım.';
    }
    const satirlar = [];
    sonDonem.aylar.forEach(ay=>{
      const ayAdi = (ay.ayEtiket||'').replace(/\s*\d{4}$/, '');
      const buAy = [];
      (veri.yerler||[]).forEach(y=>{
        GUNLER.forEach(g=>{
          const ids = (ay.tablo && ay.tablo[y.id] && ay.tablo[y.id][g]) || [];
          if(ids.includes(kisi.id)) buAy.push(g + ' — ' + y.ad);
        });
      });
      if(buAy.length) satirlar.push(ayAdi + ':\n' + buAy.map(b=>'  • ' + b).join('\n'));
    });
    if(!satirlar.length){
      return kisi.ad + ', yayınlanmış hiçbir dönemde nöbet listesinde görünmüyor.';
    }
    return kisi.ad + ' (' + GRUP_ETIKET[kisi.grup] + ') — TÜM DÖNEM NÖBETLERİ:\n\n' + satirlar.join('\n\n');
  }

  const ay = asistanIlgiliAy(kisi.grup, soru);
  if(ay === null && asistanAySorudanBul(kisi.grup, soru) === 'YOK'){
    return 'Sorduğunuz aya ait yayınlanmış bir dönem bulamadım.';
  }
  if(!ay) return kisi.ad + ' için yayınlanmış bir program bulamadım.';
  const gunFiltre = asistanGunSorudanBul(soru);
  const bulunanlar = [];
  (veri.yerler||[]).forEach(y=>{
    (gunFiltre ? [gunFiltre] : GUNLER).forEach(g=>{
      const ids = (ay.tablo && ay.tablo[y.id] && ay.tablo[y.id][g]) || [];
      if(ids.includes(kisi.id)) bulunanlar.push(g + ' — ' + y.ad);
    });
  });
  const ayAdi = (ay.ayEtiket||'').replace(/\s*\d{4}$/, '');
  if(!bulunanlar.length){
    return kisi.ad + ', ' + ayAdi + (gunFiltre ? ' ' + gunFiltre : '') + ' için nöbet listesinde görünmüyor (izinli/muaf olabilir).';
  }
  return kisi.ad + ' (' + GRUP_ETIKET[kisi.grup] + ') — ' + ayAdi + ' PROGRAMI:\n' + bulunanlar.map(b=>'• ' + b).join('\n');
}

function asistanGunSorgusuCevap(soru, ofset){
  const grup = asistanGrupBelirle(soru) || aktifGrup;
  const tarih = asistanBugun(ofset);
  const gun = asistanGunAdi(tarih);
  const etiket = ofset < 0 ? 'DÜN' : (ofset > 0 ? 'YARIN' : 'BUGÜN');
  if(gun === 'CUMARTESİ' || gun === 'PAZAR'){
    return etiket.charAt(0) + etiket.slice(1).toLocaleLowerCase('tr') + ' hafta sonu, nöbet yazılmıyor.';
  }
  const ay = asistanTarihinAyi(grup, tarih);
  if(!ay){
    return etiket.charAt(0) + etiket.slice(1).toLocaleLowerCase('tr') + ' için yayınlanmış bir program bulamadım (dönem dışında olabilir).';
  }
  const yer = asistanYerBul(soru);
  const yerler = yer ? [yer] : (veri.yerler||[]);
  const satirlar = yerler.map(y=>{
    const ids = (ay.tablo && ay.tablo[y.id] && ay.tablo[y.id][gun]) || [];
    const adlar = ids.map(id=>ogretmenAd(grup, id)).filter(Boolean);
    return '• ' + y.ad + ': ' + (adlar.length ? adlar.join(', ') : '—');
  });
  return etiket + ' (' + gun + ', ' + GRUP_ETIKET[grup] + '):\n' + satirlar.join('\n');
}

function asistanYerProgramCevap(yer, soru){
  const grup = asistanGrupBelirle(soru) || aktifGrup;
  const ay = asistanIlgiliAy(grup, soru);
  if(ay === null && asistanAySorudanBul(grup, soru) === 'YOK'){
    return 'Sorduğunuz aya ait yayınlanmış bir dönem bulamadım.';
  }
  if(!ay) return yer.ad + ' için yayınlanmış bir program bulamadım.';
  const ayAdi = (ay.ayEtiket||'').replace(/\s*\d{4}$/, '');
  const gunFiltre = asistanGunSorudanBul(soru);
  const satirlar = (gunFiltre ? [gunFiltre] : GUNLER).map(g=>{
    const ids = (ay.tablo && ay.tablo[yer.id] && ay.tablo[yer.id][g]) || [];
    const adlar = ids.map(id=>ogretmenAd(grup, id)).filter(Boolean);
    return '• ' + g + ': ' + (adlar.length ? adlar.join(', ') : '—');
  });
  return yer.ad + ' (' + GRUP_ETIKET[grup] + ') — ' + ayAdi + ':\n' + satirlar.join('\n');
}

// "Bu hafta kim nöbetçi?" — belirli bir yer verilmemişse TÜM yerlerin,
// o haftaki (=ilgili ayın haftalık deseni) programını listeler.
function asistanHaftaCevap(soru){
  const grup = asistanGrupBelirle(soru) || aktifGrup;
  const ay = asistanIlgiliAy(grup, soru);
  if(ay === null && asistanAySorudanBul(grup, soru) === 'YOK'){
    return 'Sorduğunuz aya ait yayınlanmış bir dönem bulamadım.';
  }
  if(!ay) return 'Bu hafta için yayınlanmış bir program bulamadım.';
  const ayAdi = (ay.ayEtiket||'').replace(/\s*\d{4}$/, '');
  const yer = asistanYerBul(soru);
  const yerler = yer ? [yer] : (veri.yerler||[]);
  const satirlar = yerler.map(y=>{
    const gunler = GUNLER.map(g=>{
      const ids = (ay.tablo && ay.tablo[y.id] && ay.tablo[y.id][g]) || [];
      const adlar = ids.map(id=>ogretmenAd(grup, id)).filter(Boolean);
      return g.slice(0,3) + ': ' + (adlar.length ? adlar.join(', ') : '—');
    }).join(' | ');
    return '• ' + y.ad + '\n   ' + gunler;
  });
  return 'BU HAFTA (' + ayAdi + ' PROGRAMI, ' + GRUP_ETIKET[grup] + '):\n' + satirlar.join('\n');
}

// "15 Ekim'de kim nöbetçi?" gibi belirli bir takvim tarihini soran
// sorularda, sorudaki gün numarası + ay adını bulup gerçek tarihe çevirir.
function asistanBelirliTarihCevap(soru){
  const m = soru.match(new RegExp('(\\d{1,2})\\.?\\s*(' + ASISTAN_AY_ADLARI.join('|') + ')')) ||
            soru.match(new RegExp('(' + ASISTAN_AY_ADLARI.join('|') + ')\\s*(\\d{1,2})'));
  if(!m) return null;
  const gunNo = parseInt(m[1].match(/^\d+$/) ? m[1] : m[2], 10);
  const ayAdi = m[1].match(/^\d+$/) ? m[2] : m[1];
  if(!gunNo || gunNo < 1 || gunNo > 31) return null;

  const grup = asistanGrupBelirle(soru) || aktifGrup;
  const donemler = (veri.dagitimlar && veri.dagitimlar[grup]) || [];
  const sonDonem = donemler.length ? donemler[donemler.length-1] : null;
  if(!sonDonem) return 'Yayınlanmış bir program bulamadım.';
  const ay = (sonDonem.aylar||[]).find(a=>asistanNormalize(a.ayEtiket||'').startsWith(ayAdi));
  if(!ay) return 'Sorduğunuz aya ait yayınlanmış bir dönem bulamadım.';

  const yil = (ay.baslangicTarihi||'').slice(0,4);
  const ayNo = (ay.baslangicTarihi||'').slice(5,7);
  const iso = yil + '-' + ayNo + '-' + String(gunNo).padStart(2,'0');
  const tarih = new Date(iso + 'T00:00:00');
  if(isNaN(tarih)) return null;
  if(iso < ay.baslangicTarihi || iso > ay.bitisTarihi){
    return formatDateTR(iso) + ' tarihi, ' + (ay.ayEtiket||'').replace(/\s*\d{4}$/, '') + ' döneminin dışında kalıyor.';
  }
  const gun = asistanGunAdi(tarih);
  if(gun === 'CUMARTESİ' || gun === 'PAZAR'){
    return formatDateTR(iso) + ' (' + gun + ') hafta sonu, nöbet yazılmıyor.';
  }
  const yer = asistanYerBul(soru);
  const yerler = yer ? [yer] : (veri.yerler||[]);
  const satirlar = yerler.map(y=>{
    const ids = (ay.tablo && ay.tablo[y.id] && ay.tablo[y.id][gun]) || [];
    const adlar = ids.map(id=>ogretmenAd(grup, id)).filter(Boolean);
    return '• ' + y.ad + ': ' + (adlar.length ? adlar.join(', ') : '—');
  });
  return formatDateTR(iso) + ' (' + gun + ', ' + GRUP_ETIKET[grup] + '):\n' + satirlar.join('\n');
}

function asistanIstatistikCevap(soru){
  const grup = asistanGrupBelirle(soru) || aktifGrup;
  const {list, donemSayisi} = hesaplaIstatistik(grup);
  if(!donemSayisi || !list.length) return 'Bu grup için henüz istatistik oluşturacak yayınlanmış dönem yok.';
  const sirali = list.slice().sort((a,b)=> soru.includes('AZ') ? a.total-b.total : b.total-a.total);
  const ilk3 = sirali.slice(0,3).filter(s=>s.total>0 || sirali.length<=3);
  const baslik = soru.includes('AZ') ? 'EN AZ NÖBET TUTANLAR' : 'EN ÇOK NÖBET TUTANLAR';
  return baslik + ' (' + GRUP_ETIKET[grup] + ', ' + donemSayisi + ' dönem):\n' + ilk3.map((s,i)=>(i+1)+'. '+s.ad+' — '+s.total+' nöbet').join('\n');
}

// "Ayşe kaç kez nöbet tuttu?" — tek bir kişinin toplam sayısı + kırılımı.
function asistanKacKezCevap(kisi){
  const {list, donemSayisi} = hesaplaIstatistik(kisi.grup);
  if(!donemSayisi) return kisi.ad + ' için henüz istatistik oluşturacak yayınlanmış dönem yok.';
  const s = list.find(x=>x.id===kisi.id);
  if(!s || !s.total) return kisi.ad + ', yayınlanmış ' + donemSayisi + ' dönem boyunca hiç nöbet listesinde görünmüyor.';
  const gunler = GUNLER.map(g=>g.slice(0,3)+': '+(s.days[g]||0)).join(', ');
  const yerler = (veri.yerler||[]).map(y=>y.ad+': '+(s.places[y.id]||0)).filter(x=>!x.endsWith(': 0')).join(', ');
  return kisi.ad + ', yayınlanmış ' + donemSayisi + ' dönem boyunca toplam ' + s.total + ' kez nöbet tutmuş.\nGün dağılımı: ' + gunler + (yerler ? '\nYer dağılımı: ' + yerler : '');
}

// "Hangi gün en çok/az nöbet var?" — ilgili ayın haftalık deseninde,
// günlere göre toplam nöbetçi sayısını karşılaştırır.
function asistanGunBazliYukCevap(soru){
  const grup = asistanGrupBelirle(soru) || aktifGrup;
  const ay = asistanIlgiliAy(grup, soru);
  if(!ay) return 'Bu grup için yayınlanmış bir program bulamadım.';
  const sayaclar = GUNLER.map(g=>{
    let toplam = 0;
    (veri.yerler||[]).forEach(y=>{ toplam += ((ay.tablo && ay.tablo[y.id] && ay.tablo[y.id][g]) || []).length; });
    return {gun:g, toplam};
  });
  sayaclar.sort((a,b)=> soru.includes('AZ') ? a.toplam-b.toplam : b.toplam-a.toplam);
  const ayAdi = (ay.ayEtiket||'').replace(/\s*\d{4}$/, '');
  const baslik = soru.includes('AZ') ? 'EN AZ NÖBETÇİ OLAN GÜN' : 'EN ÇOK NÖBETÇİ OLAN GÜN';
  return baslik + ' (' + ayAdi + ', ' + GRUP_ETIKET[grup] + '):\n' + sayaclar.map(s=>'• ' + s.gun + ': ' + s.toplam + ' nöbetçi').join('\n');
}

// "Hangi yerde en çok/az nöbet yazılmış?" — TÜM yayınlanmış dönem boyunca
// (hesaplaIstatistik'in "places" toplamları üzerinden) yer bazlı toplam.
function asistanYerBazliYukCevap(soru){
  const grup = asistanGrupBelirle(soru) || aktifGrup;
  const {list, donemSayisi} = hesaplaIstatistik(grup);
  if(!donemSayisi) return 'Bu grup için henüz istatistik oluşturacak yayınlanmış dönem yok.';
  const toplamlar = (veri.yerler||[]).map(y=>{
    let toplam = 0;
    list.forEach(s=>{ toplam += (s.places[y.id]||0); });
    return {ad:y.ad, toplam};
  });
  toplamlar.sort((a,b)=> soru.includes('AZ') ? a.toplam-b.toplam : b.toplam-a.toplam);
  const baslik = soru.includes('AZ') ? 'EN AZ NÖBET YAZILAN YER' : 'EN ÇOK NÖBET YAZILAN YER';
  return baslik + ' (' + donemSayisi + ' dönem, ' + GRUP_ETIKET[grup] + '):\n' + toplamlar.map(t=>'• ' + t.ad + ': ' + t.toplam + ' nöbet').join('\n');
}

// Genel sayısal bilgiler: kaç öğretmen, kaç yer, kaç dönem, dönem ne zaman.
function asistanGenelBilgiCevap(soru){
  const grup = asistanGrupBelirle(soru) || aktifGrup;
  if(soru.includes('ÖĞRETMEN')){
    const sabah = (veri.ogretmenler && veri.ogretmenler.sabah || []).length;
    const oglen = (veri.ogretmenler && veri.ogretmenler.oglen || []).length;
    return 'SABAHÇI GRUBU: ' + sabah + ' öğretmen\nÖĞLENCİ GRUBU: ' + oglen + ' öğretmen';
  }
  if(soru.includes('YER')){
    const yerler = veri.yerler || [];
    return 'Toplam ' + yerler.length + ' nöbet yeri var: ' + yerler.map(y=>y.ad).join(', ');
  }
  if(soru.includes('DÖNEM') || soru.includes('AY ')){
    const {donemSayisi} = hesaplaIstatistik(grup);
    const ay0 = asistanAktifAy(grup);
    const donemler = (veri.dagitimlar && veri.dagitimlar[grup]) || [];
    const sonDonem = donemler.length ? donemler[donemler.length-1] : null;
    const aylar = sonDonem ? (sonDonem.aylar||[]) : [];
    if(!aylar.length) return 'Bu grup için henüz yayınlanmış bir dönem yok.';
    const ilk = aylar[0], son = aylar[aylar.length-1];
    return GRUP_ETIKET[grup] + ' için ' + aylar.length + ' aylık bir program yayınlanmış: ' +
      formatDateTR(ilk.baslangicTarihi) + ' – ' + formatDateTR(son.bitisTarihi) + '.';
  }
  return null;
}

// Sorudaki metinde geçen TÜM öğretmen adlarını (tekrarsız) bulur —
// karşılaştırma sorularında ("Ayşe mi Fatma mı daha çok nöbet tutmuş")
// kullanılır.
function asistanTumOgretmenleriBul(soru){
  const bulunanlar = [];
  ['sabah','oglen'].forEach(grup=>{
    ((veri.ogretmenler && veri.ogretmenler[grup]) || []).forEach(o=>{
      const ad = asistanNormalize(o.ad);
      if(soru.includes(ad) && !bulunanlar.some(b=>b.id===o.id)){
        bulunanlar.push({grup, id:o.id, ad:o.ad, uzunluk:ad.length});
      }
    });
  });
  return bulunanlar.sort((a,b)=>b.uzunluk-a.uzunluk);
}

function asistanKarsilastirCevap(kisiler){
  const sonuc = kisiler.map(k=>{
    const {list} = hesaplaIstatistik(k.grup);
    const s = list.find(x=>x.id===k.id);
    return {ad:k.ad, total: s ? s.total : 0};
  });
  sonuc.sort((a,b)=>b.total-a.total);
  const satirlar = sonuc.map(s=>'• ' + s.ad + ': ' + s.total + ' nöbet').join('\n');
  const kazanan = sonuc[0];
  const esitMi = sonuc.every(s=>s.total===sonuc[0].total);
  return satirlar + (esitMi ? '\n\nİkisi de eşit sayıda nöbet tutmuş.' : '\n\n' + kazanan.ad + ' daha fazla nöbet tutmuş.');
}

function asistanCevapUret(soruRaw){
  if(!veri || !veri.dagitimlar){
    return 'Henüz yayınlanmış bir nöbet programı bulamadım.';
  }
  const soru = asistanNormalize(soruRaw);

  if(soru.includes('MERHABA') || soru.includes('SELAM')){
    return 'Merhaba! Nöbet programınızla ilgili aşağıdaki gibi sorular sorabilirsiniz:\n• "Bugün/yarın/dün kim nöbetçi?"\n• "Ayşe Yılmaz ne zaman nöbetçi?"\n• "Ayşe kaç kez nöbet tuttu?"\n• "En çok nöbet tutan kim?"\n• "15 Ekim\'de kim nöbetçi?"';
  }
  if(soru.includes('TEŞEKKÜR')){
    return 'Rica ederim, başka bir sorunuz olursa buradayım. 🙂';
  }
  if(soru.includes('FİLTRE')){
    return '"PROGRAM" görünümünde, ay seçiminin altındaki ÖĞRETMEN ve NÖBET YERİ kutularından seçim yaparak listeyi daraltabilirsiniz. "FİLTREYİ TEMİZLE" ile sıfırlayabilirsiniz.';
  }
  if(soru.includes('İSTATİSTİK') && (soru.includes('NEDİR') || soru.includes('NASIL'))){
    return 'Üstteki "GÖRÜNÜM" bölümünden İSTATİSTİKLER\'e geçerek, yayınlanan tüm dönemler boyunca kimin kaç kez, hangi gün ve yerde nöbet tuttuğunu görebilirsiniz. Arama kutusuyla isim de arayabilirsiniz.';
  }
  if(soru.includes('AY SEÇ') || (soru.includes('DÖNEM') && soru.includes('NASIL'))){
    return '"AY SEÇİN" açılır menüsünden, o dönemdeki farklı ayların programını görüntüleyebilirsiniz. Sayfa açıldığında otomatik olarak içinde bulunduğunuz ay seçili gelir.';
  }
  if(soru.includes('GÜNCELLE') || soru.includes('YENİLE') || soru.includes('SON YAYIN')){
    return 'Sayfanın üst kısmındaki "YENİLE" butonuna basarak en güncel yayınlanan programı çekebilirsiniz. "SON YAYIN" yazısı, en son ne zaman güncellendiğini gösterir.';
  }
  if((soru.includes('SABAHÇI') || soru.includes('ÖĞLENCİ')) && (soru.includes('NASIL') || soru.includes('DEĞİŞ') || soru.includes('GEÇ'))){
    return 'Üstteki "SABAHÇI GRUBU" / "ÖĞLENCİ GRUBU" sekmelerine dokunarak iki grup arasında geçiş yapabilirsiniz.';
  }

  // Genel sayısal bilgiler (kaç öğretmen / kaç yer / kaç dönem / tarih aralığı)
  if(soru.includes('KAÇ') && (soru.includes('ÖĞRETMEN') || soru.includes('YER') || soru.includes('DÖNEM') || soru.includes('AY VAR'))){
    const cevap = asistanGenelBilgiCevap(soru);
    if(cevap) return cevap;
  }
  if((soru.includes('NE ZAMAN') || soru.includes('TARİH')) && soru.includes('DÖNEM')){
    const cevap = asistanGenelBilgiCevap('DÖNEM');
    if(cevap) return cevap;
  }

  // Hangi gün en çok/az nöbet var?
  if(soru.includes('GÜN') && (soru.includes('EN ÇOK') || soru.includes('EN FAZLA') || soru.includes('EN AZ')) && soru.includes('NÖBET')){
    return asistanGunBazliYukCevap(soru);
  }
  // Hangi yerde en çok/az nöbet yazılmış?
  if(soru.includes('YER') && (soru.includes('EN ÇOK') || soru.includes('EN FAZLA') || soru.includes('EN AZ')) && soru.includes('NÖBET')){
    return asistanYerBazliYukCevap(soru);
  }
  // En çok / en az nöbet tutan KİŞİ
  if((soru.includes('EN ÇOK') || soru.includes('EN FAZLA') || soru.includes('EN AZ')) && soru.includes('NÖBET')){
    return asistanIstatistikCevap(soru);
  }

  // İki (veya daha fazla) öğretmen karşılaştırması
  const cokluKisi = asistanTumOgretmenleriBul(soru);
  if(cokluKisi.length >= 2 && (soru.includes('ÇOK') || soru.includes('AZ') || soru.includes('KARŞILAŞTIR') || soru.includes(' MI ') || soru.includes(' Mİ '))){
    return asistanKarsilastirCevap(cokluKisi);
  }

  // Tek öğretmen adı geçiyor mu?
  const kisi = asistanOgretmenBul(soru);
  if(kisi){
    if(soru.includes('KAÇ')){
      return asistanKacKezCevap(kisi);
    }
    return asistanOgretmenProgramCevap(kisi, soru);
  }

  // Dün / bugün / yarın
  if(soru.includes('DÜN')) return asistanGunSorgusuCevap(soru, -1);
  if(soru.includes('YARIN')) return asistanGunSorgusuCevap(soru, 1);
  if(soru.includes('BUGÜN')) return asistanGunSorgusuCevap(soru, 0);

  // Bu hafta
  if(soru.includes('HAFTA')){
    return asistanHaftaCevap(soru);
  }

  // Belirli bir takvim tarihi (ör. "15 Ekim")
  const tarihCevabi = asistanBelirliTarihCevap(soru);
  if(tarihCevabi) return tarihCevabi;

  // Yer adı geçiyor mu? (BAHÇE, 1. KAT vb.)
  const yer = asistanYerBul(soru);
  if(yer){
    return asistanYerProgramCevap(yer, soru);
  }

  if(soru.includes('KİM') || soru.includes('NÖBET')){
    return 'Tam olarak anlayamadım. Bir öğretmen adı, bir nöbet yeri adı, bir tarih (ör. "15 Ekim") ya da "bugün/yarın/dün kim nöbetçi" gibi sorabilirsiniz. Örnekler için aşağıdaki önerilere göz atabilirsiniz.';
  }

  return 'Bunu tam olarak anlayamadım 🙂 Aşağıdaki örnek sorulardan birini deneyebilir, ya da bir öğretmen adı veya nöbet yeri adı yazabilirsiniz.';
}

function asistanOneriler(){
  return ['Bugün kim nöbetçi?','Bu hafta kim nöbetçi?','En çok nöbet tutan kim?','Kaç öğretmen var?'];
}

function asistanMesajEkle(tip, metin){
  const body = document.getElementById('asistanBody');
  if(!body) return;
  const div = document.createElement('div');
  div.className = 'asistan-msg ' + tip;
  const bubble = document.createElement('div');
  bubble.className = 'asistan-bubble';
  bubble.textContent = metin;
  div.appendChild(bubble);
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

function asistanChipleriEkle(){
  const body = document.getElementById('asistanBody');
  if(!body) return;
  const eskiler = body.querySelectorAll('.asistan-chips');
  eskiler.forEach(e=>e.remove());
  const wrap = document.createElement('div');
  wrap.className = 'asistan-chips';
  asistanOneriler().forEach(soru=>{
    const b = document.createElement('button');
    b.className = 'asistan-chip';
    b.textContent = soru;
    b.onclick = ()=> asistanSoruGonder(soru);
    wrap.appendChild(b);
  });
  body.appendChild(wrap);
  body.scrollTop = body.scrollHeight;
}

function asistanSoruGonder(soru){
  const metin = (soru||'').trim();
  if(!metin) return;
  asistanMesajEkle('user', metin);
  const input = document.getElementById('asistanInput');
  if(input) input.value = '';
  setTimeout(()=>{
    const cevap = asistanCevapUret(metin);
    asistanMesajEkle('bot', cevap);
    asistanChipleriEkle();
  }, 250);
}

// Web Speech API ile Türkçe sesli okuma — tarayıcı desteklemiyorsa
// (veya engelliyorsa) sessizce hiçbir şey yapmaz, hata vermez.
// Masaüstü ve mobil tarayıcılar farklı ses listeleri sunabiliyor; bu
// yüzden mevcut Türkçe sesler arasından (tercihen bir Google/kadın
// sesi) HEP AYNI kriterle seçim yapılıyor ki iki platformda da mümkün
// olduğunca benzer bir ses çıksın.
function asistanTurkceSesSec(){
  if(!('speechSynthesis' in window)) return null;
  const sesler = window.speechSynthesis.getVoices() || [];
  const trSesler = sesler.filter(s=>(s.lang||'').toLowerCase().startsWith('tr'));
  if(!trSesler.length) return null;
  // Öncelik sırası: Google Türkçe > adında "female/kadın" geçen > ilk Türkçe ses.
  return trSesler.find(s=>/google/i.test(s.name))
    || trSesler.find(s=>/female|kadın/i.test(s.name))
    || trSesler[0];
}

function asistanSesliOkuGercek(metin){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(metin);
    u.lang = 'tr-TR';
    u.rate = 1;
    u.pitch = 1;
    const ses = asistanTurkceSesSec();
    if(ses) u.voice = ses;
    window.speechSynthesis.speak(u);
  }catch(e){ /* sesli okuma desteklenmiyorsa sessizce geç */ }
}

function asistanSesliOku(metin){
  if(!('speechSynthesis' in window)) return;
  let okundu = false;
  const okuVeIsaretle = ()=>{ if(okundu) return; okundu = true; asistanSesliOkuGercek(metin); };
  const mevcutSesler = window.speechSynthesis.getVoices();
  if(mevcutSesler && mevcutSesler.length){
    okuVeIsaretle();
  } else {
    const dinleyici = ()=>{
      window.speechSynthesis.removeEventListener('voiceschanged', dinleyici);
      okuVeIsaretle();
    };
    window.speechSynthesis.addEventListener('voiceschanged', dinleyici);
    // Bazı tarayıcılarda 'voiceschanged' hiç tetiklenmeyebilir; güvenlik
    // amacıyla kısa bir süre sonra yine de dener (yukarıdaki bayrak
    // sayesinde iki kez okuma olmaz).
    setTimeout(()=>{
      window.speechSynthesis.removeEventListener('voiceschanged', dinleyici);
      okuVeIsaretle();
    }, 300);
  }
}

const ASISTAN_KARSILAMA_METNI = 'Merhaba! Nöbet ile ilgili sorularınızı Şakir\'e sorabilirsiniz.';
let asistanSesOkunduMu = false;

function asistanAc(otomatikMi){
  asistanAcikMi = true;
  const panel = document.getElementById('asistanPanel');
  const backdrop = document.getElementById('asistanBackdrop');
  if(panel) panel.classList.add('acik');
  if(backdrop) backdrop.classList.add('acik');
  const body = document.getElementById('asistanBody');
  if(body && !body.dataset.baslatildi){
    body.dataset.baslatildi = '1';
    asistanMesajEkle('bot', '🕵️ ' + ASISTAN_KARSILAMA_METNI);
    asistanChipleriEkle();
  }
  if(!otomatikMi){
    const input = document.getElementById('asistanInput');
    if(input) setTimeout(()=>input.focus(), 200);
  }
}

function asistanKapat(){
  asistanAcikMi = false;
  const panel = document.getElementById('asistanPanel');
  const backdrop = document.getElementById('asistanBackdrop');
  if(panel) panel.classList.remove('acik');
  if(backdrop) backdrop.classList.remove('acik');
  try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
}

document.getElementById('asistanFab').onclick = ()=> asistanAcikMi ? asistanKapat() : asistanAc(false);
document.getElementById('asistanClose').onclick = asistanKapat;
document.getElementById('asistanBackdrop').onclick = asistanKapat;
document.getElementById('asistanGonder').onclick = ()=> asistanSoruGonder(document.getElementById('asistanInput').value);
document.getElementById('asistanInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') asistanSoruGonder(document.getElementById('asistanInput').value);
});

// TARAYICI KISITI: Masaüstünde panel sayfa açılır açılmaz kendiliğinden
// (kullanıcı tıklamadan) açıldığı için, çoğu tarayıcı o anda sesli
// okumayı engeller — sesli okuma gerçek bir kullanıcı etkileşimi (tıklama/
// dokunma) gerektirir. Bu yüzden karşılama sesi, sayfadaki İLK gerçek
// tıklamada (hangi öğeye olursa olsun — baloncuk dahil) bir kere çalınır.
function asistanIlkEtkilesimdeSesOku(){
  if(asistanSesOkunduMu) return;
  const body = document.getElementById('asistanBody');
  if(!body || !body.dataset.baslatildi) return; // karşılama mesajı henüz gösterilmediyse bekle
  asistanSesOkunduMu = true;
  asistanSesliOku(ASISTAN_KARSILAMA_METNI);
}
document.addEventListener('click', asistanIlkEtkilesimdeSesOku);
document.addEventListener('touchstart', asistanIlkEtkilesimdeSesOku);
